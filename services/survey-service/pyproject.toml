# 서비스 영역 표준 pyproject (ADR 0003). PyPA 표준(PEP 621)과 src 레이아웃을 따른다.
[project]
name = "openit-survey_service"  # 왜: PyPA 이름 규칙상 밑줄로 시작할 수 없어 접두어를 붙인다
version = "0.1.0"
description = "survey-service 서비스 영역"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # 왜: 기반 이미지(python:3.12)와 같은 minor 로 고정해 개발·이미지 차이를 없앤다(ADR 0006)
classifiers = ["Private :: Do Not Upload"]  # 왜: 내부 영역 패키지가 PyPI 에 올라가는 사고를 막는 PyPA 표준 분류
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",  # 설정은 환경 변수에서(ADR 0005)
  "httpx",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",  # DB 마이그레이션(ADR 0001)
  "prometheus-client",  # /metrics 의 Prometheus 텍스트 노출 형식(Apache-2.0, D111, ADR 0020)
  "pyjwt[crypto]>=2.15.1",
]

# 버전은 쓰지 않는다. uv 가 uv.lock 에 고정한다(`uv add <패키지>`, 개발 의존은 `uv add --dev <패키지>`).
[dependency-groups]
dev = [
  "pytest",
  "pyright",
  "ruff",
  "import-linter",
  "jsonschema",
  "aiosqlite",  # 왜: 마이그레이션 시험이 임시 SQLite 파일을 쓴다(실제 PostgreSQL 은 컨테이너가 필요하다). MIT
  "schemathesis",  # 계약 적합성 시험: 앱을 영역의 OpenAPI 로 시험한다(MIT, ADR 0020)
  "httpx2",  # 왜: starlette TestClient 가 요구한다(httpx 지원은 폐기 예정 경고, BSD-3-Clause)
]

# 계약에서 타입을 만드는 설정(ADR 0020). 다시 만들기: 리포 루트에서 `uv run --project tools/checks openit-gen-contract services/survey-service`
[tool.openit.contract]
openapi = ["survey-service"]  # contracts/openapi/<이름>.yaml
# 왜 schemas: HTTP 작업이 직접 참조하지 않아도 이 영역이 받거나 내는 값들. 이웃 model-runtime 에 보내는 요청·응답(N03·N04),
# 환경 입력(D133), 기계 토큰 표, 접근 토큰 검증(RFC 9068 프로파일), 웹 푸시 내용(C11), 기능 조건(v3), 시간 상한(D125)
schemas = [
  "ExtractionRequest", "ExtractionResult", "ResponseGenerationRequest", "ResponseResult",
  "SurveyServiceEnv", "DevicePlacementTable", "MachineTokenTable", "UserIdentityClaims", "AccessTokenHeader",
  "AccessTokenType", "WebPushPayload", "ModelIoFeatureRequirements", "ModelIoVersion", "TimeBudgetTable",
  "FhirMapping", "ModelStatus", "ReaskLimit", "ExplainStreakLimit", "JobRunInput", "JobRunResult", "JobsDeclaration",
]

[build-system]
requires = ["hatchling"]  # 왜: PyPA 표준 백엔드(PEP 517), MIT
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # 왜: tests.support 의 시험 도구를 import 한다
# 왜: 스모크는 이미지와 docker 가 필요해 `tools/smoke` 가 부른다. 기본 `uv run pytest` 는 이미지 없이 도는 시험만 돈다.
addopts = "-ra --strict-markers -m 'not smoke and not postgres'"
markers = [
  "smoke: 이미지를 띄워 보는 시험(ADR 0004)",
  "postgres: PostgreSQL 16 컨테이너가 필요한 시험(docker 필요). `uv run pytest -m postgres`",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/survey_service/contract"]  # 생성 코드는 생성기가 책임진다(ADR 0020)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 왜: pytest 는 assert 문이 표준 사용법이다
"src/*/store/migrations/**" = ["ANN", "I001"]  # 왜: Alembic 틀이 만드는 모양(리비전 파일)을 그대로 둔다

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = ["src/survey_service/contract", "src/survey_service/store/migrations"]  # 생성 코드는 생성기가, 마이그레이션은 Alembic 틀이 책임진다

# 경계 점검(ADR 0003). 계약 이름이 곧 어떤 규칙인지 말해 준다.
[tool.importlinter]
root_package = "survey_service"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "컴포넌트는 서로 모른다"
type = "independence"
modules = ["survey_service.components.*"]

[[tool.importlinter.contracts]]
name = "컴포넌트는 types 와 contract 밖을 모른다"
type = "forbidden"
source_modules = ["survey_service.components", "survey_service.types", "survey_service.contract"]
forbidden_modules = ["survey_service.link", "survey_service.store", "survey_service.main"]

[[tool.importlinter.contracts]]
name = "영역 밖 통신은 link 에서만"
type = "forbidden"
source_modules = ["survey_service.components", "survey_service.types", "survey_service.contract", "survey_service.store"]
forbidden_modules = ["httpx", "fastapi", "uvicorn", "starlette"]

[[tool.importlinter.contracts]]
name = "DB 접근은 store 에서만"
type = "forbidden"
source_modules = ["survey_service.components", "survey_service.types", "survey_service.contract", "survey_service.link"]
forbidden_modules = ["sqlalchemy", "asyncpg"]

[[tool.importlinter.contracts]]
name = "층 순서"
type = "layers"
layers = ["survey_service.main", "survey_service.link | survey_service.store", "survey_service.components", "survey_service.types", "survey_service.contract"]
