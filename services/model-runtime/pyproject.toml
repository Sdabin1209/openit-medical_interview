# 서비스 영역 표준 pyproject (ADR 0003). PyPA 표준(PEP 621)과 src 레이아웃을 따른다.
[project]
name = "openit-model_runtime"  # 왜: PyPA 이름 규칙상 밑줄로 시작할 수 없어 접두어를 붙인다
version = "0.1.0"
description = "model-runtime 서비스 영역"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # 왜: 기반 이미지(python:3.12)와 같은 minor 로 고정해 개발·이미지 차이를 없앤다(ADR 0006)
classifiers = ["Private :: Do Not Upload"]  # 왜: 내부 영역 패키지가 PyPI 에 올라가는 사고를 막는 PyPA 표준 분류
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",  # 설정은 환경 변수에서(ADR 0005)
  "httpx2",  # 왜: openai SDK 3 가 쓰는 HTTP 클라이언트라 추론 엔진 호출(link/engine.py)이 같은 클라이언트를 쓴다. 시험의 TestClient 도 쓴다(BSD-3-Clause)
  "prometheus-client",  # /metrics 의 Prometheus 텍스트 노출 형식(Apache-2.0, D111, ADR 0020)
  "openit-model-io",
  "openai",
  "oras",
  "pyjwt[crypto]",
  "httpx2",
]

# 버전은 쓰지 않는다. uv 가 uv.lock 에 고정한다(`uv add <패키지>`, 개발 의존은 `uv add --dev <패키지>`).
[dependency-groups]
dev = [
  "pytest",
  "pyright",
  "ruff",
  "import-linter",
  "jsonschema",
  "schemathesis",  # 계약 적합성 시험: 앱을 영역의 OpenAPI 로 시험한다(MIT, ADR 0020)
  "cryptography",
  "pyyaml",
]

# 계약에서 타입을 만드는 설정(ADR 0020). 다시 만들기: 리포 루트에서 `uv run --project tools/checks openit-gen-contract services/model-runtime`
[tool.openit.contract]
openapi = ["model-runtime"]  # contracts/openapi/<이름>.yaml. 영역의 계약 파일이 있으면 그 이름으로 바꾼다
# 왜 schemas 도: 작업이 직접 참조하지 않지만 이 영역의 컴포넌트가 읽는 계약 값(패키지 OCI 매니페스트, 토큰 클레임, 기계 토큰 표, 환경 입력)
schemas = ["ModelPackageOciManifest", "UserIdentityClaims", "AccessTokenHeader", "MachineTokenTable", "ModelRuntimeEnv", "ProblemReason", "ActionExtraction", "ContainerInputs"]

[project.scripts]
package-publish = "model_runtime.publish:main"  # 모델 패키지 게시 도구(관리 노드에서 실행)
model-runtime = "model_runtime.serve:main"  # 서버

[build-system]
requires = ["hatchling"]  # 왜: PyPA 표준 백엔드(PEP 517), MIT
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # 왜: 시험 공용 도구(tests/support.py, tests/fakes)를 import 한다
# 왜: 스모크는 이미지와 docker 가 필요해 `tools/smoke` 가 부른다. 기본 `uv run pytest` 는 이미지 없이 도는 시험만 돈다.
addopts = "-ra --strict-markers -m 'not smoke'"
markers = ["smoke: 이미지를 띄워 보는 시험(ADR 0004)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/model_runtime/contract"]  # 생성 코드는 생성기가 책임진다(ADR 0020)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 왜: pytest 는 assert 문이 표준 사용법이다

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = ["src/model_runtime/contract"]  # 생성 코드는 생성기가 책임진다

# 경계 점검(ADR 0003). 계약 이름이 곧 어떤 규칙인지 말해 준다.
[tool.importlinter]
root_package = "model_runtime"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "컴포넌트는 서로 모른다"
type = "independence"
modules = ["model_runtime.components.*"]

[[tool.importlinter.contracts]]
name = "컴포넌트는 types 와 contract 밖을 모른다"
type = "forbidden"
source_modules = ["model_runtime.components", "model_runtime.types", "model_runtime.contract"]
forbidden_modules = ["model_runtime.link", "model_runtime.store", "model_runtime.main", "model_runtime.serve", "model_runtime.publish"]

[[tool.importlinter.contracts]]
name = "영역 밖 통신은 link 에서만"
type = "forbidden"
source_modules = ["model_runtime.components", "model_runtime.types", "model_runtime.contract", "model_runtime.store"]
forbidden_modules = ["httpx", "fastapi", "uvicorn", "starlette", "requests", "oras", "openai"]

[[tool.importlinter.contracts]]
name = "층 순서"
type = "layers"
layers = ["model_runtime.serve", "model_runtime.main | model_runtime.publish", "model_runtime.link | model_runtime.store", "model_runtime.components", "model_runtime.types", "model_runtime.contract"]

[tool.uv.sources]
openit-model-io = { path = "../../libs/model-io" }
