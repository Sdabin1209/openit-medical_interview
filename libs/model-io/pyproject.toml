# 공유 라이브러리 표준 pyproject (ADR 0003, 0020). 영역과 같은 도구 설정을 쓴다. PyPA 표준(PEP 621)과 src 레이아웃.
[project]
name = "openit-model_io"  # 왜: PyPA 이름 규칙상 밑줄로 시작할 수 없어 접두어를 붙인다
version = "0.1.0"
description = "model-io 공유 라이브러리"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # 왜: 서비스 이미지(python:3.12)와 같은 minor 로 고정한다(ADR 0006)
classifiers = ["Private :: Do Not Upload"]  # 왜: 내부 패키지가 PyPI 에 올라가는 사고를 막는 PyPA 표준 분류
dependencies = [
  "pydantic",
]

# 버전은 쓰지 않는다. uv 가 uv.lock 에 고정한다(`uv add <패키지>`, 개발 의존은 `uv add --dev <패키지>`).
[dependency-groups]
dev = [
  "pytest",
  "pyright",
  "ruff",
  "import-linter",
  "jsonschema",
  "pyyaml",
]

# 계약에서 타입을 만드는 설정(ADR 0020). 다시 만들기: 리포 루트에서 `uv run --project tools/checks openit-gen-contract libs/model-io`
[tool.openit.contract]
schemas = ["ActionExtraction", "ActionExtractionRules", "ExtractionAction", "ExtractionRequest", "ModelInputSerialization", "ResponseGenerationRequest", "ResponseSentence", "QuestionFlowTable", "QuestionFieldSpecs", "StoredSlots", "ViolationCode", "EvaluationReport"]  # 모델 입력 만들기·직렬화·출력 검증·평가 보고서가 쓰는 계약 스키마(docs/design.md 2절)

[build-system]
requires = ["hatchling"]  # 왜: PyPA 표준 백엔드(PEP 517), MIT
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # 왜: 시험 공용 도구(tests/helpers.py)를 import 한다
# 왜 dataset 은 기본에서 뺀다: 학습 서버에서 읽어 온 파일이 필요하다(README 4절의 명령으로 돌린다)
addopts = "-ra --strict-markers -m 'not dataset'"
markers = ["dataset: 학습 서버 학습 파일(MODEL_IO_DATASET_DIR)이 필요한 시험"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/model_io/contract"]  # 생성 코드는 생성기가 책임진다

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 왜: pytest 는 assert 문이 표준 사용법이다

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = ["src/model_io/contract"]  # 생성 코드는 생성기가 책임진다
ignore = ["src/model_io/core/labels_port.py"]  # 정본 labels.py 를 글자 그대로 옮긴 파일(형식을 고치지 않는다, ADR 0003)

# 경계 점검(ADR 0003). 라이브러리는 영역도 통신도 모른다.
[tool.importlinter]
root_package = "model_io"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "라이브러리는 통신과 저장소를 모른다"
type = "forbidden"
source_modules = ["model_io"]
forbidden_modules = ["httpx", "fastapi", "uvicorn", "starlette", "sqlalchemy", "asyncpg"]

[[tool.importlinter.contracts]]
name = "층 순서(core 가 contract 를 쓴다)"
type = "layers"
layers = ["model_io.core", "model_io.contract"]
