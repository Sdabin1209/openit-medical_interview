# 기반 서비스(ADR 0004, 0008)와 영역 서비스(ADR 0023). 영역 이미지의 이름은 ./deploy 가 images.lock 에서 만든 generated/images.env 의 digest 참조다.
# 영역 이미지의 진입점·HEALTHCHECK·USER 는 이미지가 가진다(command·entrypoint·healthcheck·user 를 쓰지 않는다). 기반 서비스(공식 이미지)만 쓴다.
# 규칙: 이미지는 digest 고정, 비밀은 compose secrets(파일), 고정 호스트 포트 없음, 가능하면 읽기 전용 루트.
name: openit

x-area-gateway: &area-gateway
  # 영역 게이트웨이(platform ADR 0007, platform/caddy/area-gateway.md): 서비스 영역마다 하나. 서비스 이름으로 사설 CA 에서 인증서를 받아 TLS(mTLS)를 끝내고 영역 안 서비스에 평문으로 넘긴다.
  image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  # 왜 NET_BIND_SERVICE: ACME http-01 검증은 서비스 이름의 80 번이다. TLS(OPENIT_SERVICE_PORT)와 감시(9100) 포트는 1024 이상이라 권한이 필요 없다
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /data:uid=10001,gid=10001,mode=0700
    - /config:uid=10001,gid=10001,mode=0700

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /run/postgresql]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, keycloak_db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 입구 인증서 에이전트(ADR 0014, platform ADR 0002). ACME(RFC 8555) 클라이언트(Caddy)가 입구와 영역 사이 mTLS 의 인증서를 받고 스스로 갱신한다.
  # 입구(envoy)가 이 컨테이너의 네트워크 이름공간을 쓴다: 공인·사설 CA 의 http-01 검증이 입구의 이름으로 80 번에 접속하고, 입구는 8443 번에서 받는다.
  ingress-acme:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    # 왜 NET_BIND_SERVICE: ACME http-01 검증은 80 번이다. 비root 로 낮은 포트를 열려면 이 권한 하나만 필요하다
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # 왜 tmpfs: Caddy 의 /data·/config 는 이미지에서 root 소유라 비root 가 쓰지 못한다. 상태를 두지 않고 시작할 때마다 새로 받는다(ADR 0013)
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    depends_on:
      step-ca: { condition: service_healthy }
    volumes:
      - ./generated/ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - ingress-certs:/ingress-certs
    ports:
      - "${OPENIT_BIND_ADDRESS}::${OPENIT_LISTEN_PORT}" # 입구(envoy)의 포트. 호스트 포트는 Docker 가 배정한다(고정 포트 없음)
    # 입구가 가질 이름은 generated/compose.platform.yaml(./deploy 가 만든다)이 더한다.
    # 왜 영역 네트워크에 gateway 별칭: 나가는 호출(OPENIT_EGRESS_PROXY)은 입구의 CONNECT 터널을 지난다(D128). 서비스는 자기 영역 네트워크에만 있어 거기서 터널에 닿는다
    networks:
      edge: {}
      backend: {}
      survey-service-area: { aliases: [gateway] }
      model-runtime-area: { aliases: [gateway] }
    healthcheck:
      # 왜 파일 확인: 인증서를 받았는지 본다. 인증서 검증을 끄고 HTTPS 를 두드리지 않는다(검증은 `./deploy ca status` 와 감시가 신뢰 목록으로 한다)
      test: ["CMD-SHELL", "test -s ${OPENIT_AGENT_CERT_FILE} && test -s ${OPENIT_GATEWAY_CERT_FILE}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  envoy:
    image: envoyproxy/envoy:v1.35.3@sha256:4d496918618a7ebd6c71ae8285e31ebff092f3a0a5ad642d50decf4a54eb2456
    restart: unless-stopped
    read_only: true
    user: "10001:10001" # 왜: 인증서 에이전트(같은 uid)가 쓴 키 파일(0600)을 읽는다
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    network_mode: "service:ingress-acme" # 왜: 위 에이전트 설명
    depends_on:
      ingress-acme: { condition: service_healthy }
    volumes:
      - ./generated/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./generated/gateway/sds:/etc/envoy/sds:ro # 인증서 비밀(SDS 파일). 갱신된 인증서는 파일 감시로 다시 읽는다(platform ADR 0002)
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - ${OPENIT_DEVICE_CA_MOUNT}:/etc/openit/device-ca.pem:ro
      - ${OPENIT_INGRESS_ORG_MOUNT}:/etc/openit/ingress:ro
      - ingress-certs:/ingress-certs:ro
    healthcheck:
      # 왜 /dev/tcp: envoy 이미지에 curl 이 없고 bash 는 있다. 관리 인터페이스(컨테이너 안 루프백)의 /ready 를 본다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    # 왜 bash -c: Keycloak 설정 값은 *_FILE 을 지원하지 않는다. 비밀 파일을 이 프로세스 안에서만 환경 변수로 읽고 compose 환경에는 두지 않는다(ADR 0008)
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        export OAUTH2_PROXY_CLIENT_SECRET="$$(cat /run/secrets/oauth2_proxy_client_secret)"
        export OPENIT_REALM_ADMIN_PASSWORD="$$KC_BOOTSTRAP_ADMIN_PASSWORD"
        for file in /run/machine-clients/*; do
          [ -f "$$file" ] || continue
          name="$$(basename "$$file" | tr 'a-z-' 'A-Z_')"
          export "MACHINE_CLIENT_SECRET_$$name=$$(cat "$$file")"
        done
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: ${OPENIT_PUBLIC_BASE_URL} # 발급자(iss)는 ${OPENIT_OIDC_ISSUER_URL} 이 된다(realm openit)
      KC_HTTP_ENABLED: "true" # TLS 는 게이트웨이(Envoy)에서 끝낸다
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    secrets: [keycloak_db_password, keycloak_admin_password, oauth2_proxy_client_secret]
    volumes:
      - ./generated/identity/openit-realm.json:/opt/keycloak/data/import/openit-realm.json:ro
      - ./secrets/machine-clients:/run/machine-clients:ro
    networks: [backend]
    healthcheck:
      # 관리 포트(9000)의 /health/ready. 이미지에 curl 이 없어 bash /dev/tcp 로 본다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 화면 로그인 앞단(identity_proxy). 입구(envoy)가 사람 인증 경로의 세션을 이 서비스에 묻는다(ext_authz). 세션이 있으면 접근 토큰을 돌려준다.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0@sha256:786bed0f000c0f8a7b31619244ebab02406a8856a4faf3f5fb1df61fbd6c30ed
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak: { condition: service_healthy }
      envoy: { condition: service_healthy } # 발급자 주소는 입구를 지난다(OIDC 디스커버리를 시작할 때 읽는다)
    volumes:
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
    command:
      - --provider=oidc # 왜: keycloak-oidc 제공자는 groups 에 role: 접두어 항목을 더한다. oidc 제공자는 groups 클레임(Keycloak 매퍼가 내는 realm 역할)만 담는다(platform ADR 0004)
      - --oidc-issuer-url=${OPENIT_OIDC_ISSUER_URL}
      - --provider-ca-file=/etc/openit/trust-list.pem # 신뢰 목록의 루트로 발급자(입구)의 인증서를 검증한다(검증을 끄지 않는다)
      - --client-id=oauth2-proxy
      - --client-secret-file=/run/secrets/oauth2_proxy_client_secret
      - --cookie-secret-file=/run/secrets/oauth2_proxy_cookie_secret
      - --redirect-url=${OPENIT_PUBLIC_BASE_URL}/oauth2/callback
      - --code-challenge-method=S256 # PKCE(RFC 7636)
      - --cookie-secure=true
      # 왜 refresh: 접근 토큰 수명(5분, identity.py)이 세션 쿠키보다 훨씬 짧다. 수명의 4/5 마다 갱신 토큰으로 새 접근 토큰을 받아 두지 않으면 5분마다 다시 로그인해야 한다
      - --cookie-refresh=${OPENIT_PROXY_COOKIE_REFRESH}
      - --cookie-expire=${OPENIT_PROXY_COOKIE_EXPIRE}
      - --cookie-samesite=lax
      - --reverse-proxy=true # 입구가 붙이는 X-Forwarded-* 를 믿는다(입구만 이 서비스에 닿는다)
      - --email-domain=*
      - --oidc-email-claim=sub # 왜: realm 의 계정에 이메일이 없을 수 있다. 계정 식별은 sub 이다(계약 UserId)
      - --insecure-oidc-allow-unverified-email=true # 왜: 위 이유로 이메일을 쓰지 않으므로 이메일 확인 여부는 보지 않는다
      - --skip-provider-button=true
      - --api-route=^/v1/ # 왜: 계약의 API 경로(/v1/…)는 로그인 화면으로 보내지 않고 401 을 준다
      - --set-xauthrequest=true
      - --pass-access-token=true # 응답 머리글 X-Auth-Request-Access-Token 으로 접근 토큰을 입구에 준다
      - --http-address=0.0.0.0:4180
      - --upstream=static://200 # 왜 200: 입구의 ext_authz 는 200 만 통과로 본다(그 밖의 상태는 거절로 보고 응답을 클라이언트에 돌려준다)
    secrets: [oauth2_proxy_client_secret, oauth2_proxy_cookie_secret]
    networks: [backend]
    # healthcheck 없음: 이미지가 셸·HTTP 클라이언트 없는 distroless 라 컨테이너 안에서 점검할 수단이 없다(ADR 0008)

  # 사설 CA(ADR 0014). 루트·중간 CA 파일과 ca.json 은 `./deploy bootstrap` 이 deploy/pki/ 에 만든다. 루트 개인 키는 이 컨테이너에 주지 않는다.
  step-ca:
    image: smallstep/step-ca:0.28.4@sha256:0f88382ac5af5c6b7bbba0c6e8fcefef52aee6f22ea364df8e02a09ffd0d22f3
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # 왜 NET_BIND_SERVICE: step-ca 실행 파일에 이 파일 권한(setcap)이 붙어 있어, 허용 집합에 없으면 exec 가 거부된다(시험에서 확인). 9000 포트에는 필요 없지만 이 하나만 남긴다
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      PWDPATH: /run/secrets/step_ca_password # 이미지의 기본 진입 명령이 --password-file 로 읽는다
    secrets: [step_ca_password, step_ca_intermediate_key]
    volumes:
      - ./pki/ca/ca.json:/home/step/config/ca.json:ro
      - ./pki/ca/root_ca.crt:/home/step/certs/root_ca.crt:ro
      - ./pki/ca/intermediate_ca.crt:/home/step/certs/intermediate_ca.crt:ro
      # 왜 /home/step 전체: 새 볼륨은 마운트 위치에 이미지가 가진 내용과 소유자를 물려받는다. /home/step 은 step 사용자(uid 1000) 소유라 db 를 쓸 수 있다(/home/step/db 만 마운트하면 root 소유가 된다, 시험에서 확인)
      - step-ca-data:/home/step
    networks: [backend]
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 이미지 레지스트리(ADR 0013). 저장소는 distribution/registry(Apache-2.0), TLS 는 앞단 Caddy 가 ACME 로 step-ca 에서 받는다(ADR 0014).
  registry-store:
    profiles: [local-registry] # OPENIT_REGISTRY_MODE=local 일 때만(./deploy 가 --profile 을 준다)
    image: registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 왜 root: 이미지의 /var/lib/registry 가 root 소유라 이름 있는 볼륨도 root 소유로 만들어진다. 비root 로는 쓸 수 없다(시험에서 확인, ADR 0013)
    # 그래서 위 cap_drop 으로 권한을 모두 버린다. root 라도 DAC 우회(CAP_DAC_OVERRIDE) 없이 자기 소유 볼륨만 쓴다
    volumes:
      - registry-data:/var/lib/registry
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    profiles: [local-registry]
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    # 왜 NET_BIND_SERVICE: ACME http-01 검증은 80 번, 서비스는 443 번이다. 비root 로 낮은 포트를 열려면 이 권한 하나만 필요하다
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # 왜 tmpfs: Caddy 의 /data 는 이미지에서 root 소유라 비root 가 쓰지 못한다. 상태(ACME 계정, 인증서)를 두지 않고 시작할 때마다 새로 발급받는다
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    depends_on:
      step-ca: { condition: service_healthy }
      registry-store: { condition: service_healthy }
    volumes:
      - ../platform/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-bundle.pem:ro
    environment:
      OPENIT_REGISTRY_NAMES: ${OPENIT_REGISTRY_NAMES}
      OPENIT_ACME_DIRECTORY_URL: ${OPENIT_INTERNAL_ACME_DIRECTORY_URL}
    ports:
      - "${OPENIT_BIND_ADDRESS}::443" # 호스트 포트는 Docker 가 배정한다(고정 포트 없음)
    networks: [edge, backend]
    healthcheck:
      # 왜 파일 확인: 인증서를 받았고 뒤의 저장소가 응답하는지 본다. 인증서 검증을 끄고 HTTPS 를 두드리지 않는다. 검증은 `./deploy ca status` 와 감시(blackbox)가 신뢰 목록으로 한다
      test: ["CMD-SHELL", "find /data/caddy/certificates -name '*.crt' | grep -q . && wget -q -O /dev/null http://registry-store:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # 레지스트리 클라이언트(ADR 0013). `./deploy` 가 push·pull·존재 확인에만 일회용으로 돌린다(`compose run`). 상시 서비스가 아니다.
  registry-client:
    profiles: [tools]
    image: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SSL_CERT_FILE: /etc/openit/trust-bundle.pem # Go 가 읽는 신뢰 저장소 지정. 신뢰 목록의 루트만 믿는다
    volumes:
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-bundle.pem:ro
    networks: [backend]

  # 이미지·Dockerfile 보안 검사(ADR 0016). `./deploy build` 가 일회용으로 돌린다(`compose run`). 취약점 DB 는 인터넷에서 받아 리포의 .trivy-cache/ 에 둔다.
  trivy:
    profiles: [tools]
    image: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TRIVY_CACHE_DIR: /cache
      TRIVY_NO_PROGRESS: "true"

  # 감시(ADR 0014). blackbox_exporter 가 TLS 로 접속해 인증서 만료 시각(probe_ssl_earliest_cert_expiry)을 재고, Prometheus 가 규칙으로 경보를 판정한다.
  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ../platform/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-bundle.pem:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 경보 수신(platform ADR 0005). 수신처는 설치 설정(OPENIT_ALERT_RECEIVER_URL)이고 ./deploy 가 설정을 만든다. 비어 있으면 경보를 어디로도 보내지 않는다.
  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./generated/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./generated/monitoring/receiver-url:/etc/alertmanager/receiver-url:ro
      - alertmanager-data:/alertmanager
    networks: [edge, backend] # 왜 edge: 경보 수신처(웹훅, SMTP)는 서버 밖이다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      blackbox: { condition: service_healthy }
      alertmanager: { condition: service_healthy }
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d # Prometheus 의 기본값. 측정해서 정한 값이 아니다(ADR 0014)
    volumes:
      - ../platform/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../platform/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - ./generated/monitoring/tls-targets.yml:/etc/prometheus/tls-targets.yml:ro # ./deploy bootstrap 이 설정에서 만든다
      - ./generated/monitoring/area-targets.yml:/etc/prometheus/area-targets.yml:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - prometheus-data:/prometheus
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---- survey-service(영역 서비스, ADR 0023). DB 는 영역이 가진다(공유 DB 없음, D126). 영역 네트워크에는 게이트웨이와 DB 만 있다 ----
  survey-db:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /run/postgresql]
    environment:
      POSTGRES_USER: survey
      POSTGRES_DB: survey
      POSTGRES_PASSWORD_FILE: /run/secrets/survey_db_password
    secrets: [survey_db_password]
    volumes:
      - survey-db-data:/var/lib/postgresql/data
    networks: [survey-service-area]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username survey --dbname survey"]
      interval: 5s
      timeout: 3s
      retries: 10

  survey-service:
    image: ${OPENIT_IMAGE_SURVEY_SERVICE}
    pull_policy: never # 왜: digest 로 이미 엔진에 있는 이미지다(./deploy build 또는 pull 이 만든다). 없으면 up 이 먼저 막는다
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on:
      survey-db: { condition: service_healthy }
      survey-service-gateway: { condition: service_healthy }
    environment:
      OPENIT_LOG_LEVEL: INFO
      OPENIT_LISTEN_PORT: "8080"
      OPENIT_OIDC_ISSUER_URL: ${OPENIT_OIDC_ISSUER_URL}
      OPENIT_ROOT_CERTIFICATE_FILE: /etc/openit/trust-list.pem
      OPENIT_OIDC_AUDIENCE: survey-service
      OPENIT_EGRESS_PROXY: ${OPENIT_EGRESS_PROXY_SURVEY_SERVICE}
      OPENIT_TLS_CERTIFICATE_FILE: ${OPENIT_AREA_CRT_SURVEY_SERVICE}
      OPENIT_TLS_PRIVATE_KEY_FILE: ${OPENIT_AREA_KEY_SURVEY_SERVICE}
      OPENIT_DATABASE_URL: postgresql://survey@survey-db:5432/survey
      OPENIT_DATABASE_PASSWORD_FILE: /run/secrets/survey_db_password
      OPENIT_MODEL_RUNTIME_URL: https://model-runtime:${OPENIT_SERVICE_PORT}
      OPENIT_MODEL_RUNTIME_CLIENT_SECRET_FILE: /run/machine-clients/survey-service
      OPENIT_MACHINE_TOKENS_FILE: /etc/openit/machine-callers.json
      OPENIT_VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      OPENIT_VAPID_SUBJECT: ${OPENIT_VAPID_SUBJECT}
    secrets: [survey_db_password, vapid_private_key]
    volumes:
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - ./machine-callers.json:/etc/openit/machine-callers.json:ro
      - ./secrets/machine-clients/survey-service:/run/machine-clients/survey-service:ro
      - survey-service-certs:/area-certs:ro
    networks: [survey-service-area]

  survey-service-gateway:
    <<: *area-gateway
    depends_on:
      step-ca: { condition: service_healthy }
    environment:
      OPENIT_AREA_NAME: survey-service
      OPENIT_AREA_UPSTREAM: survey-service:8080
      OPENIT_SERVICE_PORT: ${OPENIT_SERVICE_PORT}
      OPENIT_INTERNAL_ACME_DIRECTORY_URL: ${OPENIT_INTERNAL_ACME_DIRECTORY_URL}
    volumes:
      - ../platform/caddy/area-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - survey-service-certs:/area-certs
    # 서비스 이름의 별칭은 게이트웨이만 갖는다: 입구·감시·이웃이 게이트웨이로만 온다(서비스 컨테이너는 별칭이 없다)
    networks:
      backend: { aliases: [survey-service] }
      survey-service-area: {}
    healthcheck:
      # 왜 파일 확인: 인증서와 키를 받았는지 본다(platform/caddy/area-gateway.md). 클라이언트 인증서가 없는 TLS 연결은 거절되고 검증을 끄고 두드리지 않는다
      test: ["CMD-SHELL", "${OPENIT_AREA_HEALTH_SURVEY_SERVICE}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  # ---- model-runtime(영역 서비스) + 추론 엔진(vLLM, 서빙 GPU 서버 배치, design.md 6절) ----
  model-runtime:
    image: ${OPENIT_IMAGE_MODEL_RUNTIME}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on:
      model-runtime-gateway: { condition: service_healthy }
      # 왜 required: false: 추론 엔진은 서빙 GPU 서버에서만 돈다(프로파일 inference-engine, OPENIT_INFERENCE_ENGINE_LOCAL). 엔진이 없는 배치에서는 준비되지 않은 상태(readyz 503)로 선다
      inference-engine: { condition: service_started, required: false }
    environment:
      OPENIT_LOG_LEVEL: INFO
      OPENIT_LISTEN_PORT: "8080"
      OPENIT_OIDC_ISSUER_URL: ${OPENIT_OIDC_ISSUER_URL}
      OPENIT_ROOT_CERTIFICATE_FILE: /etc/openit/trust-list.pem
      OPENIT_OIDC_AUDIENCE: model-runtime
      OPENIT_EGRESS_PROXY: ${OPENIT_EGRESS_PROXY_MODEL_RUNTIME}
      OPENIT_TLS_CERTIFICATE_FILE: ${OPENIT_AREA_CRT_MODEL_RUNTIME}
      OPENIT_TLS_PRIVATE_KEY_FILE: ${OPENIT_AREA_KEY_MODEL_RUNTIME}
      OPENIT_REGISTRY_URL: https://${OPENIT_REGISTRY_HOST}
      OPENIT_REGISTRY_REPOSITORY: ${OPENIT_MODEL_REGISTRY_REPOSITORY}
      OPENIT_REGISTRY_CREDENTIALS_FILE: /run/secrets/registry_credentials
      OPENIT_MACHINE_TOKENS_FILE: /etc/openit/machine-callers.json
      OPENIT_MODEL_PROFILE: ${OPENIT_MODEL_PROFILE}
      OPENIT_MODEL_CACHE_DIR: /var/lib/openit/model-runtime/cache
      OPENIT_INFERENCE_ENGINE_URL: http://inference-engine:8000
    secrets: [registry_credentials]
    volumes:
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - ./machine-callers.json:/etc/openit/machine-callers.json:ro
      - model-runtime-data:/var/lib/openit/model-runtime
      - model-runtime-certs:/area-certs:ro
    networks: [model-runtime-area]

  model-runtime-gateway:
    <<: *area-gateway
    depends_on:
      step-ca: { condition: service_healthy }
    environment:
      OPENIT_AREA_NAME: model-runtime
      OPENIT_AREA_UPSTREAM: model-runtime:8080
      OPENIT_SERVICE_PORT: ${OPENIT_SERVICE_PORT}
      OPENIT_INTERNAL_ACME_DIRECTORY_URL: ${OPENIT_INTERNAL_ACME_DIRECTORY_URL}
    volumes:
      - ../platform/caddy/area-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - model-runtime-certs:/area-certs
    # 서비스 이름의 별칭은 게이트웨이만 갖는다: 입구·감시·이웃이 게이트웨이로만 온다(서비스 컨테이너는 별칭이 없다)
    networks:
      backend: { aliases: [model-runtime] }
      model-runtime-area: {}
    healthcheck:
      # 왜 파일 확인: 인증서와 키를 받았는지 본다(platform/caddy/area-gateway.md). 클라이언트 인증서가 없는 TLS 연결은 거절되고 검증을 끄고 두드리지 않는다
      test: ["CMD-SHELL", "${OPENIT_AREA_HEALTH_MODEL_RUNTIME}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  # 추론 엔진(vLLM 공식 이미지, Apache-2.0). 서빙 GPU 서버에서만 띄운다(OPENIT_INFERENCE_ENGINE_LOCAL=true 일 때 ./deploy 가 프로파일을 켠다).
  # 어댑터 폴더는 model-runtime 과 같은 경로로 읽기 전용 마운트한다(vLLM 의 lora_path 가 엔진 컨테이너에서 보는 경로, 계약 ModelRuntimeEnv).
  inference-engine:
    profiles: [inference-engine]
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 왜 command: 공식 이미지의 서버 인자다(영역 이미지가 아니다). --model 은 프로파일의 기반 모델이다(OPENIT_BASE_MODEL, --served-model-name 으로 바꾸지 않는다:
    # model-runtime 의 /readyz 가 GET /v1/models 에서 프로파일의 기반 모델을 찾는다, model-runtime ADR 0007). 어댑터는 런타임 LoRA 갱신 API 로 올린다
    command: ["--model", "${OPENIT_BASE_MODEL}", "--enable-lora", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True" # 왜: /v1/load_lora_adapter 는 이 설정이 있어야 열린다(vLLM 문서). model-runtime 의 link/engine.py 가 이 API 를 쓴다
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    volumes:
      - model-runtime-data:/var/lib/openit/model-runtime:ro
    networks: [model-runtime-area]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  # ---- 화면 둘(정적 서버, ADR 0011). 입구가 경로 접두어(/console/, /kiosk/)로 나눠 보낸다 ----
  admin-console:
    image: ${OPENIT_IMAGE_WEB_ADMIN_CONSOLE}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    networks: [admin-console-area]

  admin-console-gateway:
    <<: *area-gateway
    depends_on:
      step-ca: { condition: service_healthy }
    environment:
      OPENIT_AREA_NAME: admin-console
      OPENIT_AREA_UPSTREAM: admin-console:8080
      OPENIT_SERVICE_PORT: ${OPENIT_SERVICE_PORT}
      OPENIT_INTERNAL_ACME_DIRECTORY_URL: ${OPENIT_INTERNAL_ACME_DIRECTORY_URL}
    volumes:
      - ../platform/caddy/area-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - admin-console-certs:/area-certs
    # 서비스 이름의 별칭은 게이트웨이만 갖는다: 입구·감시·이웃이 게이트웨이로만 온다(서비스 컨테이너는 별칭이 없다)
    networks:
      backend: { aliases: [admin-console] }
      admin-console-area: {}
    healthcheck:
      # 왜 파일 확인: 인증서와 키를 받았는지 본다(platform/caddy/area-gateway.md). 클라이언트 인증서가 없는 TLS 연결은 거절되고 검증을 끄고 두드리지 않는다
      test: ["CMD-SHELL", "${OPENIT_AREA_HEALTH_ADMIN_CONSOLE}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  kiosk-frontend:
    image: ${OPENIT_IMAGE_WEB_KIOSK_FRONTEND}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    networks: [kiosk-frontend-area]

  kiosk-frontend-gateway:
    <<: *area-gateway
    depends_on:
      step-ca: { condition: service_healthy }
    environment:
      OPENIT_AREA_NAME: kiosk-frontend
      OPENIT_AREA_UPSTREAM: kiosk-frontend:8080
      OPENIT_SERVICE_PORT: ${OPENIT_SERVICE_PORT}
      OPENIT_INTERNAL_ACME_DIRECTORY_URL: ${OPENIT_INTERNAL_ACME_DIRECTORY_URL}
    volumes:
      - ../platform/caddy/area-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPENIT_TRUST_LIST_FILE}:/etc/openit/trust-list.pem:ro
      - kiosk-frontend-certs:/area-certs
    # 서비스 이름의 별칭은 게이트웨이만 갖는다: 입구·감시·이웃이 게이트웨이로만 온다(서비스 컨테이너는 별칭이 없다)
    networks:
      backend: { aliases: [kiosk-frontend] }
      kiosk-frontend-area: {}
    healthcheck:
      # 왜 파일 확인: 인증서와 키를 받았는지 본다(platform/caddy/area-gateway.md). 클라이언트 인증서가 없는 TLS 연결은 거절되고 검증을 끄고 두드리지 않는다
      test: ["CMD-SHELL", "${OPENIT_AREA_HEALTH_KIOSK_FRONTEND}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

networks:
  edge: {}
  backend:
    internal: true # 왜: 기반 서비스끼리만 만나고 밖으로 나가는 길이 없다(외부 호출은 게이트웨이의 CONNECT 터널만, 워크스페이스 D128)
  # 영역 전용 내부 네트워크(ADR 0023): 영역 서비스·영역 DB·그 영역 게이트웨이만 있다. 서비스 컨테이너는 여기에만 있어 영역 게이트웨이만 서비스에 닿는다
  # (X-Forwarded-Client-Cert 를 믿는 근거, 계약 device_mtls). internal: 밖으로 나가는 길이 없다(나가는 호출은 입구의 CONNECT 터널만, D128)
  survey-service-area: { internal: true }
  model-runtime-area: { internal: true }
  admin-console-area: { internal: true }
  kiosk-frontend-area: { internal: true }

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  keycloak_db_password: { file: ./secrets/keycloak_db_password }
  keycloak_admin_password: { file: ./secrets/keycloak_admin_password }
  oauth2_proxy_client_secret: { file: ./secrets/oauth2_proxy_client_secret }
  oauth2_proxy_cookie_secret: { file: ./secrets/oauth2_proxy_cookie_secret }
  step_ca_password: { file: ./secrets/step_ca_password }
  step_ca_intermediate_key: { file: ./pki/ca/intermediate_ca.key }
  survey_db_password: { file: ./secrets/survey_db_password }
  vapid_private_key: { file: ./secrets/vapid_private_key }
  registry_credentials: { file: ./secrets/registry_credentials }

volumes:
  postgres-data: {}
  alertmanager-data: {}
  # 왜 tmpfs 볼륨: 입구 에이전트(쓰는 쪽)와 입구(읽는 쪽)가 같은 폴더를 uid 10001 소유로 나눠 쓴다. 이름 있는 일반 볼륨은 root 소유라 비root 가 쓰지 못한다. 메모리에 두므로 서버가 다시 켜지면 새로 받는다
  ingress-certs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700" }
  step-ca-data: {}
  registry-data: {}
  prometheus-data: {}
  survey-db-data: {}
  # 영역 데이터: 활성화 기록과 받은 모델 패키지(어댑터)가 남는다. 엔진이 같은 경로로 읽기 전용 마운트한다
  model-runtime-data: {}
  # 영역 게이트웨이가 받은 인증서(서비스가 읽기 전용으로 마운트해 이웃을 부를 때 클라이언트 인증서로 쓴다). 입구 인증서 볼륨과 같은 이유로 tmpfs 형식·uid 10001
  survey-service-certs: &area-certs
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700" }
  model-runtime-certs: *area-certs
  admin-console-certs: *area-certs
  kiosk-frontend-certs: *area-certs
