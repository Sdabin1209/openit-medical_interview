# 정적 화면 서빙(ADR 0010). nginx-unprivileged 는 8080 에서 듣고 비root(uid 101)로 돈다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 왜: 화면은 서버 버전 정보를 알릴 이유가 없다
    server_tokens off;
    include /etc/nginx/conf.d/security-headers.inc;

    # 살아 있음: nginx 가 요청을 받으면 200. 본문은 계약 HealthReport 다(contracts/openapi/kiosk-frontend.yaml, D111)
    location = /healthz {
        default_type application/json;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 '{"status":"pass","service":"kiosk-frontend"}';
    }

    # 지표: 계약 /metrics(Prometheus 텍스트 노출 형식 0.0.4). 정적 화면이라 서버가 셀 것이 없어 살아 있음 지표 하나만 낸다.
    # 서비스가 반드시 내는 지표(RequiredPrometheusMetric)는 turn·model 호출 지표라 이 화면에는 해당이 없다
    location = /metrics {
        default_type "text/plain; version=0.0.4";
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "# HELP kiosk_frontend_up 화면 서버가 응답하면 1\n# TYPE kiosk_frontend_up gauge\nkiosk_frontend_up 1\n";
    }

    # 준비됨: 빌드한 화면 파일(index.html)이 있어야 200(HealthReport). 없으면 503 ProblemDetails(application/problem+json)
    location = /readyz {
        default_type application/json;
        error_page 503 = @not_ready;
        include /etc/nginx/conf.d/security-headers.inc;
        if (!-f $document_root/index.html) {
            return 503;
        }
        return 200 '{"status":"pass","service":"kiosk-frontend","checks":[{"name":"index.html","status":"pass"}]}';
    }

    location @not_ready {
        default_type application/problem+json;
        # 왜 5: 계약 RetryAfterSeconds 의 예시 값이다. 측정으로 정한 값이 아니다
        add_header Retry-After 5 always;
        include /etc/nginx/conf.d/security-headers.inc;
        return 503 '{"type":"about:blank","title":"의존이 준비되지 않았다","status":503,"detail":"준비되지 않은 점검: index.html","instance":"/readyz"}';
    }

    # 해시가 붙은 정적 파일은 오래 캐시한다(Vite 가 내용 해시를 파일 이름에 넣는다)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # 왜 index.html 은 캐시하지 않는다: 새 배포의 해시 파일 이름을 바로 알아야 한다
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        # SPA 라우팅(react-router): 파일이 없는 경로는 index.html 로
        try_files $uri $uri/ /index.html;
    }
}
