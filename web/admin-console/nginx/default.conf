# 정적 화면 서빙(ADR 0010). nginx-unprivileged 는 8080 에서 듣고 비root(uid 101)로 돈다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 왜: 화면은 서버 버전 정보를 알릴 이유가 없다
    server_tokens off;

    # 살아 있음: nginx 가 요청을 받으면 200. 본문은 계약 HealthReport 다(contracts/openapi/platform.yaml, D111)
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"pass","service":"admin-console"}';
    }

    # 준비됨: 빌드한 화면 파일(index.html)이 있어야 200(HealthReport). 없으면 503 ProblemDetails(application/problem+json)
    location = /readyz {
        default_type application/json;
        error_page 503 = @not_ready;
        if (!-f $document_root/console/index.html) {
            return 503;
        }
        return 200 '{"status":"pass","service":"admin-console","checks":[{"name":"index.html","status":"pass"}]}';
    }

    location @not_ready {
        default_type application/problem+json;
        # 왜 5: 계약 RetryAfterSeconds 의 예시 값이다. 측정으로 정한 값이 아니다
        add_header Retry-After 5 always;
        return 503 '{"type":"about:blank","title":"의존이 준비되지 않았다","status":503,"detail":"준비되지 않은 점검: index.html","instance":"/readyz"}';
    }

    # 제3자 고지(ADR 0018): 파일은 html 루트에 있고(점검이 그 자리를 본다) 입구가 여는 접두어 아래 주소로 내보낸다
    location = /console/THIRD_PARTY_NOTICES.txt {
        alias /usr/share/nginx/html/THIRD_PARTY_NOTICES.txt;
        default_type text/plain;
    }

    # 해시가 붙은 정적 파일은 오래 캐시한다(Vite 가 내용 해시를 파일 이름에 넣는다)
    location /console/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 왜 index.html 은 캐시하지 않는다: 새 배포의 해시 파일 이름을 바로 알아야 한다
    location /console/ {
        add_header Cache-Control "no-cache";
        # SPA 라우팅(react-router): 파일이 없는 경로는 index.html 로. 입구는 경로를 바꾸지 않으므로 파일은 html/console/ 아래에 있다(ADR 접두어 절)
        try_files $uri $uri/ /console/index.html;
    }
}
