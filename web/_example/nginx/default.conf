# 정적 화면 서빙(ADR 0010). nginx-unprivileged 는 8080 에서 듣고 비root(uid 101)로 돈다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 왜: 화면은 서버 버전 정보를 알릴 이유가 없다
    server_tokens off;

    # 살아 있음: nginx 가 요청을 받으면 200
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # 준비됨: 빌드한 화면 파일(index.html)이 있어야 200
    location = /readyz {
        default_type application/json;
        if (!-f $document_root/index.html) {
            return 503 '{"status":"not_ready","failed":["index.html"]}';
        }
        return 200 '{"status":"ready","failed":[]}';
    }

    # 해시가 붙은 정적 파일은 오래 캐시한다(Vite 가 내용 해시를 파일 이름에 넣는다)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 왜 index.html 은 캐시하지 않는다: 새 배포의 해시 파일 이름을 바로 알아야 한다
    location / {
        add_header Cache-Control "no-cache";
        # SPA 라우팅(react-router): 파일이 없는 경로는 index.html 로
        try_files $uri $uri/ /index.html;
    }
}
