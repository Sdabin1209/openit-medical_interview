openapi: 3.1.0
info:
  title: 템플릿 예시 계약(health)
  version: 0.1.0
  description: 템플릿의 생성 파이프라인을 시험하는 예시다. 실제 영역은 contracts/ 의 OpenAPI 로 생성한다.
paths:
  /healthz:
    get:
      operationId: getHealthz
      responses:
        "200":
          description: 살아 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
  /readyz:
    get:
      operationId: getReadyz
      responses:
        "200":
          description: 준비됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readyz"
        "503":
          description: 의존이 준비되지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readyz"
components:
  schemas:
    Healthz:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
          description: 프로세스가 요청을 받을 수 있으면 ok.
    Readyz:
      type: object
      required: [status, failed]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          description: 모든 의존이 준비되면 ready.
        failed:
          type: array
          items:
            type: string
          description: 준비되지 않은 점검의 이름 목록.
