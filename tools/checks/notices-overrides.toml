# 패키지가 라이선스 전문 파일을 싣지 않을 때 쓰는 대체 전문(ADR 0018). 파일이 있는 패키지에는 적용하지 않는다.
# 항목마다 근거(reason)가 있어야 하고, 점검이 읽은 라이선스 식별자(license)가 같을 때만 적용된다(라이선스가 바뀌면 풀린다).
# 항목 형식:
# [[text]]
# ecosystem = "python"   # 또는 "npm"
# name = "패키지"
# license = "패키지 메타데이터의 라이선스 식별자 그대로"
# reason = "파일이 없다는 확인과 이 전문을 고른 근거(날짜)"
# text = """라이선스 전문(표준 전문 + 패키지 메타데이터의 저자)"""

[[text]]
ecosystem = "npm"
name = "react-remove-scroll-bar"
license = "MIT"
reason = "npm 타르볼(2.3.8)에 LICENSE 파일이 없다(npm ci 로 설치해 폴더 목록을 직접 확인, 2026-11-10). package.json 의 license 는 MIT 이고 README 의 License 절도 MIT 다. 아래는 SPDX 의 표준 MIT 전문에 package.json 의 author(Anton Korzunov)를 저작권자로 넣은 것이다. 저작 연도는 패키지가 밝히지 않아 쓰지 않았다"
