# platform 영역(기성품 구성)의 설정 생성기와 시험. 서비스가 아니므로 이미지가 없고 ./deploy 가 이 코드를 읽어 설정 파일을 만든다(ADR 0003 의 구조를 설정 영역에 맞춰 줄였다).
[project]
name = "openit-platform"
version = "0.1.0"
description = "platform 영역: 입구(Envoy)·사람 인증(Keycloak)·화면 로그인(oauth2-proxy)·사설 CA(step-ca)·감시(Prometheus)의 설정을 만든다"
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "cryptography",  # 인증서 읽기·검증(Apache-2.0 OR BSD-3-Clause)
  "pydantic",  # 계약 타입(생성물)으로 입력을 검증한다(MIT)
  "pyyaml",  # Envoy·Prometheus·Alertmanager 설정은 YAML 이다(MIT)
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "pyright",
  "jsonschema",  # 시험이 Keycloak 토큰을 계약 스키마(UserIdentityClaims)로 검증한다(MIT)
  "rfc3339-validator",  # jsonschema 의 format 단언(date-time)에 필요하다(MIT)
  "rfc3986-validator",  # jsonschema 의 format 단언(uri)에 필요하다(MIT)
  "urllib3",  # 시험이 게시된 포트로 TLS 요청을 보낸다(MIT)
]

# 계약에서 타입을 만드는 설정(ADR 0020). 다시 만들기: 리포 루트에서 `uv run --project tools/checks openit-gen-contract platform`
[tool.openit.contract]
schemas = [
  "Exposure", "ExposureAudience", "DeviceAllowlist", "MachineTokenTable", "MachineRole", "UserRole",
  "IngressCertificateMode", "CaMode", "ServiceName", "ForwardedClientCertValue", "UserIdentityClaims", "AccessTokenHeader",
  "AlertReceiverUrl", "GatewayConnectLimitSeconds", "GatewayPatientRouteLimitSeconds", "AlertStreamHeartbeatSeconds",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openit_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 왜: 샌드박스 시험은 docker 와 이미지가 필요하다(`platform/tests/run-scenarios` 가 부른다). 기본 `uv run pytest` 는 docker 없이 도는 시험만 돈다.
# 왜 basetemp: /tmp/pytest-of-<사용자> 는 다른 소유자가 만들어 두면 쓸 수 없다. 리포의 git 제외 폴더에 둔다
addopts = "-ra --strict-markers -m 'not sandbox' --basetemp=.pytest_cache/tmp"
markers = ["sandbox: 컨테이너를 띄우는 시험(D123)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 180
src = ["src", "tests"]
extend-exclude = ["src/openit_platform/contract"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/openit_platform/contract"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
