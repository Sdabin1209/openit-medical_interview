# Prometheus 설정(ADR 0014, platform ADR 0005). 인증서 만료 감시와 각 영역의 /metrics 수집, 경보를 Alertmanager 로 보낸다.
global:
  scrape_interval: 1m # 왜: 인증서 만료는 시간·일 단위로 변한다. 1분이면 충분하고 부하가 작다. 측정하지 않았다
  evaluation_interval: 1m
rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/job-rules.yml # ./deploy 가 스케줄에 있는 잡마다 만든다(성공 기록 없음 경보, deploy ADR 0028)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  # 영역의 /metrics(계약: 영역 안에서만 닿는다). 영역 게이트웨이가 TLS 포트와 별개의 평문 감시 포트(9100)로 서비스에 이어 준다.
  # 왜 평문: backend 내부 네트워크에서만 닿고 입구로는 나가지 않으며, 클라이언트 인증서 없는 감시 호출을 TLS 포트가 거절하기 때문이다(platform ADR 0007).
  # 대상은 노출 선언이 있는 서비스이고 ./deploy 가 만든다
  - job_name: openit-areas
    scheme: http
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/area-targets.yml]
  - job_name: openit-tls
    metrics_path: /probe
    params:
      module: [tls_connect]
    file_sd_configs:
      # 왜 파일: 감시 대상이 설정에 따라 다르다(레지스트리는 local 일 때만). ./deploy bootstrap 이 설정에서 만들고 Prometheus 가 변경을 스스로 읽는다
      - files: [/etc/prometheus/tls-targets.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # 스케줄러가 돌린 잡의 결과(종료 코드, 마지막 성공 시각, 주기). ./deploy schedule run 이 Pushgateway 에 올린 것을 긁는다(deploy ADR 0028).
  # 왜 honor_labels: 올릴 때 정한 job·job_name 라벨을 긁는 쪽이 덮지 않는다(Pushgateway 문서의 권고). 왜 평문: backend 내부 네트워크에서만 닿는다
  - job_name: openit-jobs
    honor_labels: true
    scheme: http
    static_configs:
      - targets: ['pushgateway:9091']
