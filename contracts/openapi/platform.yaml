openapi: 3.1.0
info:
  title: openit v7 platform API
  version: 7.0.0
  description: >-
    platform 은 표준 프로토콜로 일한다. 사람 인증은 OIDC(Keycloak), 서비스 인증서는 사설 CA(step-ca 의 ACME, RFC 8555), 백업 저장소는 restic REST 저장소, 기기 인증은 mTLS 이며 계약이 따로 정의하는 HTTP 작업은 없다. 건강 상태와 지표만 다른 서비스와 같은 모양으로 낸다.
  contact: { name: head }
servers:
  - url: "https://platform"
    description: "영역 사이 호출 주소. 영역 이름이 호스트 이름이다(TLS, 영역 게이트웨이 443)"
tags:
  - { name: health, description: "건강 상태와 지표" }
paths:
  /healthz:
    get:
      operationId: platformHealthz
      tags: [health]
      summary: 살아 있음 확인
      description: 프로세스가 살아 있는지만 본다. 의존 서비스는 보지 않는다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: platform
      security: []
      responses:
        "200":
          description: 살아 있다
          content: { application/health+json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /readyz:
    get:
      operationId: platformReadyz
      tags: [health]
      summary: 요청을 받을 준비 확인
      description: 데이터베이스와 이웃 같은 의존이 준비되었는지 본다. 준비되지 않았으면 503 으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: platform
      security: []
      responses:
        "200":
          description: 준비되었다
          content: { application/health+json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /metrics:
    get:
      operationId: platformMetrics
      tags: [health]
      summary: 지표 읽기
      description: Prometheus 가 주기적으로 읽는 지표를 텍스트 노출 형식으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: platform
      security: []
      responses:
        "200":
          description: 지표
          content: { text/plain: { schema: { $ref: "../components.yaml#/components/schemas/PrometheusExposition" } } }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    device_mtls:
      type: mutualTLS
      description: 키오스크 기기 인증서(mTLS). 공개 입구가 조직 PKI 의 CA 와 허용 목록으로 검증하고, 서비스는 확인된 기기 ID(인증서 주체 CN)를 믿는다(D136, D113).
    oidc:
      type: openIdConnect
      openIdConnectUrl: "https://platform/realms/openit/.well-known/openid-configuration"
      description: 사람은 OIDC(Keycloak)로 로그인한다. 공개 입구가 접근 토큰을 검증해 넘기고 서비스는 UserIdentityClaims 의 역할(UserRole)로 권한을 판단한다. 요구 값은 필요한 역할 이름이다(U82, D127).
    machine_token:
      type: http
      scheme: bearer
      description: 영역 사이 호출은 bearer 기계 토큰이다. 받는 쪽이 MachineTokenTable 로 호출자와 권한(MachineRole)을 가른다. 요구 값은 필요한 권한 이름이다(D122, D84).
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 한 번에 받을 항목의 최대 개수
      schema: { $ref: "../components.yaml#/components/schemas/PageLimit" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 next_cursor. 없으면 첫 쪽
      schema: { $ref: "../components.yaml#/components/schemas/PageCursor" }
  headers:
    RetryAfter:
      description: 같은 요청을 다시 보내기 전에 기다릴 초
      schema: { $ref: "../components.yaml#/components/schemas/RetryAfterSeconds" }
  responses:
    BadRequest:
      description: 요청 본문이나 매개변수가 계약을 어겼다(RFC 9110 15.5.1)
      content: { application/problem+json: { schema: { $ref: "../components.yaml#/components/schemas/ProblemDetails" } } }
    Unauthorized:
      description: 인증이 없거나 틀렸다(RFC 9110 15.5.2)
      content: { application/problem+json: { schema: { $ref: "../components.yaml#/components/schemas/ProblemDetails" } } }
    Forbidden:
      description: 인증은 됐으나 이 작업을 할 권한(역할)이 없다(RFC 9110 15.5.4)
      content: { application/problem+json: { schema: { $ref: "../components.yaml#/components/schemas/ProblemDetails" } } }
    NotFound:
      description: 가리킨 대상이 없다(RFC 9110 15.5.5)
      content: { application/problem+json: { schema: { $ref: "../components.yaml#/components/schemas/ProblemDetails" } } }
    Conflict:
      description: 지금 상태와 충돌한다. reason 으로 사유를 가른다(RFC 9110 15.5.10)
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content: { application/problem+json: { schema: { $ref: "../components.yaml#/components/schemas/ProblemDetails" } } }
    Unavailable:
      description: 지금은 처리할 수 없다. 변경은 되돌렸고 Retry-After 뒤에 다시 보낼 수 있다(RFC 9110 15.6.4)
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content: { application/problem+json: { schema: { $ref: "../components.yaml#/components/schemas/ProblemDetails" } } }
