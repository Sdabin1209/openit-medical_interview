openapi: 3.1.0
info:
  title: openit v7 업무 화면(admin-console) API
  version: 9.2.1
  description: >-
    모든 사람 화면(직원, 의사, 문항 세트를 올리는 사람, 실패 사례 검토자, 모델 활성화 승인자, 운영자)을 담은 정적 화면이며 서버 작업이 없다. 건강 상태와 지표만 낸다. 서버와의 대화는 survey-service 와 model-runtime 의 작업으로 한다(N05, N07).
  contact: { name: head }
servers:
  - url: "https://admin-console"
    description: "영역 사이 호출 주소. 영역 이름이 호스트 이름이다(TLS, 영역 게이트웨이 443)"
tags:
  - { name: health, description: "건강 상태와 지표" }
paths:
  /healthz:
    get:
      operationId: adminConsoleHealthz
      tags: [health]
      summary: 살아 있음 확인
      description: 프로세스가 살아 있는지만 본다. 의존 서비스는 보지 않는다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: admin-console
      security: [  ]
      responses:
        "200":
          description: 살아 있다
          content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /readyz:
    get:
      operationId: adminConsoleReadyz
      tags: [health]
      summary: 요청을 받을 준비 확인
      description: 데이터베이스와 이웃 같은 의존이 준비되었는지 본다. 준비되지 않았으면 503 으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: admin-console
      security: [  ]
      responses:
        "200":
          description: 준비되었다
          content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /metrics:
    get:
      operationId: adminConsoleMetrics
      tags: [health]
      summary: 지표 읽기
      description: Prometheus 가 주기적으로 읽는 지표를 텍스트 노출 형식으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: admin-console
      security: [  ]
      responses:
        "200":
          description: 지표
          content: { text/plain: { schema: { $ref: "../components.yaml#/components/schemas/PrometheusExposition" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
