openapi: 3.1.0
info:
  title: openit v7 문항 저작(question-authoring) API
  version: 7.0.0
  description: >-
    문항 자료 올리기와 초안, 미리보기, 저자 확인, 임상 승인, 후보와 문항 정의 읽기, 개선 신호 읽기를 낸다.
  contact: { name: head }
servers:
  - url: "https://question-authoring"
    description: "영역 사이 호출 주소. 영역 이름이 호스트 이름이다(TLS, 영역 게이트웨이 443)"
tags:
  - { name: drafts, description: "문항 자료 올리기와 초안, 미리보기, 저자 확인" }
  - { name: versions, description: "확정된 문항 세트 버전과 임상 승인" }
  - { name: signals, description: "저자가 읽는 개선 신호" }
  - { name: health, description: "건강 상태와 지표" }
paths:
  /v1/material-uploads:
    post:
      operationId: uploadMaterial
      tags: [drafts]
      summary: 문항 자료 올리기
      description: 저자가 가져온 문항 자료 파일을 올리면 서버가 읽어 문항 초안과 미리보기를 만든다. 형식은 미리 정하지 않으며, 읽지 못하거나 확신하지 못하면 추정하지 않고 PARSE_FAILED 상태의 초안으로 알려서 화면 입력(createDraftFromForm)으로 이어 가게 한다(F01, F02, D31, D33, U89).
      x-owner: question-authoring
      security: [ { oidc: [author] } ]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: "../components.yaml#/components/schemas/MaterialUpload" } } }
      responses:
        "201": { description: 만들어진 초안의 미리보기, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DraftPreview" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-drafts:
    post:
      operationId: createDraftFromForm
      tags: [drafts]
      summary: 화면 양식으로 문항 초안 만들기
      description: 저자가 화면 양식에 입력한 문진표 내용으로 초안을 만든다. 자료를 읽지 못할 때도 등록이 언제나 가능하게 하는 길이다(F01, D33(3)).
      x-owner: question-authoring
      security: [ { oidc: [author] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DraftFormInput" } } }
      responses:
        "201": { description: 만들어진 초안의 미리보기, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DraftPreview" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
    get:
      operationId: listDrafts
      tags: [drafts]
      summary: 문항 초안 목록
      description: 저자의 초안을 최근 것이 먼저 나오게 쪽으로 나누어 준다(F02).
      x-owner: question-authoring
      security: [ { oidc: [author] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
      responses:
        "200": { description: 초안 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DraftPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-drafts/{draft_id}/preview:
    parameters:
      - { name: draft_id, in: path, required: true, description: 미리볼 초안, schema: { $ref: "../components.yaml#/components/schemas/DraftId" } }
    get:
      operationId: getDraftPreview
      tags: [drafts]
      summary: 초안 미리보기 읽기
      description: 초안을 사람이 읽는 형태로 보여 준다. 저자는 개별 칸이 아니라 이 미리보기를 보고 확인한다(F02, D31).
      x-owner: question-authoring
      security: [ { oidc: [author] } ]
      responses:
        "200": { description: 미리보기, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DraftPreview" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-drafts/{draft_id}/confirmation:
    parameters:
      - { name: draft_id, in: path, required: true, description: 확정할 초안, schema: { $ref: "../components.yaml#/components/schemas/DraftId" } }
    post:
      operationId: confirmDraft
      tags: [drafts]
      summary: 저자 확인으로 문항 세트 버전 확정
      description: 저자가 미리보기를 보고 확인하면 문항 세트 버전이 확정된다. 확정은 본 미리보기의 해시에 묶이고 지금 초안과 다르면 409 로 거절한다. 2인 승인을 켠 설치에서는 검수자 승인이 끝나야 후보가 된다. 확정한 버전은 바뀌지 않는다(F03, D31, D30, D92, L13). 미리보기 해시가 다르면 409 PREVIEW_STALE 다.
      x-owner: question-authoring
      security: [ { oidc: [author] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DraftConfirmation" } } }
      responses:
        "201": { description: 확정된 문항 세트 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersion" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-versions/{question_set_version_id}:
    parameters:
      - { name: question_set_version_id, in: path, required: true, description: 읽을 문항 세트 버전, schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersionId" } }
    get:
      operationId: getQuestionSetVersion
      tags: [versions]
      summary: 문항 세트 버전 읽기
      description: 확정된 문항 세트 버전의 내용(문항 은행과 순서표)을 준다. model-lab 은 평가를 문항 유형·단위·범위별로 쪼개려고, synthetic-data 는 잡이 실행될 때 읽는다. 이웃은 읽기만 한다(F15, F16, D13, D49).
      x-owner: question-authoring
      security: [ { area_mtls: [], machine_token: [question-reader] }, { area_mtls: [], machine_token: [candidate-reader] }, { oidc: [author] }, { oidc: [clinical-reviewer] } ]
      responses:
        "200": { description: 문항 세트 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersion" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-versions/{question_set_version_id}/clinical-approval:
    parameters:
      - { name: question_set_version_id, in: path, required: true, description: 임상 근거를 승인할 문항 세트 버전, schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersionId" } }
    post:
      operationId: approveClinically
      tags: [versions]
      summary: 임상 근거 승인
      description: 2인 승인을 켠 설치에서 저자와 다른 검수자가 임상 근거를 승인한다. 저자와 같은 사람이면 SAME_PERSON_APPROVAL 로 409 를 낸다. 2인 승인이 꺼져 있으면 이 작업은 없는 것과 같아 404 로 답한다(F04, D92, D88 U9, D124, L13).
      x-owner: question-authoring
      security: [ { oidc: [clinical-reviewer] } ]
      responses:
        "200": { description: 승인이 기록된 문항 세트 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersion" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/candidate-question-sets:
    get:
      operationId: listCandidateQuestionSets
      tags: [versions]
      summary: 후보 문항 세트 버전 목록
      description: 후보가 된 문항 세트 버전의 요약과 검수 기록과 변경 분류를 쪽으로 나누어 준다. release-gate 의 후보 수집 잡이 가져가고, model-lab 과 synthetic-data 가 어떤 버전이 있는지 찾는 데도 쓴다(F05, F15, F16, D49, U85).
      x-owner: question-authoring
      security: [ { area_mtls: [], machine_token: [candidate-reader] }, { area_mtls: [], machine_token: [question-reader] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 버전만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 후보 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetCandidatePage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/signals:
    get:
      operationId: listImprovementSignals
      tags: [signals]
      summary: 개선 신호 목록
      description: 저자가 문항별 실패율과 혼동 사례를 읽는다. 서버는 ops-feedback 에서 읽어 둔 신호를 준다. 읽기만 있고 저자 경로는 별도 인증 뒤에서만 열린다(F21, F22, D124, U68, D88 U9).
      x-owner: question-authoring
      security: [ { oidc: [author] }, { oidc: [clinical-reviewer] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 신호만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 개선 신호 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ImprovementSignalPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /healthz:
    get:
      operationId: questionAuthoringHealthz
      tags: [health]
      summary: 살아 있음 확인
      description: 프로세스가 살아 있는지만 본다. 의존 서비스는 보지 않는다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: question-authoring
      security: [  ]
      responses:
        "200":
          description: 살아 있다
          content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /readyz:
    get:
      operationId: questionAuthoringReadyz
      tags: [health]
      summary: 요청을 받을 준비 확인
      description: 데이터베이스와 이웃 같은 의존이 준비되었는지 본다. 준비되지 않았으면 503 으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: question-authoring
      security: [  ]
      responses:
        "200":
          description: 준비되었다
          content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /metrics:
    get:
      operationId: questionAuthoringMetrics
      tags: [health]
      summary: 지표 읽기
      description: Prometheus 가 주기적으로 읽는 지표를 텍스트 노출 형식으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: question-authoring
      security: [  ]
      responses:
        "200":
          description: 지표
          content: { text/plain: { schema: { $ref: "../components.yaml#/components/schemas/PrometheusExposition" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
components:
  securitySchemes:
    oidc: { $ref: "../components.yaml#/components/securitySchemes/oidc" }
    machine_token: { $ref: "../components.yaml#/components/securitySchemes/machine_token" }
    area_mtls: { $ref: "../components.yaml#/components/securitySchemes/area_mtls" }
