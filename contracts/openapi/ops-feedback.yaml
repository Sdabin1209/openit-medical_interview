openapi: 3.1.0
info:
  title: openit v7 운영 피드백(ops-feedback) API
  version: 7.0.0
  description: >-
    턴 기록 수집, 실패 사례 읽기와 검토 결과 게시, 비식별 턴 기록, 문항별 실패 신호를 낸다.
  contact: { name: head }
servers:
  - url: "https://ops-feedback"
    description: "영역 사이 호출 주소. 영역 이름이 호스트 이름이다(TLS, 영역 게이트웨이 443)"
tags:
  - { name: traces, description: "턴 기록과 업무 로그 수집" }
  - { name: cases, description: "실패 사례와 검토" }
  - { name: signals, description: "문항별 실패 신호" }
  - { name: health, description: "건강 상태와 지표" }
paths:
  /v1/trace-deliveries:
    post:
      operationId: receiveTraceDelivery
      tags: [traces]
      summary: 턴 기록과 업무 로그 받기
      description: survey-service 가 턴이 끝난 뒤 턴 기록 원본과 업무 로그를 최소 1회 전달로 보낸다. 같은 세션 ID 와 턴 ID 는 한 번만 받고 나머지는 중복으로 센다(멱등). 비식별은 받은 뒤 ops-feedback 이 한다. 전송 재시도는 보내는 쪽 몫이다(F36, D15, D16).
      x-owner: ops-feedback
      security: [ { area_mtls: [], machine_token: [trace-sender] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/TraceDelivery" } } }
      responses:
        "200": { description: 받은 결과(새로 받은 수와 중복 수), content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/TraceDeliveryReceipt" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/cases:
    get:
      operationId: listFailureCases
      tags: [cases]
      summary: 실패 사례 목록
      description: 실패 사례를 쪽으로 나누어 준다. 검토자는 화면에서 검토할 사례를 고르고, model-lab 은 review_status=CONFIRMED 로 회귀 평가 집합을, synthetic-data 는 검토된 사례를 시드로 읽는다(F19, F20, F46, D52(2), D43, L17).
      x-owner: ops-feedback
      security: [ { oidc: [reviewer] }, { area_mtls: [], machine_token: [case-reader] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: review_status, in: query, required: false, description: 이 검토 상태의 사례만, schema: { $ref: "../components.yaml#/components/schemas/ReviewStatus" } }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 사례만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 사례 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCasePage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/cases/{case_id}:
    parameters:
      - { name: case_id, in: path, required: true, description: 읽을 사례, schema: { $ref: "../components.yaml#/components/schemas/CaseId" } }
    get:
      operationId: getFailureCase
      tags: [cases]
      summary: 실패 사례 읽기
      description: 사례 하나의 최신 검토 버전을 준다(F46, D71).
      x-owner: ops-feedback
      security: [ { oidc: [reviewer] }, { area_mtls: [], machine_token: [case-reader] } ]
      responses:
        "200": { description: 사례, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCase" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/cases/{case_id}/reviews:
    parameters:
      - { name: case_id, in: path, required: true, description: 검토할 사례, schema: { $ref: "../components.yaml#/components/schemas/CaseId" } }
    post:
      operationId: reviewFailureCase
      tags: [cases]
      summary: 실패 사례 검토 결과 게시
      description: 검토자가 사례의 검토 상태와 기대 출력과 고쳐 쓴 발화를 확정해 게시한다. 최신 버전과 내용이 모두 같으면 200 으로 변화 없음을, 하나라도 다르면 새 버전을 만들어 201 로 답한다(멱등). 검토자는 개인 계정으로 기록되며 승인자와 역할이 다르다(F45, D52(1), D71).
      x-owner: ops-feedback
      security: [ { oidc: [reviewer] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/CaseReview" } } }
      responses:
        "200": { description: 변화 없음(같은 검토), content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCase" } } } }
        "201": { description: 새 검토 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCase" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/deidentified-traces/{case_id}:
    parameters:
      - { name: case_id, in: path, required: true, description: 기록이 속한 사례, schema: { $ref: "../components.yaml#/components/schemas/CaseId" } }
    get:
      operationId: getDeidentifiedTrace
      tags: [cases]
      summary: 비식별 턴 기록 읽기
      description: 검토자가 사례를 검토하며 읽는, 비식별을 마친 턴 기록을 준다(F46, D71, D15).
      x-owner: ops-feedback
      security: [ { oidc: [reviewer] } ]
      responses:
        "200": { description: 비식별 턴 기록, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DeidentifiedTrace" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/failure-signals:
    get:
      operationId: listFailureSignals
      tags: [signals]
      summary: 문항별 실패 신호 목록
      description: 문항별 실패율과 혼동 사례를 쪽으로 나누어 준다. question-authoring 이 읽어 저자의 개선 신호로 쓴다(F21, D52(2), D124, U68).
      x-owner: ops-feedback
      security: [ { area_mtls: [], machine_token: [signal-reader] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 신호만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 신호 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureSignalPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /healthz:
    get:
      operationId: opsFeedbackHealthz
      tags: [health]
      summary: 살아 있음 확인
      description: 프로세스가 살아 있는지만 본다. 의존 서비스는 보지 않는다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: ops-feedback
      security: [  ]
      responses:
        "200":
          description: 살아 있다
          content: { application/health+json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /readyz:
    get:
      operationId: opsFeedbackReadyz
      tags: [health]
      summary: 요청을 받을 준비 확인
      description: 데이터베이스와 이웃 같은 의존이 준비되었는지 본다. 준비되지 않았으면 503 으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: ops-feedback
      security: [  ]
      responses:
        "200":
          description: 준비되었다
          content: { application/health+json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /metrics:
    get:
      operationId: opsFeedbackMetrics
      tags: [health]
      summary: 지표 읽기
      description: Prometheus 가 주기적으로 읽는 지표를 텍스트 노출 형식으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: ops-feedback
      security: [  ]
      responses:
        "200":
          description: 지표
          content: { text/plain: { schema: { $ref: "../components.yaml#/components/schemas/PrometheusExposition" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
components:
  securitySchemes:
    oidc: { $ref: "../components.yaml#/components/securitySchemes/oidc" }
    machine_token: { $ref: "../components.yaml#/components/securitySchemes/machine_token" }
    area_mtls: { $ref: "../components.yaml#/components/securitySchemes/area_mtls" }
