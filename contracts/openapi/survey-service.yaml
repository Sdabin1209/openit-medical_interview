openapi: 3.1.0
info:
  title: openit v7 문진 서비스(survey-service) API
  version: 9.0.0
  description: >-
    문진 세션과 턴, 직원 알림과 개입, 시작 코드, 결과(의사 화면·설치처의 의료 정보 시스템 당겨 가기·FHIR), 문항 세트 올리기와 활성화, 실패 사례 검토와 비식별 내보내기(model-lab 이 당겨 감)를 낸다. 턴 기록과 업무 로그는 이 영역 안의 컴포넌트가 저장하므로 영역 사이 작업이 없다. 값은 모두 ../components.yaml 의 정의를 참조한다.
  contact: { name: head }
servers:
  - url: "https://survey-service"
    description: "영역 사이 호출 주소. 영역 이름이 호스트 이름이다(TLS, 영역 게이트웨이 443)"
tags:
  - { name: questionnaires, description: 활성 문진표 }
  - { name: start-codes, description: 직원이 발급하는 일회용 시작 코드 }
  - { name: sessions, description: 키오스크가 진행하는 문진 세션과 턴 }
  - { name: staff, description: 직원 알림과 개입 }
  - { name: push, description: 웹 푸시 구독 }
  - { name: results, description: 문진 결과(의사 화면과 설치처의 의료 정보 시스템의 당겨 가기) }
  - { name: risk, description: 외부 위험 감지기의 신호 }
  - { name: question-sets, description: 문항 세트 올리기와 활성화 }
  - { name: failure-cases, description: 실패 사례 검토와 비식별 내보내기 }
  - { name: health, description: 건강 상태와 지표 }
paths:
  /v1/questionnaires:
    get:
      operationId: listActiveQuestionnaires
      tags: [questionnaires]
      summary: 활성 문진표 목록
      description: 지금 활성인 문항 세트가 있는 문진표의 목록을 준다. 키오스크가 환자에게 선택을 받을 때와 직원이 시작 코드에 문진표를 묶을 때 쓴다(N02, U86).
      x-owner: survey-service
      security: [ { device_mtls: [] }, { oidc: [staff] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/ForwardedClientCert" }
      responses:
        "200": { description: 활성 문진표들, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ActiveQuestionnaireList" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/start-codes:
    post:
      operationId: issueStartCode
      tags: [start-codes]
      summary: 일회용 시작 코드 발급
      description: 직원이 문진 대상자의 참조값으로 일회용 시작 코드(6자리 숫자)를 발급한다. 환자는 키오스크에서 이 코드로 세션을 시작한다. 설치처의 의료 정보 시스템은 같은 참조값으로 결과를 당겨 간다(C20, 사용자 결정 2026-11-10). 같은 Idempotency-Key 로 다시 보내면 앞서 발급한 코드를 돌려준다.
      x-owner: survey-service
      security: [ { oidc: [staff] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StartCodeIssueRequest" } } }
      responses:
        "201": { description: 발급한 코드, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StartCode" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/sessions:
    post:
      operationId: startSession
      tags: [sessions]
      summary: 시작 코드로 세션 시작
      description: 환자가 키오스크에서 시작 코드를 내고 세션을 시작한다. 서버는 코드에 묶인 대상자 참조값을 세션에 저장하고 키오스크에는 주지 않는다. 시작은 LoRA-B 만 불러 첫 문장을 만든다(N01, D74). 같은 기기가 같은 시작 코드로 다시 시작하면(응답을 못 받고 재전송한 경우) 같은 세션을 200 으로 돌려준다. 발급된 적 없는 코드는 422 START_CODE_INVALID, 만료는 409 START_CODE_EXPIRED, 다른 기기가 이미 쓴 코드는 409 START_CODE_USED 다. 기기별·코드별 실패 시도에는 한도를 두어 넘으면 429 와 Retry-After 로 답한다(NIST SP 800-63B 5.2.2). 문진표는 시작 코드에 묶인 것, 없으면 요청의 것, 없으면 기기 배치표(U86)의 것으로 정하고 활성 문진표가 하나뿐이면 그것이다. 모두 없고 활성 문진표가 둘 이상이면 환자가 골라야 하므로 422 QUESTIONNAIRE_REQUIRED 로 답하며, 이 응답은 시작 코드를 쓰지 않은 것으로 한다. 키오스크는 먼저 questionnaire_id 없이 보내고(같은 기기·같은 코드 재전송은 멱등) 이 사유일 때만 선택 화면을 보여 고른 값을 더해 다시 보낸다. 시작은 세션의 첫 활동이다(유휴 만료 기준은 getSessionState).
      x-owner: survey-service
      security: [ { device_mtls: [] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/ForwardedClientCert" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionStartRequest" } } }
      responses:
        "200": { description: 같은 기기가 같은 코드로 다시 시작해 앞서 만든 세션을 돌려준다, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionStarted" } } } }
        "201": { description: 시작한 세션, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionStarted" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "422": { $ref: "../components.yaml#/components/responses/UnprocessableEntity" }
        "429": { $ref: "../components.yaml#/components/responses/TooManyRequests" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/sessions/{session_id}/turns:
    parameters:
      - { name: session_id, in: path, required: true, description: 턴을 보낼 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    post:
      operationId: submitTurn
      tags: [sessions]
      summary: 환자 발화 한 턴 보내기
      description: 환자의 발화를 보내고 다음 문장을 받는다. 성공한 turn_id 를 다시 보내면 같은 결과를 받는다(멱등). 처리 중인 같은 turn_id 는 409 TURN_IN_PROGRESS 와 Retry-After 로 답한다. 값을 만들지 못하면 200 으로 failure_signal 을 주며 세션 상태는 바뀌지 않는다. failure_signal 을 준 turn_id 는 기록하지 않으므로(실패한 턴은 세션 상태를 바꾸지 않는다) 같은 turn_id 를 다시 보내면 다시 처리하고 그 결과가 기록된다(N01, N02, D55, D75(1), D86). 마지막 활동 뒤 KioskIdleResetSeconds 가 지난 ACTIVE 세션은 이 호출이 먼저 EXPIRED 로 판정하고, 없거나 끝난 세션과 같은 오류로 답한다(세션이 없으면 404, 끝나거나 멈추거나 만료된 세션은 409 SESSION_NOT_ACTIVE). 만료 판정을 통과한 호출은 활동이라 마지막 활동 시각을 새로 한다. 세션은 시작한 기기의 ID 로만 접근할 수 있고 다른 기기에는 404 로 존재를 숨긴다(D88 U8). 끝나거나 멈춘 세션에는 409 SESSION_NOT_ACTIVE 로 답한다. 한 문항에서 REASK 와 CONFIRM 이 ReaskLimit 만큼 이어진 뒤에도 정해지지 않으면 서비스가 그 문항을 SKIP 으로 합성해 건너뛰고(빈칸 원인 REASK_LIMIT) 서비스의 고정 안내 문장을 응답에 담는다. 이때 LoRA-B 에는 거짓 사유를 보내지 않는다.
      x-owner: survey-service
      security: [ { device_mtls: [] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/ForwardedClientCert" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/TurnRequest" } } }
      responses:
        "200": { description: 턴 결과, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/TurnResponse" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/sessions/{session_id}/end:
    parameters:
      - { name: session_id, in: path, required: true, description: 끝낼 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    post:
      operationId: endSession
      tags: [sessions]
      summary: 세션 끝내기
      description: 환자가 문진을 끝낸다. 문진표가 끝까지 가지 않았으면 ENDED_PARTIAL 로 끝나고 부분 결과가 남는다. 이미 끝난 세션에 다시 보내도 같은 결과를 준다. 마지막 활동 뒤 KioskIdleResetSeconds 가 지나 EXPIRED 가 된 세션에는 200 으로 status EXPIRED 를 준다(만료 판정은 이 호출에서도 한다. N01). 세션은 시작한 기기의 ID 로만 접근할 수 있고 다른 기기에는 404 로 존재를 숨긴다(D88 U8).
      x-owner: survey-service
      security: [ { device_mtls: [] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/ForwardedClientCert" }
      responses:
        "200": { description: 끝난 세션, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionEnded" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/sessions/{session_id}/state:
    parameters:
      - { name: session_id, in: path, required: true, description: 확인할 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    get:
      operationId: getSessionState
      tags: [sessions]
      summary: 세션 상태 확인
      description: 키오스크가 2초마다 읽어 직원이 정지를 풀었는지 안다. 정지가 풀린 뒤에는 다음 발화 턴을 받기 전까지 resume_text 를 준다(N02, D66(6)). 유휴 만료의 주체는 서버다. 활동은 startSession, submitTurn, requestStaffCall 호출이고, 마지막 활동 뒤 KioskIdleResetSeconds(60초)가 지난 ACTIVE 세션은 이 호출에서 EXPIRED 로 판정해 status 에 준다(이 읽기는 활동이 아니다). 멈춘(PAUSED) 세션은 만료하지 않는다. 만료 판정은 getSessionState, submitTurn, endSession 호출 때와 PURGE_EXPIRED 잡에서 한다. 키오스크의 화면 초기화는 화면 동작이라 서버에 알리지 않아도 된다(알리려면 endSession). 세션은 시작한 기기의 ID 로만 접근할 수 있고 다른 기기에는 404 로 존재를 숨긴다(D88 U8).
      x-owner: survey-service
      security: [ { device_mtls: [] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/ForwardedClientCert" }
      responses:
        "200": { description: 세션 상태, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionState" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/sessions/{session_id}/staff-calls:
    parameters:
      - { name: session_id, in: path, required: true, description: 직원을 부를 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    post:
      operationId: requestStaffCall
      tags: [sessions]
      summary: 직원 다시 부르기
      description: 직원 호출 알림이 닿지 않았을 때 키오스크가 직원을 다시 부른다. 세션은 멈추고 CALL_STAFF 알림이 새로 생긴다. 이미 열린 호출이 있으면 새로 만들지 않고 200 으로 그 알림을 다시 알린다(N01, L23, D95). 이 호출은 세션의 활동이다(유휴 만료 기준은 getSessionState). 세션은 시작한 기기의 ID 로만 접근할 수 있고 다른 기기에는 404 로 존재를 숨긴다(D88 U8).
      x-owner: survey-service
      security: [ { device_mtls: [] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/ForwardedClientCert" }
      responses:
        "200": { description: 앞서 만든 같은 직원 알림을 다시 알린다, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StaffAlert" } } } }
        "201": { description: 새로 만든 직원 알림(앞서 열린 호출이 있으면 200 으로 그 알림을 다시 알린다), content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StaffAlert" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/sessions/{session_id}/intervention:
    parameters:
      - { name: session_id, in: path, required: true, description: 개입할 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    post:
      operationId: decideIntervention
      tags: [staff]
      summary: 직원 개입 결정
      description: 직원이 멈춘 세션의 알림을 확인하거나 정지를 푼다. 푼 직원의 ID 는 인증된 사용자에서 얻어 기록한다(N05, D58(4)).
      x-owner: survey-service
      security: [ { oidc: [staff] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/InterventionDecision" } } }
      responses:
        "200": { description: 개입 뒤 세션 상태, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionState" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/staff-alerts:
    get:
      operationId: listStaffAlerts
      tags: [staff]
      summary: 직원 알림 목록
      description: 열려 있는 알림과 최근에 풀린 알림을 최근 것이 먼저 나오게 쪽으로 나누어 준다. 직원은 위험과 직원 호출을, 의사는 결과 도착 알림을 본다(N06).
      x-owner: survey-service
      security: [ { oidc: [staff] }, { oidc: [clinician] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
      responses:
        "200": { description: 알림 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StaffAlertPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/staff-alerts/stream:
    get:
      operationId: streamStaffAlerts
      tags: [staff]
      summary: 알림 스트림 구독
      description: 알림이 생기거나 풀릴 때 서버가 밀어 주는 Server-Sent Events 스트림이다. 이벤트 이름은 alert, resolved, heartbeat, resync 이다. alert 와 resolved 의 id 는 순번이고 heartbeat 와 resync 에는 id 가 없어 재개 위치를 바꾸지 않는다(D87). 각 이벤트의 data 는 StaffAlertEvent 이고 이벤트가 없으면 AlertStreamHeartbeatSeconds(15초)마다 heartbeat 를 보낸다(OpenAPI 3.1 에서 text/event-stream 의 스키마는 스트림 전체 본문이라 문자열 스트림(ServerSentEventStream)으로 두고 이벤트 data 의 스키마는 미디어 유형의 x-event-data-schema 확장으로 가리킨다). 연결이 끊기면 Last-Event-ID 로 이어 받고, 놓친 것이 있으면 resync 를 받는다(N06, D66(4), D87).
      x-owner: survey-service
      security: [ { oidc: [staff] }, { oidc: [clinician] } ]
      parameters:
        - { name: Last-Event-ID, in: header, required: false, description: 마지막으로 받은 이벤트의 순번, schema: { $ref: "../components.yaml#/components/schemas/EventSequence" } }
      responses:
        "200": { description: 이벤트 스트림(각 이벤트의 data 는 StaffAlertEvent, x-event-data-schema), content: { text/event-stream: { schema: { $ref: "../components.yaml#/components/schemas/ServerSentEventStream" }, x-event-data-schema: { $ref: "../components.yaml#/components/schemas/StaffAlertEvent" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/push-config:
    get:
      operationId: getPushConfig
      tags: [push]
      summary: 웹 푸시 VAPID 공개키 읽기
      description: 브라우저가 푸시를 구독할 때 쓰는 서버의 VAPID 공개키를 준다(N05, D66(7), RFC 8292).
      x-owner: survey-service
      security: [ { oidc: [staff] }, { oidc: [clinician] } ]
      responses:
        "200": { description: 공개키, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/PushConfig" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/push-subscriptions:
    post:
      operationId: registerPushSubscription
      tags: [push]
      summary: 웹 푸시 구독 등록
      description: 직원이나 의사의 브라우저가 만든 웹 푸시 구독을 그 사람의 계정에 묶어 저장한다. 직원에게는 위험과 직원 호출 알림이, 의사에게는 결과 도착 알림이 푸시로 간다. 전달은 표준 Web Push(RFC 8030, RFC 8291, RFC 8292)로 하며 내용은 WebPushPayload 다(N05, N06, C11, U92).
      x-owner: survey-service
      security: [ { oidc: [staff] }, { oidc: [clinician] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/PushSubscription" } } }
      responses:
        "201": { description: 저장한 구독, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/PushSubscriptionRegistered" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/results:
    get:
      operationId: listResults
      tags: [results]
      summary: 문진 결과 목록
      description: 문진 결과를 최근 것이 먼저 나오게 쪽으로 나누어 준다. 의사는 목록을 보고 설치처의 의료 정보 시스템은 대상자 참조값으로 걸러 당겨 간다. 끝나지 않은 세션은 부분 결과로 상태와 함께 나온다. 밀어 보내기는 없다(N06, N08, C10, U83, D102).
      x-owner: survey-service
      security: [ { oidc: [clinician] }, { machine_token: [result-reader] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: subject_ref, in: query, required: false, description: 이 참조값의 대상자 결과만, schema: { $ref: "../components.yaml#/components/schemas/SubjectRef" } }
        - { name: status, in: query, required: false, description: 이 상태의 세션 결과만, schema: { $ref: "../components.yaml#/components/schemas/SessionStatus" } }
      responses:
        "200": { description: 결과 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ResultPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/results/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, description: 결과를 볼 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    get:
      operationId: getResult
      tags: [results]
      summary: 문진 결과 상세
      description: 한 세션의 결과를 준다. 읽은 사람과 때를 접근 기록으로 남긴다(N06, N08, U83, U35). 기계 호출자(설치처의 의료 정보 시스템)가 읽으면 읽은 호출자와 때를, 의사가 읽으면 의사의 ID(OIDC 접근 토큰의 sub)와 때를 영역 안의 접근 기록에 남긴다. 접근 기록의 종류와 모양은 영역 안의 값이라 계약에 없다.
      x-owner: survey-service
      security: [ { oidc: [clinician] }, { machine_token: [result-reader] } ]
      responses:
        "200": { description: 결과, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/SessionResult" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/results/{session_id}/fhir:
    parameters:
      - { name: session_id, in: path, required: true, description: 결과를 FHIR 로 볼 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    get:
      operationId: getResultFhir
      tags: [results]
      summary: 문진 결과를 FHIR QuestionnaireResponse 로 조회
      description: 같은 결과를 HL7 FHIR R4 QuestionnaireResponse 로 낸다. 설치처의 의료 정보 시스템이 당겨 가는 표준 형식이며 리소스의 정의는 FHIR R4 사양을 참조한다(N08, C10, U83). 대응 규칙은 FhirMapping 이다. 오류는 problem+json 이 아니라 OperationOutcome 으로 낸다.
      x-owner: survey-service
      security: [ { oidc: [clinician] }, { machine_token: [result-reader] } ]
      responses:
        "200": { description: FHIR R4 QuestionnaireResponse, content: { application/fhir+json: { schema: { $ref: "../components.yaml#/components/schemas/FhirQuestionnaireResponse" } } } }
        "401": { $ref: "../components.yaml#/components/responses/FhirUnauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/FhirError" }
        "404": { $ref: "../components.yaml#/components/responses/FhirError" }
        "503": { $ref: "../components.yaml#/components/responses/FhirUnavailable" }
  /v1/results/{session_id}/acknowledgements:
    parameters:
      - { name: session_id, in: path, required: true, description: 확인할 결과의 세션, schema: { $ref: "../components.yaml#/components/schemas/SessionId" } }
    post:
      operationId: acknowledgeResult
      tags: [results]
      summary: 결과 확인 표시
      description: 의사가 결과를 봤다는 표시를 남긴다. 확인한 의사의 ID 는 인증된 사용자에서 얻는다. 같은 의사가 다시 보내도 처음 기록을 돌려준다(N05, U83).
      x-owner: survey-service
      security: [ { oidc: [clinician] } ]
      responses:
        "200": { description: 확인 기록, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ResultAcknowledgement" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/risk-signals:
    post:
      operationId: receiveRiskSignal
      tags: [risk]
      summary: 위험 신호 받기
      description: 외부 위험 감지기가 보낸 위험 신호를 받아 세션을 멈추고 직원 알림을 만든다. 위험 감지는 기본 꺼짐이어서 꺼져 있으면 403 으로 거절한다(N14, D85(2), L11). 꺼져 있으면 403 RISK_DETECTION_DISABLED, 세션이 끝났거나 멈췄으면 409 SESSION_NOT_ACTIVE 다. 같은 세션·분류·감지 시각의 신호는 한 번만 처리한다(멱등, 멱등 키 헤더 불필요).
      x-owner: survey-service
      security: [ { machine_token: [risk-detector] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/RiskSignal" } } }
      responses:
        "200": { description: 앞서 만든 같은 직원 알림을 다시 알린다, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StaffAlert" } } } }
        "201": { description: 새로 만든 직원 알림(같은 세션·분류·감지 시각의 신호를 다시 받으면 200 으로 같은 알림을 돌려준다), content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/StaffAlert" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/cases:
    get:
      operationId: listFailureCases
      tags: [failure-cases]
      summary: 실패 사례 목록
      description: 실패 사례를 쪽으로 나누어 준다. 검토자가 화면에서 검토할 사례를 고른다. 환자 발화 원문은 검토용이라 검토자 역할에만 나간다. model-lab 은 listFailureCaseExports 로 읽는다(N06, D15, L12).
      x-owner: survey-service
      security: [ { oidc: [reviewer] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: review_status, in: query, required: false, description: 이 검토 상태의 사례만, schema: { $ref: "../components.yaml#/components/schemas/ReviewStatus" } }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 사례만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 사례 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCasePage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/case-exports:
    get:
      operationId: listFailureCaseExports
      tags: [failure-cases]
      summary: 비식별 실패 사례 목록(기계 독자용)
      description: model-lab 이 review_status=CONFIRMED 로 당겨 가 회귀 평가 집합으로 쓴다(N09). 환자 발화 원문과 모델 출력은 담지 않고 검토자가 개인정보를 빼고 고쳐 쓴 문장과 기대 출력만 담는다(N09, D15, D52(2), L17).
      x-owner: survey-service
      security: [ { area_mtls: [], machine_token: [case-reader] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: review_status, in: query, required: false, description: 이 검토 상태의 사례만, schema: { $ref: "../components.yaml#/components/schemas/ReviewStatus" } }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 사례만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 사례 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCaseExportPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/cases/{case_id}:
    parameters:
      - { name: case_id, in: path, required: true, description: 읽을 사례, schema: { $ref: "../components.yaml#/components/schemas/CaseId" } }
    get:
      operationId: getFailureCase
      tags: [failure-cases]
      summary: 실패 사례 읽기
      description: 사례 하나의 최신 검토 버전을 검토자에게 준다. 환자 발화 원문이 들어 있다(N06, D71, L12).
      x-owner: survey-service
      security: [ { oidc: [reviewer] } ]
      responses:
        "200": { description: 사례, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCase" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/cases/{case_id}/reviews:
    parameters:
      - { name: case_id, in: path, required: true, description: 검토할 사례, schema: { $ref: "../components.yaml#/components/schemas/CaseId" } }
    post:
      operationId: reviewFailureCase
      tags: [failure-cases]
      summary: 실패 사례 검토 결과 게시
      description: 검토자가 사례의 검토 상태와 기대 출력과 고쳐 쓴 발화를 확정해 게시한다. 최신 버전과 내용이 모두 같으면 200 으로 변화 없음을, 하나라도 다르면 새 버전을 만들어 201 로 답한다(멱등). 검토자는 개인 계정(OIDC 접근 토큰의 sub)으로 기록되며 승인자와 역할이 다르다(N05, D52(1), D71). 본문의 base_case_version 이 최신이 아니면 409 CASE_VERSION_MISMATCH 다.
      x-owner: survey-service
      security: [ { oidc: [reviewer] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/CaseReview" } } }
      responses:
        "200": { description: 변화 없음(같은 검토), content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCase" } } } }
        "201": { description: 새 검토 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/FailureCase" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../components.yaml#/components/responses/Conflict" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/deidentified-traces/{case_id}:
    parameters:
      - { name: case_id, in: path, required: true, description: 기록이 속한 사례, schema: { $ref: "../components.yaml#/components/schemas/CaseId" } }
    get:
      operationId: getDeidentifiedTrace
      tags: [failure-cases]
      summary: 비식별 턴 기록 읽기
      description: 검토자가 사례를 검토하며 읽는, 비식별을 마친 턴 기록을 준다(N06, D71, D15).
      x-owner: survey-service
      security: [ { oidc: [reviewer] } ]
      responses:
        "200": { description: 비식별 턴 기록, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/DeidentifiedTrace" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-versions:
    post:
      operationId: uploadQuestionSet
      tags: [question-sets]
      summary: 문항 세트 올리기
      description: 시스템 밖에서 만든 문항 세트(제목, 문항 은행, 순서표)를 올려 새 버전으로 저장한다. 올린 사람은 인증된 사용자(OIDC 접근 토큰의 sub)에서 얻는다. 같은 문진표의 버전 순번은 서버가 올리고 한 번 저장한 버전은 바뀌지 않는다. 저장만 하고 활성으로 만들지는 않는다(N05, ADR 0019). 같은 Idempotency-Key 로 다시 보내면 앞서 저장한 버전을 돌려준다.
      x-owner: survey-service
      security: [ { oidc: [author] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetUpload" } } }
      responses:
        "201": { description: 저장한 문항 세트 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersion" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
    get:
      operationId: listQuestionSetVersions
      tags: [question-sets]
      summary: 문항 세트 버전 목록
      description: 저장한 문항 세트 버전을 최근 것이 먼저 나오게 쪽으로 나누어 준다. 올린 사람이 활성화할 버전을 고를 때 쓴다(N06).
      x-owner: survey-service
      security: [ { oidc: [author] } ]
      parameters:
        - { $ref: "../components.yaml#/components/parameters/Limit" }
        - { $ref: "../components.yaml#/components/parameters/Cursor" }
        - { name: questionnaire_id, in: query, required: false, description: 이 문진표의 버전만, schema: { $ref: "../components.yaml#/components/schemas/QuestionnaireId" } }
      responses:
        "200": { description: 문항 세트 버전 한 쪽, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersionPage" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-versions/{question_set_version_id}:
    parameters:
      - { name: question_set_version_id, in: path, required: true, description: 읽을 문항 세트 버전, schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersionId" } }
    get:
      operationId: getQuestionSetVersion
      tags: [question-sets]
      summary: 문항 세트 버전 읽기
      description: 저장한 문항 세트 버전의 내용(문항 은행과 순서표)을 준다(N06).
      x-owner: survey-service
      security: [ { oidc: [author] } ]
      responses:
        "200": { description: 문항 세트 버전, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersion" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../components.yaml#/components/responses/NotFound" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/question-set-versions/{question_set_version_id}/activation:
    parameters:
      - { name: question_set_version_id, in: path, required: true, description: 활성으로 만들 문항 세트 버전, schema: { $ref: "../components.yaml#/components/schemas/QuestionSetVersionId" } }
    post:
      operationId: activateQuestionSet
      tags: [question-sets]
      summary: 문항 세트 버전 활성화
      description: 저장한 문항 세트 버전을 그 문진표의 활성 버전으로 만든다. 새 세션부터 이 버전을 쓰고 진행 중인 세션은 시작할 때의 버전을 그대로 쓴다. 활성화한 사람은 인증된 사용자에서 얻는다. 이미 활성인 버전을 다시 활성화해도 결과는 같다(N05). 모델과의 호환은 이 작업이 확인하지 않고 model-runtime 이 추출 요청마다 문항 은행 버전(runtime_contract_version)으로 확인한다.
      x-owner: survey-service
      security: [ { oidc: [author] } ]
      responses:
        "200": { description: 활성 문항 세트, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ActiveQuestionSet" } } } }
