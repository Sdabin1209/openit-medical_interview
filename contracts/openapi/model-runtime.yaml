openapi: 3.1.0
info:
  title: openit v7 추론 서버(model-runtime) API
  version: 7.0.0
  description: >-
    활성 릴리스를 스스로 읽어 적재한 모델로 LoRA-A 추출과 LoRA-B 응답 생성을 하고 적재 상태를 낸다.
  contact: { name: head }
servers:
  - url: "https://model-runtime"
    description: "영역 사이 호출 주소. 영역 이름이 호스트 이름이다(TLS, 영역 게이트웨이 443)"
tags:
  - { name: inference, description: "LoRA-A 추출과 LoRA-B 응답 생성" }
  - { name: model, description: "모델 적재 상태" }
  - { name: health, description: "건강 상태와 지표" }
paths:
  /v1/extractions:
    post:
      operationId: extractAction
      tags: [inference]
      summary: LoRA-A 로 값과 행동 추출
      description: 환자 발화와 문항 순서표와 칸 규격을 받아 LoRA-A 로 행동과 칸 값을 뽑는다. 출력은 규칙 보증(값 범위, targets 가 values 의 부분집합, 다음 문항이 순서표와 맞음)을 마친 값이며 받는 쪽은 다시 검증하지 않는다. 끝내 형식을 못 지키면 값을 지어내지 않고 503 OUTPUT_INVALID 로 낸다(F33, F34, D74, D75(1), D104(3), D115, D108).
      x-owner: model-runtime
      security: [ { area_mtls: [], machine_token: [inference-caller] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ExtractionRequest" } } }
      responses:
        "200": { description: 보증을 마친 추출 결과, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ActionExtraction" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/responses:
    post:
      operationId: generateResponse
      tags: [inference]
      summary: LoRA-B 로 응답 문장 만들기
      description: 행동과 사유와 모은 값과 다음 자리를 받아 LoRA-B 로 환자에게 보일 문장을 만든다. 시작(START)은 LoRA-A 를 거치지 않고 이 작업만 부른다. 모델 입력 글자는 학습 데이터와 글자 단위로 같게 직렬화한다(F33, F34, D74, D77).
      x-owner: model-runtime
      security: [ { area_mtls: [], machine_token: [inference-caller] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ResponseRequest" } } }
      responses:
        "200": { description: 응답 문장, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ResponseResult" } } } }
        "400": { $ref: "../components.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /v1/model-status:
    get:
      operationId: getModelStatus
      tags: [model]
      summary: 모델 적재 상태 읽기
      description: 추론 서버가 지금 적재한 릴리스와 적재 상태를 준다. 적재는 추론 서버가 활성 릴리스를 스스로 읽어 일으키며 문진 서비스는 이 상태를 읽기만 한다(F35, C05, U45, D46).
      x-owner: model-runtime
      security: [ { area_mtls: [], machine_token: [inference-caller] } ]
      responses:
        "200": { description: 모델 상태, content: { application/json: { schema: { $ref: "../components.yaml#/components/schemas/ModelStatus" } } } }
        "401": { $ref: "../components.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../components.yaml#/components/responses/Forbidden" }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /healthz:
    get:
      operationId: modelRuntimeHealthz
      tags: [health]
      summary: 살아 있음 확인
      description: 프로세스가 살아 있는지만 본다. 의존 서비스는 보지 않는다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: model-runtime
      security: [  ]
      responses:
        "200":
          description: 살아 있다
          content: { application/health+json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /readyz:
    get:
      operationId: modelRuntimeReadyz
      tags: [health]
      summary: 요청을 받을 준비 확인
      description: 데이터베이스와 이웃 같은 의존이 준비되었는지 본다. 준비되지 않았으면 503 으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: model-runtime
      security: [  ]
      responses:
        "200":
          description: 준비되었다
          content: { application/health+json: { schema: { $ref: "../components.yaml#/components/schemas/HealthReport" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
  /metrics:
    get:
      operationId: modelRuntimeMetrics
      tags: [health]
      summary: 지표 읽기
      description: Prometheus 가 주기적으로 읽는 지표를 텍스트 노출 형식으로 낸다. 영역 안에서만 닿고 공개 입구로 내보내지 않는다(D129).
      x-owner: model-runtime
      security: [  ]
      responses:
        "200":
          description: 지표
          content: { text/plain: { schema: { $ref: "../components.yaml#/components/schemas/PrometheusExposition" } } }
        "503": { $ref: "../components.yaml#/components/responses/Unavailable" }
components:
  securitySchemes:
    machine_token: { $ref: "../components.yaml#/components/securitySchemes/machine_token" }
    area_mtls: { $ref: "../components.yaml#/components/securitySchemes/area_mtls" }
