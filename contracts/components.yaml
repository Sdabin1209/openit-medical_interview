    OciImageManifestMediaType: { type: string, const: "application/vnd.oci.image.manifest.v1+json", description: "OCI 이미지 매니페스트의 미디어 유형(모델 패키지도 이 매니페스트 형식을 쓴다)", x-owner: head, x-basis: "OCI Image Spec 1.1 manifest.md(mediaType 은 application/vnd.oci.image.manifest.v1+json)" }
    OciSchemaVersion: { type: integer, const: 2, minimum: 2, maximum: 2, description: "OCI 이미지 매니페스트의 schemaVersion(항상 2)", x-owner: head, x-basis: "OCI Image Spec 1.1 manifest.md(schemaVersion 은 2 여야 한다)" }
    ModelPackageOciManifest:
      type: object
