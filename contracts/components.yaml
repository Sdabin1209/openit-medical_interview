      description: "model-runtime 의 출력 검증이 낸 위반의 코드이고 semantic_violation_rate 가 센다. 코드는 ActionExtractionRules 와 ActionExtraction 스키마의 합격 조건에서만 나오고 조건 하나가 코드 하나다. 코드를 내는 검사는 model-runtime 의 출력 검증 한 곳이다(R7). 위반율은 값 고쳐 쓰기(D115) 전의 모델 출력으로 센다"
