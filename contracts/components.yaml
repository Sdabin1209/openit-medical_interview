openapi: 3.1.0
info:
  title: openit v7 영역 사이 공유 값
  version: 7.0.0
  description: >-
    영역 사이를 오가는 모든 값의 정본이다(JSON Schema 2020-12). HTTP 요청·응답뿐 아니라 HTTP 밖의 교환
    (배포가 영역에 주는 환경 입력과 비밀 파일 경로, 잡 입력·결과, 턴 기록)도 여기 한 번만 정의한다.
    x-owner 는 값을 책임지는 영역(areas.yaml), x-basis 는 근거(결정 번호, 표준, 측정, 사용자 결정)다.
  contact: { name: head }
paths: {}
components:
  schemas:
    # ======================================================================
    # 공통: 시각, 오류(RFC 9457), 쪽 나누기, 건강 상태
    # ======================================================================
    Timestamp: { type: string, format: date-time, maxLength: 35, description: "일이 일어난 때. UTC 오프셋을 포함한 RFC 3339 날짜-시각", x-owner: head, x-basis: "RFC 3339 5.6 date-time (최대 길이 35는 소수 9자리와 +hh:mm 을 포함한 표기 길이)" }
    ProblemType: { type: string, format: uri, pattern: "^(https://|about:blank$)", maxLength: 8000, description: "오류의 종류를 가리키는 절대 URI. 이 계약에서는 https://openit/problems/<ProblemReason 값> 을 쓰고 사유가 없으면 about:blank 다", x-owner: head, x-basis: "RFC 9457 3.1.1(type 은 URI 이고 기본은 about:blank, 상대 참조는 혼란을 낳는다), RFC 9110 4.1(URI 8000옥텟 지원 권고)" }
    ProblemTitle: { type: string, maxLength: 200, description: "오류 종류의 짧은 사람용 이름. 같은 종류면 항상 같다", x-owner: head, x-basis: "RFC 9457 3.1.3 (title), 최대 길이 값은 사용자 결정 2026-11-10(UD-01, 권고값 일괄 승인)" }
    HttpStatus: { type: integer, minimum: 400, maximum: 599, description: "오류 응답의 HTTP 상태 코드(클라이언트 오류 4xx, 서버 오류 5xx)", x-owner: head, x-basis: "RFC 9457 3.1.2 (status), RFC 9110 15.5 와 15.6 (4xx 와 5xx 범위)" }
    ProblemDetail: { type: string, maxLength: 4000, description: "이번 오류가 일어난 까닭의 사람용 설명. 환자 발화와 비밀 값은 넣지 않는다", x-owner: head, x-basis: "RFC 9457 3.1.4 (detail), D88(환자 발화 최소 수집), 최대 길이 값은 사용자 결정 2026-11-10(UD-02, 권고값 일괄 승인)" }
    ProblemInstance: { type: string, format: uri-reference, maxLength: 8000, description: "이번 오류 발생 하나를 가리키는 URI 참조(보통 요청 경로)", x-owner: head, x-basis: "RFC 9457 3.1.5 (instance), RFC 9110 4.1" }
    ProblemReason:
      type: string
      enum: [OUTPUT_INVALID, TURN_IN_PROGRESS, STALE_REPORT, ALREADY_DECIDED, START_CODE_INVALID, START_CODE_EXPIRED, START_CODE_USED, SESSION_NOT_ACTIVE, MODEL_NOT_LOADED, RELEASE_MISMATCH, DEADLINE_EXCEEDED, QUESTION_STRUCTURE_MISMATCH, SAME_PERSON_APPROVAL, PREVIEW_STALE, CASE_VERSION_MISMATCH, IMPORT_INCOMPLETE, RELEASE_NOT_ACTIVATABLE, ROLLBACK_TARGET_INVALID, ARTIFACT_DIGEST_MISMATCH, RISK_DETECTION_DISABLED]
      x-enum-descriptions:
        OUTPUT_INVALID: "LoRA-A 출력이 끝내 합격 조건을 지키지 못했다. 값을 지어내지 않고 503 으로 낸다(extractAction)"
        TURN_IN_PROGRESS: "같은 turn_id 의 앞선 요청이 아직 처리 중이다(submitTurn 409, Retry-After 를 따른다)"
        STALE_REPORT: "승인 요청이 가리킨 검토 보고서 해시가 지금 보고서와 다르다(decideSubmission 409)"
        ALREADY_DECIDED: "이 접수는 이미 사람이 결정했다(decideSubmission, redecideSubmission 409)"
        START_CODE_INVALID: "시작 코드가 발급된 적 없는 값이다(startSession 422)"
        START_CODE_EXPIRED: "시작 코드의 유효 기간이 지났다(startSession 409)"
        START_CODE_USED: "시작 코드는 일회용이라 다른 기기가 이미 썼다(startSession 409)"
        SESSION_NOT_ACTIVE: "세션이 끝났거나 멈춰 이 작업을 받을 수 없다(submitTurn, requestStaffCall, receiveRiskSignal 409)"
        MODEL_NOT_LOADED: "추론 서버가 활성 릴리스를 아직 적재하지 못했다(extractAction, generateResponse 503)"
        RELEASE_MISMATCH: "요청이 기대한 릴리스와 추론 서버가 적재한 릴리스가 다르다(extractAction, generateResponse 409)"
        DEADLINE_EXCEEDED: "서버가 정한 요청 전체 마감을 넘겼다. 변경은 되돌렸다(모든 작업의 503, 재시도 가능)"
        QUESTION_STRUCTURE_MISMATCH: "함께 운영하려는 문진표의 문항·칸 구조가 모델 패키지가 학습한 구조와 다르다(createSubmission 409)"
        SAME_PERSON_APPROVAL: "2인 임상 승인이 켜진 설치에서 저자와 검수자가 같은 사람이다(approveClinically 409)"
        PREVIEW_STALE: "확정 요청이 가리킨 미리보기 해시가 지금 초안과 다르다(confirmDraft 409)"
        CASE_VERSION_MISMATCH: "검토 요청이 가리킨 사례 버전이 최신이 아니다(reviewFailureCase 409)"
        IMPORT_INCOMPLETE: "아직 올라오지 않은 파일이 있어 가져오기를 마칠 수 없다(completeDatasetImport 409)"
        RELEASE_NOT_ACTIVATABLE: "승인되지 않은 릴리스라 활성화할 수 없다(activateRelease 409)"
        ROLLBACK_TARGET_INVALID: "되돌아갈 릴리스가 이전에 활성이었던 릴리스가 아니다(rollbackRelease 409)"
        ARTIFACT_DIGEST_MISMATCH: "올린 파일의 해시가 선언한 값과 다르다(uploadTrainingArtifact, uploadDatasetFile 400)"
        RISK_DETECTION_DISABLED: "위험 감지가 꺼져 있어 위험 신호를 받지 않는다(receiveRiskSignal 403)"
      description: "오류의 세부 사유. 상태 코드로 나뉘지 않는 경우를 클라이언트가 가르는 값. 각 값에 그 값을 내는 작업을 적었다"
      x-owner: head
      x-basis: "RFC 9457 3.2(확장 멤버), D75(1), D86, D69, D46, D120, U81, L13·D92, D16, 사용자 결정 2026-11-10(시작 코드)"
    JsonPointer: { type: string, format: json-pointer, maxLength: 8000, description: "요청 본문 안에서 잘못된 값의 위치(JSON 포인터)", x-owner: head, x-basis: "RFC 6901 5(JSON 문자열 표기), RFC 9457 4.1(확장 멤버 예시), 최대 길이는 프로젝트 선택 상한(UD-19)" }
    ProblemFieldError:
      type: object
      additionalProperties: false
      description: "요청의 칸 하나가 계약을 어긴 내용. 위치와 까닭"
      x-owner: head
      x-basis: "RFC 9457 3 (확장 멤버로 칸별 오류 나열), 4.1 의 예시 형태"
      required: [pointer, detail]
      properties:
        pointer: { $ref: "#/components/schemas/JsonPointer", description: "잘못된 값이 있는 요청 본문 안의 위치" }
        detail: { $ref: "#/components/schemas/ProblemDetail", description: "그 칸이 어긋난 까닭" }
    ProblemFieldErrors: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ProblemFieldError" }, description: "한 요청에서 어긋난 칸들의 목록", x-owner: head, x-basis: "사용자 결정 2026-11-10(UD-10)" }
    ProblemDetails:
      type: object
      additionalProperties: false
      description: "모든 오류 응답의 본문(application/problem+json). 4xx 와 5xx 모두 이 모양이다"
      x-owner: head
      x-basis: "RFC 9457 (Problem Details for HTTP APIs), RFC 9110 15.5 와 15.6"
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType", description: "오류 종류를 가리키는 URI 참조" }
        title: { $ref: "#/components/schemas/ProblemTitle", description: "오류 종류의 짧은 이름" }
        status: { $ref: "#/components/schemas/HttpStatus", description: "응답의 HTTP 상태 코드" }
        detail: { $ref: "#/components/schemas/ProblemDetail", description: "이번 오류의 설명" }
        instance: { $ref: "#/components/schemas/ProblemInstance", description: "이번 오류 발생을 가리키는 URI 참조" }
        reason: { $ref: "#/components/schemas/ProblemReason", description: "상태 코드만으로 가를 수 없는 세부 사유" }
        errors: { $ref: "#/components/schemas/ProblemFieldErrors", description: "요청 본문에서 어긋난 칸들(검증 실패일 때만)" }
    RetryAfterSeconds: { type: integer, minimum: 0, maximum: 120, description: "클라이언트가 같은 요청을 다시 보내기 전에 기다릴 초", x-owner: head, x-basis: "RFC 9110 10.2.3(Retry-After 의 delay-seconds), 상한은 D125 의 키오스크 재시도 예산 120초(다시 보내는 데 쓸 수 있는 총 시간보다 길게 기다리게 하지 않는다)" }
    PageLimit: { type: integer, minimum: 1, maximum: 100, default: 30, description: "한 번에 받을 항목의 최대 개수", x-owner: head, x-basis: "업계 관행(GitHub REST per_page 기본 30 최대 100, Stripe limit 최대 100), Google AIP-158" }
    PageCursor: { type: string, maxLength: 140, description: "다음 쪽을 가리키는 불투명 값. 서버가 만들고 클라이언트는 해석하지 않는다", x-owner: head, x-basis: "커서 내용(UUID 36 + RFC 3339 시각 35 + HMAC-SHA256 32옥텟 + 구분자 2)을 base64url(RFC 4648 5)로 쓴 길이 140, Google AIP-158(page_token 은 불투명)" }

    # ---- 시간 상한(영역 사이 약속, D125) ----
    KioskRequestLimitSeconds: { type: integer, const: 60, minimum: 60, maximum: 60, description: "키오스크가 서버 응답을 기다리는 실패 판정 상한(초)", x-owner: head, x-basis: "D125(키오스크 60초 > 게이트웨이 > survey 턴)" }
    KioskRetryBudgetSeconds: { type: integer, const: 120, minimum: 120, maximum: 120, description: "키오스크가 같은 요청을 다시 보내는 데 쓸 수 있는 총 시간(초)", x-owner: head, x-basis: "D125(재시도 예산 120초)" }
    KioskIdleResetSeconds: { type: integer, const: 60, minimum: 60, maximum: 60, description: "키오스크가 환자의 입력 없이 기다리다 세션을 초기화하는 시간(초). 멈춘 세션은 만료하지 않는다", x-owner: head, x-basis: "D88 U10(유휴 초기화), 사용자 결정 2026-11-10(UD-17)" }
    KioskProgressNoticeSeconds: { type: integer, const: 1, minimum: 1, maximum: 1, description: "키오스크가 응답이 늦을 때 진행 표시를 보이기 시작하는 시간(초)", x-owner: head, x-basis: "D125(Nielsen 1초 진행 표시)" }
    GatewayConnectLimitSeconds: { type: integer, const: 1, minimum: 1, maximum: 1, description: "영역 게이트웨이가 상류에 연결하는 데 쓰는 상한(초)", x-owner: head, x-basis: "D125(gateway 1+55초)" }
    GatewayPatientRouteLimitSeconds: { type: integer, const: 55, minimum: 55, maximum: 55, description: "환자·직원 경로에서 게이트웨이가 상류의 응답 머리글을 기다리는 상한(초)", x-owner: head, x-basis: "D125(gateway 1+55초)" }
    SurveyTurnLimitSeconds: { type: integer, const: 50, minimum: 50, maximum: 50, description: "survey-service 가 환자 턴 하나를 마치는 총 마감(초)", x-owner: head, x-basis: "D125(survey 턴 50초)" }
    ExtractClientLimitSeconds: { type: integer, const: 21, minimum: 21, maximum: 21, description: "survey-service 가 추출 요청을 기다리는 상한(초)", x-owner: head, x-basis: "D125(클라이언트 extract 21초)" }
    RespondClientLimitSeconds: { type: integer, const: 26, minimum: 26, maximum: 26, description: "survey-service 가 응답 생성 요청을 기다리는 상한(초)", x-owner: head, x-basis: "D125(클라이언트 respond 26초)" }
    ModelExtractLimitSeconds: { type: integer, const: 20, minimum: 20, maximum: 20, description: "추론 서버가 추출 하나를 마치는 상한(초)", x-owner: head, x-basis: "D125(model-runtime extract 20초)" }
    ModelRespondLimitSeconds: { type: integer, const: 25, minimum: 25, maximum: 25, description: "추론 서버가 응답 생성 하나를 마치는 상한(초)", x-owner: head, x-basis: "D125(model-runtime respond 25초)" }
    GateGatewayLimitSeconds: { type: integer, const: 180, minimum: 180, maximum: 180, description: "release-gate 사람 요청에서 게이트웨이가 응답 머리글을 기다리는 상한(초)", x-owner: head, x-basis: "D125(release-gate gateway 1+180초)" }
    GateServerLimitSeconds: { type: integer, const: 170, minimum: 170, maximum: 170, description: "release-gate 가 사람 요청 하나를 마치는 서버 마감(초)", x-owner: head, x-basis: "D125(release-gate 서버 170초), D120(마감 전파)" }
    GateScreenLimitSeconds: { type: integer, const: 190, minimum: 190, maximum: 190, description: "승인 화면이 release-gate 응답을 기다리는 상한(초)", x-owner: head, x-basis: "D125(release-gate 화면 190초)" }
    AuthoringGatewayLimitSeconds: { type: integer, const: 120, minimum: 120, maximum: 120, description: "question-authoring 사람 요청에서 게이트웨이가 응답 머리글을 기다리는 상한(초)", x-owner: head, x-basis: "D125(question-authoring gateway 1+120초)" }
    AuthoringServerLimitSeconds: { type: integer, const: 110, minimum: 110, maximum: 110, description: "question-authoring 이 사람 요청 하나를 마치는 서버 마감(초)", x-owner: head, x-basis: "D125(question-authoring 서버 110초), D120" }
    AuthoringScreenLimitSeconds: { type: integer, const: 130, minimum: 130, maximum: 130, description: "저작 화면이 question-authoring 응답을 기다리는 상한(초)", x-owner: head, x-basis: "D125(question-authoring 화면 130초)" }
    OpsGatewayLimitSeconds: { type: integer, const: 60, minimum: 60, maximum: 60, description: "ops-feedback 사람 요청에서 게이트웨이가 응답 머리글을 기다리는 상한(초)", x-owner: head, x-basis: "D125(ops-feedback gateway 1+60초)" }
    OpsServerLimitSeconds: { type: integer, const: 55, minimum: 55, maximum: 55, description: "ops-feedback 이 사람 요청 하나를 마치는 서버 마감(초)", x-owner: head, x-basis: "D125(ops-feedback 서버 55초), D120" }
    OpsScreenLimitSeconds: { type: integer, const: 70, minimum: 70, maximum: 70, description: "검토 화면이 ops-feedback 응답을 기다리는 상한(초)", x-owner: head, x-basis: "D125(ops-feedback 화면 70초)" }
    AlertStreamHeartbeatSeconds: { type: integer, const: 15, minimum: 15, maximum: 15, description: "알림 스트림이 아무 이벤트가 없을 때 heartbeat 를 보내는 간격(초)", x-owner: head, x-basis: "D66(4)(15초 ping), D87(heartbeat)" }
    SessionStatePollSeconds: { type: integer, const: 2, minimum: 2, maximum: 2, description: "키오스크가 세션 상태를 읽는 간격(초)", x-owner: head, x-basis: "D66(6)(2초 폴링)" }
    TimeBudgetTable:
      type: object
      additionalProperties: false
      description: "영역 사이 시간 상한의 표. 바깥이 안쪽보다 길다(키오스크 > 게이트웨이 > survey 턴 > 클라이언트 > 추론 서버, 사람 화면 > 게이트웨이 > 서버). 값은 목표(SLO 2초)가 아니라 실패 판정 상한이다. 실제 설정 입력은 이 값 이하로 둔다"
      x-owner: head
      x-basis: "D125(시간 상한: 목표와 실패 판정을 나눈다, 표준과 계산된 최악값 위의 여유, 측정 아님), D120"
      required: [kiosk_request, kiosk_retry_budget, kiosk_progress_notice, kiosk_idle_reset, gateway_connect, gateway_patient_route, survey_turn, extract_client, respond_client, model_extract, model_respond, gate_gateway, gate_server, gate_screen, authoring_gateway, authoring_server, authoring_screen, ops_gateway, ops_server, ops_screen, alert_stream_heartbeat, session_state_poll]
      properties:
        kiosk_request: { $ref: "#/components/schemas/KioskRequestLimitSeconds", description: "키오스크가 서버 응답을 기다리는 실패 판정 상한(초)" }
        kiosk_retry_budget: { $ref: "#/components/schemas/KioskRetryBudgetSeconds", description: "키오스크가 같은 요청을 다시 보내는 데 쓸 수 있는 총 시간(초)" }
        kiosk_idle_reset: { $ref: "#/components/schemas/KioskIdleResetSeconds", description: "키오스크가 입력 없이 기다리다 세션을 초기화하는 시간(초)" }
        kiosk_progress_notice: { $ref: "#/components/schemas/KioskProgressNoticeSeconds", description: "키오스크가 응답이 늦을 때 진행 표시를 보이기 시작하는 시간(초)" }
        gateway_connect: { $ref: "#/components/schemas/GatewayConnectLimitSeconds", description: "영역 게이트웨이가 상류에 연결하는 데 쓰는 상한(초)" }
        gateway_patient_route: { $ref: "#/components/schemas/GatewayPatientRouteLimitSeconds", description: "환자·직원 경로에서 게이트웨이가 상류의 응답 머리글을 기다리는 상한(초)" }
        survey_turn: { $ref: "#/components/schemas/SurveyTurnLimitSeconds", description: "survey-service 가 환자 턴 하나를 마치는 총 마감(초)" }
        extract_client: { $ref: "#/components/schemas/ExtractClientLimitSeconds", description: "survey-service 가 추출 요청을 기다리는 상한(초)" }
        respond_client: { $ref: "#/components/schemas/RespondClientLimitSeconds", description: "survey-service 가 응답 생성 요청을 기다리는 상한(초)" }
        model_extract: { $ref: "#/components/schemas/ModelExtractLimitSeconds", description: "추론 서버가 추출 하나를 마치는 상한(초)" }
        model_respond: { $ref: "#/components/schemas/ModelRespondLimitSeconds", description: "추론 서버가 응답 생성 하나를 마치는 상한(초)" }
        gate_gateway: { $ref: "#/components/schemas/GateGatewayLimitSeconds", description: "release-gate 사람 요청에서 게이트웨이가 응답 머리글을 기다리는 상한(초)" }
        gate_server: { $ref: "#/components/schemas/GateServerLimitSeconds", description: "release-gate 가 사람 요청 하나를 마치는 서버 마감(초)" }
