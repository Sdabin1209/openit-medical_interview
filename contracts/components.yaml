        config: { $ref: "#/components/schemas/ModelPackageBlobDescriptor", description: "목록표(ModelPackageManifest) 파일. 미디어 유형은 config 유형이다" }
        layers: { type: array, minItems: 4, maxItems: 4, items: { $ref: "#/components/schemas/ModelPackageBlobDescriptor" }, description: "어댑터 가중치와 시스템 프롬프트 파일들", x-basis: "어댑터 2개(AdapterRole 값의 수 2) 곱하기 파일 2개(가중치와 시스템 프롬프트) 4" }
    TokenLimit: { type: integer, minimum: 1, maximum: 32768, examples: [ 512 ], description: "한 번에 만들 수 있는 최대 토큰 수", x-owner: model-lab, x-basis: "Qwen3 모델 카드(Hugging Face Qwen/Qwen3-8B)의 Context Length: 32,768 natively. 출력 토큰 수의 상한을 이 기본 문맥 길이로 둔다" }
    SamplingTemperature: { type: number, minimum: 0, maximum: 2, examples: [ 0 ], description: "응답을 만들 때 다음 글자를 고르는 무작위성의 크기. 0 이면 가장 확률 높은 것만 고르고 클수록 다양하다", x-owner: model-lab, x-basis: "OpenAI Chat Completions API 의 temperature 범위: OpenAI OpenAPI 명세 CreateChatCompletionRequest 의 temperature 는 minimum 0, maximum 2(What sampling temperature to use, between 0 and 2). model-runtime 이 쓰는 OpenAI 호환 API 의 범위이며 D82 는 제약 디코딩만 정한다" }
    ConstrainedDecoding: { type: boolean, description: "출력을 스키마에 맞게 제약하며 만드는지(참이면 제약 디코딩)", x-owner: model-lab, x-basis: "D82, D83(제약 디코딩이 형식을 지킨다)" }
