    OciDigest: { type: string, pattern: "^sha256:[a-f0-9]{64}$", maxLength: 71, examples: [ "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ], description: "OCI 레지스트리의 내용 주소(digest). 알고리즘 이름 sha256, 콜론, 소문자 16진수 64자다. 모델 패키지(OCI 아티팩트)와 그 안의 파일을 가리킨다", x-owner: head, x-basis: "OCI Image Spec 1.1 descriptor.md Digests(algorithm:encoded, sha256 의 encoded 는 소문자 16진수 64자 `[a-f0-9]{64}`), 최대 길이는 sha256: 7자 더하기 64자, ADR 0019(모델 패키지는 digest 로 받는다)" }
    ModelPackageArtifactType: { type: string, const: "application/vnd.openit.model.package.v1", description: "모델 패키지 OCI 아티팩트의 artifactType. model-runtime 은 이 값이 아닌 아티팩트를 모델 패키지로 받지 않는다", x-owner: head, x-basis: "OCI Image Spec 1.1 manifest.md(artifactType 은 아티팩트의 종류를 가리키는 미디어 유형이고 RFC 6838 형식을 따른다), RFC 6838 3.2(공급자 트리 vnd.), ADR 0019(모델 패키지는 OCI 아티팩트)" }
    ModelPackageBlobMediaType:
