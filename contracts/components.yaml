    ResponseRequest:
      type: object
      additionalProperties: false
      description: "LoRA-B 의 입력(모델 입출력 v2). 어떤 절차로 어떤 문장을 만들지와 다음에 갈 자리를 알려 주는 모든 것"
      x-owner: head
      x-basis: "F33, D74, D77, 데이터셋 labels.py b_input 과 start_b_input, 실측 학습 데이터 B 입력 키(action, next, topic, known, user_utterance, reason, ask, hold, current, previous, note)"
      required: [action, topic, next]
      properties:
        action: { $ref: "#/components/schemas/ResponseAction", description: "문장을 만들 절차" }
        reason: { $ref: "#/components/schemas/ActionReason", description: "그 절차의 사유" }
        topic: { $ref: "#/components/schemas/TopicText", description: "지금 다루는 문항의 설명" }
        user_utterance: { $ref: "#/components/schemas/UtteranceText", description: "환자의 이번 말(START 에는 없다)" }
        known: { $ref: "#/components/schemas/KnownText", description: "이번 턴에 정해진 값의 설명(START 에는 없다)" }
        ask: { $ref: "#/components/schemas/AskText", description: "REASK 와 CONFIRM 에서 되묻는 내용" }
        previous: { $ref: "#/components/schemas/PreviousValueText", description: "CONFIRM 에서 이전에 저장된 값" }
        current: { $ref: "#/components/schemas/CurrentValueText", description: "CONFIRM 에서 이번에 말한 값" }
        hold: { $ref: "#/components/schemas/HoldText", description: "HOLD 와 SKIP 에서 비워 두는 부분" }
        note: { $ref: "#/components/schemas/OutOfSchemaNote", description: "REDIRECT 의 OUT_OF_SCHEMA 에서 환자가 말한 문진표 밖 건강 이야기" }
        next: { $ref: "#/components/schemas/ResponseNext", description: "응답 뒤에 가는 자리" }
      allOf:
        - if: { properties: { action: { const: START } }, required: [action] }
          then: { not: { anyOf: [ { required: [reason] }, { required: [user_utterance] }, { required: [known] }, { required: [ask] }, { required: [previous] }, { required: [current] }, { required: [hold] }, { required: [note] } ] } }
        - if: { properties: { action: { enum: [NEXT, CORRECT] } }, required: [action] }
          then: { required: [user_utterance, known], not: { required: [reason] } }
        - if: { properties: { action: { const: REASK } }, required: [action] }
          then: { required: [reason, ask] }
        - if: { properties: { action: { const: CONFIRM } }, required: [action] }
          then: { required: [reason, ask, previous, current] }
        - if: { properties: { action: { enum: [HOLD, SKIP] } }, required: [action] }
          then: { required: [reason, hold] }
        - if: { properties: { action: { const: REDIRECT } }, required: [action] }
          then: { required: [reason] }
        - if: { properties: { reason: { const: OUT_OF_SCHEMA } }, required: [reason] }
          then: { required: [note] }
          else: { not: { required: [note] } }
