    DatabaseUrl: { type: string, format: uri, pattern: "^postgresql(\\+asyncpg)?://", maxLength: 8000, description: "자기 영역 데이터베이스의 접속 주소(비밀번호는 넣지 않는다)", x-owner: deploy, x-basis: "ADR 0001(PostgreSQL 16, asyncpg), D126(DB 는 영역의 컴포넌트), D84" }
    BackupRepositoryUrl: { type: string, pattern: "^rest:https://", maxLength: 8000, description: "백업을 보낼 저장소 주소(restic REST 저장소)", x-owner: platform, x-basis: "D130(restic rest-server), restic REST 백엔드 사양" }
    OffsiteBackupUrl: { type: string, format: uri, maxLength: 8000, description: "서버 밖 백업 대상의 주소. 설치처가 정하는 설정이다", x-owner: platform, x-basis: "C09(서버 밖 대상이 필수, 주소는 설정), U6" }
    VapidSubject: { type: string, format: uri, maxLength: 1000, description: "웹 푸시 서버가 푸시 서비스에 밝히는 연락처(mailto 또는 https 주소)", x-owner: survey-service, x-basis: "RFC 8292 2.1(VAPID sub 클레임은 연락처 URI), 길이 규칙 L3" }
    StartCodeTtlSeconds: { type: integer, minimum: 1, maximum: 86400, description: "시작 코드의 유효 시간(초)", x-owner: survey-service, x-basis: "결정 대기: 유효 시간 값은 사용자 결정이 없다(C20 은 일회용 코드만 정했다), 상한 하루는 근거 없음" }
