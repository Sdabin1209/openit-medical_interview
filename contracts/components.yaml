    # ======================================================================
    # 모델 패키지, 평가 보고서, 학습 실행(model-lab)
    # ======================================================================
    SemanticVersion: { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$", maxLength: 64, description: "의미 있는 버전 문자열(MAJOR.MINOR.PATCH)", x-owner: head, x-basis: "Semantic Versioning 2.0.0, D46(MAJOR.MINOR 가 다르면 적재 거부)" }
    BaseModelName: { type: string, maxLength: 200, description: "기반 모델의 이름(모델 허브 식별자 형태, 예를 들어 Qwen/Qwen3-8B)", x-owner: model-lab, x-basis: "D74(3)(Qwen3 4B·8B·14B 기반), D81, 길이 규칙 L2" }
    AdapterRole:
      type: string
      enum: [LORA_A, LORA_B]
      x-enum-descriptions: { LORA_A: "환자 발화에서 값과 행동을 뽑는 어댑터", LORA_B: "응답 문장을 만드는 어댑터" }
      description: "어댑터의 역할"
      x-owner: model-lab
      x-basis: "D74, D45(역할별 설정)"
    ArtifactId: { type: string, format: uuid, description: "내려받는 파일(어댑터 가중치, 시스템 프롬프트, 실행 기록 등) 하나의 식별자", x-owner: head, x-basis: "RFC 9562 (UUID)" }
    ByteSize: { type: integer, minimum: 0, maximum: 9007199254740991, description: "파일의 크기(바이트)", x-owner: head, x-basis: "RFC 7493 2.2 (안전한 정수 최대)" }
    ArtifactRef:
      type: object
      additionalProperties: false
      description: "파일 하나를 가리키는 참조(식별자, 해시, 크기). 받는 쪽은 내려받아 해시를 확인한다"
      x-owner: head
      x-basis: "D49(해시는 클라이언트가 재검증), D27"
      required: [artifact_id, sha256, size_bytes]
      properties:
        artifact_id: { $ref: "#/components/schemas/ArtifactId", description: "파일 식별자" }
        sha256: { $ref: "#/components/schemas/Sha256Digest", description: "파일 내용의 해시" }
        size_bytes: { $ref: "#/components/schemas/ByteSize", description: "파일 크기" }
    ArtifactContent: { type: string, format: binary, maxLength: 17179869184, description: "내려받거나 올리는 파일의 내용(바이트열)", x-owner: head, x-basis: "RFC 9110 8(콘텐츠), 길이 상한 16 GiB 는 근거 없음(어댑터 가중치 크기를 측정하지 않았다)" }
    TokenLimit: { type: integer, minimum: 1, maximum: 32768, description: "한 번에 만들 수 있는 최대 토큰 수", x-owner: model-lab, x-basis: "Qwen3 의 기본 문맥 길이 32768" }
    SamplingTemperature: { type: number, minimum: 0, maximum: 2, description: "응답을 만들 때 무작위성의 크기(0 이면 가장 확률 높은 것)", x-owner: model-lab, x-basis: "vLLM SamplingParams temperature, 상한 2 는 근거 없음(관행)" }
    ConstrainedDecoding: { type: boolean, description: "출력을 스키마에 맞게 제약하며 만드는지(참이면 제약 디코딩)", x-owner: model-lab, x-basis: "D82, D83(제약 디코딩이 형식을 지킨다)" }
    ServingConfig:
      type: object
