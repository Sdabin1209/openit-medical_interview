openapi: 3.1.0
info:
  title: openit v7 영역 사이 공유 값
  version: 7.0.0
  description: >-
    영역 사이를 오가는 모든 값의 정본이다(JSON Schema 2020-12). HTTP 요청·응답뿐 아니라 HTTP 밖의 교환
    (배포가 영역에 주는 환경 입력과 비밀 파일 경로, 잡 입력·결과, 턴 기록)도 여기 한 번만 정의한다.
    x-owner 는 값을 책임지는 영역(areas.yaml), x-basis 는 근거(결정 번호, 표준, 측정, 사용자 결정)다.
    문자열 길이 상한의 단계 규칙은 README 의 길이 규칙을 따른다.
  contact: { name: head }
paths: {}
components:
  schemas:
    # ======================================================================
    # 공통: 시각, 오류(RFC 9457), 쪽 나누기, 건강 상태
    # ======================================================================
    Timestamp: { type: string, format: date-time, maxLength: 35, description: "일이 일어난 때. UTC 오프셋을 포함한 RFC 3339 날짜-시각", x-owner: head, x-basis: "RFC 3339 5.6 date-time (최대 길이 35는 소수 9자리와 +hh:mm 을 포함한 표기 길이)" }
    ProblemType: { type: string, format: uri-reference, maxLength: 8000, description: "오류의 종류를 가리키는 URI 참조. 이 계약에서는 ProblemReason 값을 경로로 하는 상대 참조를 쓴다", x-owner: head, x-basis: "RFC 9457 3.1.1 (type 은 URI 참조), RFC 9110 4.1 (URI 8000옥텟 지원 권고)" }
    ProblemTitle: { type: string, maxLength: 200, description: "오류 종류의 짧은 사람용 이름. 같은 종류면 항상 같다", x-owner: head, x-basis: "RFC 9457 3.1.3 (title), 길이 규칙 L2" }
    HttpStatus: { type: integer, minimum: 400, maximum: 599, description: "오류 응답의 HTTP 상태 코드(클라이언트 오류 4xx, 서버 오류 5xx)", x-owner: head, x-basis: "RFC 9457 3.1.2 (status), RFC 9110 15.5 와 15.6 (4xx 와 5xx 범위)" }
    ProblemDetail: { type: string, maxLength: 4000, description: "이번 오류가 일어난 까닭의 사람용 설명. 환자 발화와 비밀 값은 넣지 않는다", x-owner: head, x-basis: "RFC 9457 3.1.4 (detail), 길이 규칙 L4, D88(최소 수집)" }
    ProblemInstance: { type: string, format: uri-reference, maxLength: 8000, description: "이번 오류 발생 하나를 가리키는 URI 참조(보통 요청 경로)", x-owner: head, x-basis: "RFC 9457 3.1.5 (instance), RFC 9110 4.1" }
    ProblemReason:
      type: string
      enum: [OUTPUT_INVALID, TURN_IN_PROGRESS, STALE_REPORT, ALREADY_DECIDED, RELEASE_VERSION_MISMATCH, START_CODE_INVALID, START_CODE_EXPIRED, START_CODE_USED, SESSION_NOT_ACTIVE, MODEL_NOT_LOADED, DEADLINE_EXCEEDED, QUESTION_STRUCTURE_MISMATCH, SAME_PERSON_APPROVAL, DUPLICATE_DELIVERY]
      x-enum-descriptions:
        OUTPUT_INVALID: "LoRA-A 출력이 끝내 규칙을 지키지 못했다. 값을 지어내지 않고 503 으로 낸다"
        TURN_IN_PROGRESS: "같은 turn_id 의 앞선 요청이 아직 처리 중이다(409, Retry-After 를 따른다)"
        STALE_REPORT: "승인 요청이 가리킨 검토 보고서 해시가 지금 보고서와 다르다(409)"
        ALREADY_DECIDED: "이 접수는 이미 사람이 결정했다(409)"
        RELEASE_VERSION_MISMATCH: "릴리스의 규칙 세대나 서빙 구성의 버전이 설치본과 맞지 않아 적재를 거부했다"
        START_CODE_INVALID: "시작 코드가 발급된 적 없는 값이다"
        START_CODE_EXPIRED: "시작 코드의 유효 기간이 지났다"
        START_CODE_USED: "시작 코드는 일회용이라 이미 쓰였다"
        SESSION_NOT_ACTIVE: "세션이 진행 중이 아니어서 이 작업을 받을 수 없다(끝났거나 직원 개입으로 멈췄다)"
        MODEL_NOT_LOADED: "추론 서버가 활성 릴리스를 아직 적재하지 못했다"
        DEADLINE_EXCEEDED: "서버가 정한 요청 전체 마감을 넘겼다. 변경은 되돌렸다(재시도 가능)"
        QUESTION_STRUCTURE_MISMATCH: "함께 운영하려는 문진표의 문항·칸 구조가 모델 패키지가 학습한 구조와 다르다"
        SAME_PERSON_APPROVAL: "2인 임상 승인이 켜진 설치에서 저자와 검수자가 같은 사람이다"
        DUPLICATE_DELIVERY: "이미 받은 전달을 다시 받았다(멱등으로 처리했음을 알린다)"
      description: "오류의 세부 사유. 상태 코드로 나뉘지 않는 경우를 클라이언트가 가르는 값"
      x-owner: head
      x-basis: "RFC 9457 3.2 (확장 멤버), D75(1) OUTPUT_INVALID, D86 TURN_IN_PROGRESS, D69 STALE_REPORT·ALREADY_DECIDED, D46 적재 거부, 사용자 결정 2026-11-10 시작 코드, D120 마감, U81 구조 대조, L13·D92 2인 승인, D16 멱등"
    JsonPointer: { type: string, format: json-pointer, maxLength: 1000, description: "요청 본문 안에서 잘못된 값의 위치(JSON 포인터)", x-owner: head, x-basis: "RFC 6901, RFC 9457 4.1 (확장 멤버 예시), 길이 규칙 L3" }
    ProblemFieldError:
      type: object
      additionalProperties: false
      description: "요청의 칸 하나가 계약을 어긴 내용. 위치와 까닭"
      x-owner: head
      x-basis: "RFC 9457 3 (확장 멤버로 칸별 오류 나열), 4.1 의 예시 형태"
      required: [pointer, detail]
      properties:
        pointer: { $ref: "#/components/schemas/JsonPointer", description: "잘못된 값이 있는 요청 본문 안의 위치" }
        detail: { $ref: "#/components/schemas/ProblemDetail", description: "그 칸이 어긋난 까닭" }
    ProblemFieldErrors: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ProblemFieldError" }, description: "한 요청에서 어긋난 칸들의 목록", x-owner: head, x-basis: "개수 규칙 N2(PageLimit 최대값과 같다)" }
    ProblemDetails:
      type: object
      additionalProperties: false
      description: "모든 오류 응답의 본문(application/problem+json). 4xx 와 5xx 모두 이 모양이다"
      x-owner: head
      x-basis: "RFC 9457 (Problem Details for HTTP APIs), RFC 9110 15.5 와 15.6"
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType", description: "오류 종류를 가리키는 URI 참조" }
        title: { $ref: "#/components/schemas/ProblemTitle", description: "오류 종류의 짧은 이름" }
        status: { $ref: "#/components/schemas/HttpStatus", description: "응답의 HTTP 상태 코드" }
        detail: { $ref: "#/components/schemas/ProblemDetail", description: "이번 오류의 설명" }
        instance: { $ref: "#/components/schemas/ProblemInstance", description: "이번 오류 발생을 가리키는 URI 참조" }
        reason: { $ref: "#/components/schemas/ProblemReason", description: "상태 코드만으로 가를 수 없는 세부 사유" }
        errors: { $ref: "#/components/schemas/ProblemFieldErrors", description: "요청 본문에서 어긋난 칸들(검증 실패일 때만)" }
    RetryAfterSeconds: { type: integer, minimum: 0, maximum: 190, description: "클라이언트가 같은 요청을 다시 보내기 전에 기다릴 초", x-owner: head, x-basis: "RFC 9110 10.2.3 (Retry-After 의 delay-seconds), 상한은 D125 의 가장 긴 사람 화면 실패 판정 상한 190초" }
    PageLimit: { type: integer, minimum: 1, maximum: 100, default: 30, description: "한 번에 받을 항목의 최대 개수", x-owner: head, x-basis: "업계 관행(GitHub REST per_page 기본 30 최대 100, Stripe limit 최대 100), Google AIP-158" }
    PageCursor: { type: string, maxLength: 1000, description: "다음 쪽을 가리키는 불투명 값. 서버가 만들고 클라이언트는 해석하지 않는다", x-owner: head, x-basis: "Google AIP-158 (page_token 은 불투명), 길이 규칙 L3" }

    ServiceName:
      type: string
      enum: [survey-service, release-gate, question-authoring, ops-feedback, model-runtime, model-lab, synthetic-data, platform, kiosk-frontend, admin-console]
      x-enum-descriptions:
        survey-service: "문진 진행·세션·결과를 맡는 서버"
        release-gate: "출시 후보 검사·사람 승인·활성 릴리스를 맡는 서버"
        question-authoring: "문항 자료 등록·미리보기·저자 확인을 맡는 서버"
        ops-feedback: "턴 기록 수집·비식별·실패 사례 검토를 맡는 서버"
        model-runtime: "LoRA-A 추출과 LoRA-B 응답 생성을 맡는 추론 서버"
        model-lab: "모델 개발·평가와 모델 레지스트리를 맡는 서버"
        synthetic-data: "학습·평가 데이터셋 게시를 맡는 서버"
        platform: "공개 입구·사람 인증·사설 인증 기관·감시·백업 저장소"
        kiosk-frontend: "환자가 쓰는 키오스크 화면"
        admin-console: "사람이 쓰는 모든 업무 화면(직원·의사·저자·검수자·검토자·승인자·운영자)"
      description: "계약에 나오는 서비스(컨테이너 이미지가 하나인 단위)의 이름"
      x-owner: head
      x-basis: "contracts/README.md 서비스 목록, ADR 0002(서비스 폴더 하나는 이미지 하나), 사용자 결정 C01(사람 화면은 admin-console)"
    HealthStatus:
      type: string
      enum: [pass, warn, fail]
      x-enum-descriptions: { pass: "정상", warn: "동작하지만 주의가 필요하다", fail: "동작하지 못한다" }
      description: "건강 점검 하나 또는 전체의 결과"
      x-owner: head
      x-basis: "draft-inadarei-api-health-check (status 값 pass·warn·fail), D111"
    HealthCheckName: { type: string, maxLength: 64, description: "점검 항목의 이름(예를 들어 database)", x-owner: head, x-basis: "길이 규칙 L1, D111(/readyz 가 의존 준비를 점검)" }
    HealthCheck:
      type: object
      additionalProperties: false
      description: "건강 점검 항목 하나의 결과"
      x-owner: head
      x-basis: "draft-inadarei-api-health-check checks 멤버, D111"
      required: [name, status]
      properties:
        name: { $ref: "#/components/schemas/HealthCheckName", description: "점검한 의존 또는 기능의 이름" }
        status: { $ref: "#/components/schemas/HealthStatus", description: "이 항목의 점검 결과" }
        observed_at: { $ref: "#/components/schemas/Timestamp", description: "이 항목을 마지막으로 점검한 때" }
    HealthChecks: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/HealthCheck" }, description: "건강 점검 항목들", x-owner: head, x-basis: "개수 규칙 N1" }
    ImageRevision: { type: string, pattern: "^[0-9a-f]{40,64}$", maxLength: 64, description: "이미지를 만든 소스의 커밋 해시(소문자 16진수)", x-owner: deploy, x-basis: "OCI Image Spec 어노테이션 org.opencontainers.image.revision, ADR 0004" }
    HealthReport:
      type: object
      additionalProperties: false
      description: "서비스의 건강 점검 응답 본문(application/health+json). /healthz 와 /readyz 가 낸다"
      x-owner: head
      x-basis: "draft-inadarei-api-health-check, D111, F58"
      required: [status, service]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus", description: "전체 결과. /healthz 는 프로세스 생존만, /readyz 는 의존 준비까지 본다" }
        service: { $ref: "#/components/schemas/ServiceName", description: "응답한 서비스" }
        revision: { $ref: "#/components/schemas/ImageRevision", description: "실행 중인 이미지의 소스 커밋" }
        checks: { $ref: "#/components/schemas/HealthChecks", description: "의존별 점검 결과(/readyz 에서만)" }
    PrometheusExposition: { type: string, maxLength: 8388608, description: "Prometheus 텍스트 노출 형식의 지표 본문", x-owner: platform, x-basis: "Prometheus exposition format 0.0.4, D111, 길이 상한 8 MiB 는 근거 없음(측정 안 함)" }

    # ======================================================================
    # 인증: 사람(OIDC)과 기계(bearer 토큰)와 기기(mTLS)
    # ======================================================================
    UserId: { type: string, maxLength: 255, description: "사람 계정의 고유 식별자(OIDC 의 sub 값). 승인·검토·확인 기록에 남는다", x-owner: platform, x-basis: "OpenID Connect Core 1.0 2 (sub 는 최대 255 ASCII 문자), D88 U7(개인 식별 필수)" }
    UserRole:
      type: string
      enum: [staff, clinician, author, clinical-reviewer, reviewer, release-approver, operator, admin]
      x-enum-descriptions:
        staff: "병원 직원. 시작 코드 발급, 직원 알림 확인, 위험 정지 해제"
        clinician: "의사. 문진 결과 목록·상세·인쇄·확인 표시"
        author: "문항 저자. 문항 자료 등록과 미리보기 확인, 개선 신호 읽기"
        clinical-reviewer: "임상 근거 검수자. 2인 승인을 켠 설치에서 저자와 다른 사람이 승인"
        reviewer: "실패 사례 검토자. 사례를 검토해 기대 답과 고쳐 쓴 입력을 확정"
        release-approver: "출고 승인자. 후보와 활성 릴리스를 맞댄 보고서를 보고 승인 또는 반려"
        operator: "운영자. 릴리스 활성화·롤백, 재판정, 가입 승인과 역할 부여"
        admin: "계정 관리자. 초기 admin 계정은 임시 비밀번호로 시작한다"
      description: "사람 계정에 부여하는 역할. Keycloak 의 realm 역할 이름과 같다"
      x-owner: platform
      x-basis: "U82(표준 IdP 와 역할), U83(clinician), D71(reviewer·release-approver), D124(author·clinical-reviewer), D105(2)(operator), D58(4)(staff)"
    MachineRole:
      type: string
      enum: [result-reader, risk-detector, inference-caller, release-reader, model-serving, candidate-reader, decision-reader, question-reader, case-reader, signal-reader, trace-sender, rollback-requester, dataset-reader, dataset-publisher, model-publisher]
      x-enum-descriptions:
        result-reader: "병원 시스템. 문진 결과와 FHIR 결과를 당겨 간다"
        risk-detector: "외부 위험 감지기. 위험 신호를 보낸다"
        inference-caller: "survey-service. 추출과 응답 생성을 부르고 모델 적재 상태를 읽는다"
        release-reader: "활성 릴리스를 읽는 서비스(survey-service, ops-feedback)"
        model-serving: "추론 서버. 활성 릴리스의 모델 패키지를 스스로 읽는다"
        candidate-reader: "release-gate. 문항 세트와 모델 패키지 후보를 가져간다"
        decision-reader: "question-authoring 과 model-lab. 자기 산출물의 게이트 판정을 읽는다"
        question-reader: "model-lab 과 synthetic-data. 문항 정의를 읽는다"
        case-reader: "model-lab 과 synthetic-data. 확정된 실패 사례와 시드 사례를 읽는다"
        signal-reader: "question-authoring. 문항별 실패율과 혼동 사례를 읽는다"
        trace-sender: "survey-service. 턴 기록을 보낸다"
        rollback-requester: "ops-feedback. 롤백 요청을 낸다"
        dataset-reader: "model-lab. 지정 버전의 데이터셋을 읽는다"
        dataset-publisher: "데이터셋 담당. 확정한 최종 데이터를 게시한다"
        model-publisher: "학습 서버. 학습 결과를 모델 레지스트리에 게시한다"
      description: "기계 토큰에 부여하는 권한 이름. 작업마다 받는 영역이 요구한다"
      x-owner: platform
      x-basis: "D122(기계 토큰 경로는 읽을 것만 연다), D58(2)(401 과 403 구분), C16(학습 서버 게시), C10(병원 시스템 당겨 가기), C17(판정 읽기)"
    MachineClientName: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$", maxLength: 64, description: "기계 토큰을 쓰는 호출자의 이름(서비스 이름 또는 외부 시스템 이름)", x-owner: platform, x-basis: "DNS 레이블 규칙(RFC 1035 3.1 의 소문자 영숫자와 하이픈), 길이 규칙 L1" }
    MachineTokenEntry:
      type: object
      additionalProperties: false
      description: "기계 호출자 하나와 그에게 허용한 권한, 토큰이 든 파일의 경로"
      x-owner: platform
      x-basis: "D84(비밀은 파일), D122, D129"
      required: [client, roles, token_file]
      properties:
        client: { $ref: "#/components/schemas/MachineClientName", description: "호출자 이름" }
        roles: { type: array, maxItems: 15, items: { $ref: "#/components/schemas/MachineRole" }, description: "이 호출자에게 허용한 권한들" }
        token_file: { $ref: "#/components/schemas/SecretFilePath", description: "토큰 값이 든 파일의 경로(값은 이 표에 적지 않는다)" }
    MachineTokenTable:
      type: object
      additionalProperties: false
      description: "받는 영역이 기계 호출자를 가르는 표(배포가 파일로 준다)"
      x-owner: platform
      x-basis: "D84, D122, F54"
      required: [tokens]
      properties:
        tokens: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/MachineTokenEntry" }, description: "호출자별 권한과 토큰 파일" }
    RealmAccessClaim:
      type: object
      additionalProperties: false
