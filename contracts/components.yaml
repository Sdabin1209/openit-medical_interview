    SemanticVersion: { type: string, pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$", maxLength: 64, examples: [ "0.11.10" ], description: "의미 있는 버전 문자열(MAJOR.MINOR.PATCH)", x-owner: head, x-basis: "Semantic Versioning 2.0.0 2~10(공식 정규식: 숫자 부분은 선행 0 없이, 사전 버전 식별자는 비어 있지 않고 숫자만이면 선행 0 없이, 빌드 식별자는 비어 있지 않게), D46(MAJOR.MINOR 가 다르면 적재 거부). 최대 길이 64 는 SemVer 가 정하지 않은 이 계약의 선택이다" }
    BaseModelName: { type: string, maxLength: 96, pattern: "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)?$", not: { pattern: "(--|\\.\\.)" }, examples: [ "Qwen/Qwen3-8B" ], description: "기반 모델의 이름(모델 허브 식별자 형태, 예를 들어 Qwen/Qwen3-8B)", x-owner: model-lab, x-basis: "D74(Qwen3 기반 모델), D81(프로파일별 기반 모델). Hugging Face Hub 저장소 이름 규칙(huggingface_hub 의 validate_repo_id: 1~96자, repo_name 또는 namespace/repo_name, 글자는 영숫자와 - _ . 이고 -- 와 .. 는 금지, 원문 확인)" }
