        question_id: { $ref: "#/components/schemas/QuestionItemId", description: "가는 문항(END 에는 없다)" }
        text: { $ref: "#/components/schemas/QuestionText", description: "그 문항의 질문 문장(END 에는 없다)" }
      if: { properties: { type: { const: END } }, required: [type], x-basis: "labels.py b_input: next_item 이 END 면 next 는 type END 만 가진다(IO_SPEC.md 5.9)" }
      then: { not: { anyOf: [ { required: [question_id] }, { required: [text] } ] }, x-basis: "labels.py b_input: END 의 next 에는 question_id 와 text 가 없다" }
      else: { required: [question_id, text], x-basis: "labels.py b_input: NEXT 와 SAME 의 next 는 question_id 와 text 를 가진다" }
    ResponseRequest:
      type: object
      additionalProperties: false
      description: "LoRA-B 의 입력(모델 입출력 v2). 어떤 절차로 어떤 문장을 만들지와 다음에 갈 자리를 알려 주는 모든 것"
      x-owner: head
      x-basis: "N03, D74, D77, 데이터셋 labels.py b_input 과 start_b_input, 실측 학습 데이터 B 입력 키(action, next, topic, known, user_utterance, reason, ask, hold, current, previous, note)"
      required: [action, topic, next]
      properties:
        action: { $ref: "#/components/schemas/ResponseAction", description: "문장을 만들 절차" }
        reason: { $ref: "#/components/schemas/ActionReason", description: "그 절차의 사유" }
        topic: { $ref: "#/components/schemas/TopicText", description: "지금 다루는 문항의 설명" }
        user_utterance: { $ref: "#/components/schemas/UtteranceText", description: "환자의 이번 말(START 에는 없다)" }
        known: { $ref: "#/components/schemas/KnownText", description: "이번 턴에 정해진 값의 설명(START 에는 없다)" }
        ask: { $ref: "#/components/schemas/AskText", description: "REASK 와 CONFIRM 에서 되묻는 내용" }
        previous: { $ref: "#/components/schemas/PreviousValueText", description: "CONFIRM 에서 이전에 저장된 값" }
        current: { $ref: "#/components/schemas/CurrentValueText", description: "CONFIRM 에서 이번에 말한 값" }
        hold: { $ref: "#/components/schemas/HoldText", description: "HOLD 와 SKIP 에서 비워 두는 부분" }
        note: { $ref: "#/components/schemas/OutOfSchemaNote", description: "REDIRECT 의 OUT_OF_SCHEMA 에서 환자가 말한 문진표 밖 건강 이야기" }
        next: { $ref: "#/components/schemas/ResponseNext", description: "응답 뒤에 가는 자리" }
      allOf:
        - if: { properties: { action: { const: START } }, required: [action], x-basis: "labels.py start_b_input 와 IO_SPEC.md 5.1(문진 시작은 환자 말 없이 LoRA-A 를 부르지 않는다)" }
          then: { not: { anyOf: [ { required: [reason] }, { required: [user_utterance] }, { required: [known] }, { required: [ask] }, { required: [previous] }, { required: [current] }, { required: [hold] }, { required: [note] } ] }, properties: { next: { properties: { type: { const: NEXT } } } }, x-basis: "start_b_input 은 action, topic, next 만 만들고 next.type 은 NEXT 다" }
        - if: { properties: { action: { enum: [NEXT, CORRECT, REASK, CONFIRM, HOLD, SKIP, REDIRECT] } }, required: [action], x-basis: "labels.py b_input(action 이 START 가 아니면 user_utterance 와 known 을 항상 만든다)" }
          then: { required: [user_utterance, known], x-basis: "labels.py b_input: topic, user_utterance, known 은 START 밖의 모든 action 에 있다" }
        - if: { properties: { action: { enum: [NEXT, CORRECT] } }, required: [action], x-basis: "labels.py a_target 과 labels.py b_input(NEXT 와 CORRECT 에는 reason 이 없다)" }
          then: { not: { anyOf: [ { required: [reason] }, { required: [ask] }, { required: [previous] }, { required: [current] }, { required: [hold] } ] }, x-basis: "labels.py b_input: reason 은 A 출력에 있을 때만, ask 는 REASK·CONFIRM, previous·current 는 CONFIRM, hold 는 HOLD·SKIP 에서만 만든다" }
        - if: { properties: { action: { enum: [REASK, CONFIRM, HOLD, SKIP, REDIRECT] } }, required: [action], x-basis: "labels.py a_target(reason 은 NEXT·CORRECT 가 아닐 때 붙는다)" }
          then: { required: [reason], x-basis: "IO_SPEC.md 1장(이 action 들의 reason 표)" }
        - if: { properties: { action: { const: REASK } }, required: [action], x-basis: "labels.py b_input(ask 는 REASK·CONFIRM 에서 만든다)" }
          then: { required: [ask], not: { anyOf: [ { required: [previous] }, { required: [current] }, { required: [hold] } ] }, x-basis: "IO_SPEC.md 4.1: REASK 는 ask 가 있고 previous·current·hold 는 없다" }
        - if: { properties: { action: { const: CONFIRM } }, required: [action], x-basis: "labels.py b_input(CONFIRM 은 ask, previous, current 를 만든다)" }
          then: { required: [ask, previous, current], not: { required: [hold] }, x-basis: "IO_SPEC.md 4.1 과 5.5: CONFIRM 은 ask·previous·current 가 있고 hold 는 없다" }
        - if: { properties: { action: { enum: [HOLD, SKIP] } }, required: [action], x-basis: "labels.py b_input(hold 는 HOLD·SKIP 에서 만든다)" }
          then: { required: [hold], not: { anyOf: [ { required: [ask] }, { required: [previous] }, { required: [current] } ] }, x-basis: "IO_SPEC.md 5.7: HOLD·SKIP 은 hold 가 있고 ask·previous·current 는 없다" }
        - if: { properties: { action: { const: REDIRECT } }, required: [action], x-basis: "IO_SPEC.md 5.8(REDIRECT)" }
          then: { not: { anyOf: [ { required: [ask] }, { required: [previous] }, { required: [current] }, { required: [hold] } ] }, x-basis: "IO_SPEC.md 5.8: REDIRECT 에는 ask·previous·current·hold 가 없다" }
        - if: { properties: { action: { enum: [REASK, CONFIRM, REDIRECT] } }, required: [action], x-basis: "labels.py b_input(SAME_ITEM_ACTIONS = REASK, CONFIRM, REDIRECT 는 next.type 이 SAME)" }
          then: { properties: { next: { properties: { type: { const: SAME } } } }, x-basis: "labels.py b_input: SAME_ITEM_ACTIONS 의 next.type 은 SAME 이다" }
        - if: { properties: { action: { enum: [NEXT, CORRECT, HOLD, SKIP] } }, required: [action], x-basis: "labels.py b_input(그 밖의 action 은 next.type 이 NEXT, 다음 문항이 END 면 END)" }
          then: { properties: { next: { properties: { type: { enum: [NEXT, END] } } } }, x-basis: "labels.py b_input: next_item 이 END 면 END, 아니면 NEXT 다" }
        - if: { properties: { reason: { const: OUT_OF_SCHEMA } }, required: [reason], x-basis: "IO_SPEC.md 2.2(REDIRECT 의 OUT_OF_SCHEMA 는 note 를 넣는다)" }
          then: { required: [note], x-basis: "labels.py b_input(a_out 에 note 가 있으면 note 를 넣는다)" }
          else: { not: { required: [note] }, x-basis: "labels.py b_input(a_out 에 note 가 있으면 note 를 넣는다)" }
    ResponseGenerationRequest:
