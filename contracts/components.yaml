    ViolationCode:
      type: string
      enum: [OUTPUT_SCHEMA, SAVE_RULE, TARGET_NOT_IN_VALUES, NEXT_ITEM_MISMATCH, UNKNOWN_ITEM, UNKNOWN_SLOT, VALUE_TYPE_MISMATCH, VALUE_NOT_IN_OPTIONS, VALUE_OUT_OF_RANGE, OUT_OF_CURRENT_ITEM]
