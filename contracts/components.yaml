      x-basis: "D96(지표 이름은 자유 문자열이고 필수 지표는 정의를 따른다), D97"
    ExtraMetricName: { type: string, maxLength: 63, examples: [ "turn_count" ], description: "필수 지표 밖의 지표 이름(영문 소문자와 밑줄)", x-owner: model-lab, x-basis: "D96(지표 이름은 자유 문자열), 식별 이름 최대 63 은 사용자 결정 2026-11-10(UD-14)" }
