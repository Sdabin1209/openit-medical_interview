    CapabilityName: { type: string, pattern: "^CAP_[A-Z_]+$", maxLength: 40, examples: [ "CAP_NET_BIND_SERVICE" ], description: "컨테이너에 더하는 Linux capability 의 이름(추가 권한). 기본은 모두 뺀 상태에서 더한다", x-owner: deploy, x-basis: "D134(추가 권한), compose 서비스 키 cap_add, capabilities(7)(이름은 CAP_ 로 시작하는 대문자와 밑줄), 최대 길이 40 은 이 계약의 선택이다" }
