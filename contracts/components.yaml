        io.openit.exposure: { $ref: "#/components/schemas/ImageLabelValue", description: "ImageDeclaration.exposure 를 JSON 글자로 쓴 값" }
        io.openit.inputs: { $ref: "#/components/schemas/ImageLabelValue", description: "ImageDeclaration.inputs 를 JSON 글자로 쓴 값" }
        io.openit.jobs: { $ref: "#/components/schemas/ImageLabelValue", description: "ImageDeclaration.jobs 를 JSON 글자로 쓴 값(잡이 있는 이미지만)" }
        io.openit.database: { $ref: "#/components/schemas/ImageLabelValue", description: "ImageDeclaration.database 를 JSON 글자로 쓴 값(영역 데이터베이스 이미지만)" }
        org.opencontainers.image.revision: { $ref: "#/components/schemas/ImageRevision", description: "ImageDeclaration.revision. 이미지를 만든 소스 커밋(OCI 표준 라벨)" }
    ServerName: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", maxLength: 63, description: "배치 설정에서 서버를 가리키는 이름", x-owner: deploy, x-basis: "RFC 1035 2.3.1(레이블은 63자 이하)" }
    ServerEntry:
      type: object
      additionalProperties: false
      description: "서버 하나와 그 서버에서 띄울 서비스들"
      x-owner: deploy
      x-basis: "F64, U97, ADR 0002"
      required: [name, address, services]
      properties:
        name: { $ref: "#/components/schemas/ServerName", description: "서버 이름" }
        address: { $ref: "#/components/schemas/HostAddress", description: "서버의 호스트 이름 또는 주소" }
        services: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/ServiceName" }, description: "이 서버에서 띄울 서비스들" , x-basis: "ServiceName 값의 수 10" }
    DevicePlacement:
      type: object
      additionalProperties: false
      description: "키오스크 기기 하나에 기본으로 배치하는 문진표"
      x-owner: deploy
      x-basis: "F64, U86"
      required: [device_id, questionnaire_id]
      properties:
        device_id: { $ref: "#/components/schemas/DeviceId", description: "기본 문진표를 배치할 키오스크 기기" }
        questionnaire_id: { $ref: "#/components/schemas/QuestionnaireId", description: "그 기기의 기본 문진표" }
    DeploymentLayout:
      type: object
      additionalProperties: false
      description: "운영자가 deploy 에 주는 배치 설정(서버, 주소, 서비스 묶음, 기기별 문진표 배치)"
      x-owner: deploy
      x-basis: "F64, U97, U86"
      required: [servers, device_placements]
      properties:
        servers: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/ServerEntry" }, description: "서버들" , x-basis: "서버마다 서비스가 하나 이상이므로 서버 수는 서비스 수 10 이하. 서비스와 서버의 대응은 배치 설정으로 정한다(사용자 결정 2026-11-10(UD-15), U97)" }
        device_placements: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/DevicePlacement" }, description: "기기별 기본 문진표 배치들" , x-basis: "목록 크기 값은 사용자 결정 2026-11-10(UD-08, 권고값 일괄 승인)" }

  securitySchemes:
    device_mtls:
      type: mutualTLS
      description: 키오스크 기기는 mTLS 로 인증한다(RFC 8705 의 상호 TLS 인증). 클라이언트 인증서는 영역 게이트웨이가 조직 PKI 의 CA 와 허용 목록(DeviceAllowlist)으로 검증하고, 서비스에는 Envoy 표준 헤더 X-Forwarded-Client-Cert 로 넘긴다. 서비스는 게이트웨이와의 mTLS 연결로 온 요청의 이 헤더만 믿고, 게이트웨이는 클라이언트가 보낸 같은 헤더를 지우고 다시 쓴다(forward_client_cert_details SANITIZE_SET). 기기 ID 는 헤더의 Subject CN 이다(D136, D113).
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 사람은 OIDC(Keycloak)로 로그인하고 JWT 접근 토큰(RFC 9068)을 낸다. 서비스는 서명을 IdP 의 공개 키 집합(JWKS, RFC 7517)으로 검증하고 iss, aud, exp 를 확인한다. 읽는 클레임은 UserIdentityClaims 이며 그 밖의 클레임은 허용한다. 발급자 주소는 설치처마다 달라 환경 입력(OidcIssuerUrl)으로 받는다. 필요한 역할(UserRole)은 작업의 security 요구에 역할 이름으로 적는다(OpenAPI 3.1 4.8.30 의 role 이름 목록)(U82, D127).
    machine_token:
      type: http
      scheme: bearer
      description: 영역 사이 호출은 bearer 기계 토큰이다. 받는 쪽이 MachineTokenTable 로 호출자와 권한(MachineRole)을 가른다. 필요한 권한은 작업의 security 요구에 권한 이름으로 적는다(D122, D84).
    area_mtls:
      type: mutualTLS
      description: 영역 사이 호출은 사설 CA(C14, step-ca)가 발급한 인증서의 mTLS 이다(RFC 8705). 서비스는 같은 CA 의 클라이언트 인증서를 낸 호출만 받는다. 같은 서버 밖에서 오는 외부 기계 호출자(설치처의 의료 정보 시스템, 위험 감지기, 학습 서버, 데이터셋 담당, 원격 추론 서버)는 TLS 와 기계 토큰만으로 오므로 그 작업의 요구에는 이 체계가 없다(D129, C16).
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 한 번에 받을 항목의 최대 개수
      schema: { $ref: "#/components/schemas/PageLimit" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 next_cursor. 없으면 첫 쪽
      schema: { $ref: "#/components/schemas/PageCursor" }
    ForwardedClientCert:
      name: X-Forwarded-Client-Cert
      in: header
      required: false
      description: 영역 게이트웨이가 검증한 기기 인증서의 요약(Envoy 표준 헤더). 기기 인증서(device_mtls)를 요구하는 요청에는 게이트웨이가 항상 넣는다. 서비스는 게이트웨이와의 mTLS 연결에서만 이 값을 믿는다
      schema: { $ref: "#/components/schemas/ForwardedClientCertValue" }
    ReprDigest:
      name: Repr-Digest
      in: header
      required: true
      description: 올리는 파일 내용의 SHA-256 해시. 서버가 받은 내용으로 다시 계산해 다르면 400(ARTIFACT_DIGEST_MISMATCH)으로 거절한다
      schema: { $ref: "#/components/schemas/ReprDigestValue" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 요청을 다시 보낼 때 같은 값을 보내는 키. 같은 키의 재전송은 앞선 결과를 그대로 돌려준다
      schema: { $ref: "#/components/schemas/IdempotencyKeyValue" }
  headers:
    RetryAfter:
      description: 같은 요청을 다시 보내기 전에 기다릴 초
      schema: { $ref: "#/components/schemas/RetryAfterSeconds" }
    WwwAuthenticate:
      description: 인증 방식의 도전(RFC 9110 11.6.1, Bearer 는 RFC 6750 3)
      schema: { $ref: "#/components/schemas/AuthenticateChallenge" }
  responses:
    BadRequest:
      description: 요청 본문이나 매개변수가 계약을 어겼다(RFC 9110 15.5.1)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    Unauthorized:
      description: 인증이 없거나 틀렸다(RFC 9110 15.5.2). WWW-Authenticate 를 함께 낸다
      headers: { WWW-Authenticate: { $ref: "#/components/headers/WwwAuthenticate" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    Forbidden:
      description: 인증은 됐으나 이 작업을 할 권한(역할)이 없다(RFC 9110 15.5.4)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    NotFound:
      description: 가리킨 대상이 없거나 이 호출자에게 존재를 숨긴다(RFC 9110 15.5.5)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    Conflict:
      description: 지금 상태와 충돌한다. reason 으로 사유를 가른다(RFC 9110 15.5.10)
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    PayloadTooLarge:
      description: 본문이 크기 상한을 넘었다(RFC 9110 15.5.14)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    UnprocessableEntity:
      description: 형식은 맞지만 값을 처리할 수 없다. reason 으로 사유를 가른다(RFC 9110 15.5.21)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    TooManyRequests:
      description: 시도가 너무 잦다. Retry-After 뒤에 다시 보낸다(RFC 6585 4)
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    Unavailable:
      description: 지금은 처리할 수 없다. 변경은 되돌렸고 Retry-After 뒤에 다시 보낼 수 있다(RFC 9110 15.6.4)
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } }
    FhirError:
      description: FHIR 조회의 오류. FHIR R4 RESTful API 를 따라 OperationOutcome 으로 낸다
      content: { application/fhir+json: { schema: { $ref: "#/components/schemas/FhirOperationOutcome" } } }
