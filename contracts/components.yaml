    # ======================================================================
    # HTTP 밖의 교환: 잡 입력·결과, 배포가 영역에 주는 환경 입력, 이미지 선언, 배치 설정
    # ======================================================================
    JobName:
      type: string
      enum: [COLLECT_CANDIDATES, DETECT_FAILURES, PURGE_EXPIRED, PUBLISH_SEEDS, BACKUP, RESTORE]
      x-enum-descriptions:
        COLLECT_CANDIDATES: "release-gate 가 문항 세트와 모델 패키지 후보를 가져온다"
        DETECT_FAILURES: "ops-feedback 가 쌓인 턴 기록에서 실패 사례를 찾는다"
        PURGE_EXPIRED: "보존 기간이 지난 자료를 지운다"
        PUBLISH_SEEDS: "synthetic-data 가 검토된 실패 사례를 시드로 게시한다"
        BACKUP: "데이터 주인 영역이 자기 저장소를 백업한다"
        RESTORE: "데이터 주인 영역이 자기 저장소를 복구한다"
      description: "deploy 의 스케줄러가 한 번 실행하는 잡의 이름"
      x-owner: deploy
      x-basis: "F55, F56, D39, D111, D130, C08"
    JobTimeoutSeconds: { type: integer, minimum: 1, maximum: 86400, description: "잡 한 번이 끝나야 하는 시간 상한(초). deploy 가 이 값보다 큰 가장 작은 300초 배수를 주기로 정한다", x-owner: deploy, x-basis: "D131(주기는 선언된 시간 상한에서 deploy 가 만든다), C08, 상한 하루는 D85(5)(백업 매일)" }
    JobDeclaration:
      type: object
      additionalProperties: false
      description: "영역이 선언하는 잡 하나(이름과 시간 상한)"
      x-owner: deploy
      x-basis: "D131, F60"
      required: [job, timeout_seconds]
      properties:
        job: { $ref: "#/components/schemas/JobName", description: "잡 이름" }
        timeout_seconds: { $ref: "#/components/schemas/JobTimeoutSeconds", description: "이 잡의 시간 상한" }
    JobsDeclaration:
      type: object
      additionalProperties: false
      description: "이미지가 가진 잡들의 선언. 영역은 실행 일정을 모른다"
      x-owner: deploy
      x-basis: "D131, F60, 구조 규칙 4"
      required: [jobs]
      properties:
        jobs: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/JobDeclaration" }, description: "잡들" }
    JobRunInput:
      type: object
      additionalProperties: false
      description: "잡 한 번을 실행할 때 인자로 주는 입력. 같은 입력은 같은 결과를 낸다"
      x-owner: deploy
      x-basis: "F55, D39(멱등), RUNTIME R9.1(같은 입력이면 같은 출력)"
      required: [job, requested_at]
      properties:
        job: { $ref: "#/components/schemas/JobName", description: "실행할 잡" }
        requested_at: { $ref: "#/components/schemas/Timestamp", description: "스케줄러가 실행을 요청한 때(잡이 시각을 스스로 읽지 않고 이 값을 쓴다)" }
        snapshot_id: { $ref: "#/components/schemas/BackupSnapshotId", description: "RESTORE 일 때 복구할 스냅샷" }
    BackupSnapshotId: { type: string, pattern: "^[0-9a-f]{8,64}$", maxLength: 64, description: "백업 스냅샷 하나의 식별자(restic 스냅샷 ID 의 16진수 표기)", x-owner: platform, x-basis: "restic 스냅샷 ID(SHA-256 의 16진수, 축약형 8자 이상 허용), D130" }
    JobExitCode:
      type: integer
      enum: [0, 75, 1]
      x-enum-descriptions: { "0": "성공", "75": "일시적 실패(다음 실행에서 다시 한다)", "1": "실패" }
      minimum: 0
      maximum: 75
      description: "잡이 끝나며 내는 종료 코드"
      x-owner: deploy
      x-basis: "D130(종료 코드 0·75·1), sysexits.h EX_TEMPFAIL 75"
    ProcessedCount: { type: integer, minimum: 0, maximum: 2147483647, description: "잡이 처리한 항목의 수", x-owner: deploy, x-basis: "OpenAPI int32" }
    JobRunResult:
      type: object
      additionalProperties: false
      description: "잡 한 번의 실행 결과(표준 출력에 JSON 한 줄로 낸다)"
      x-owner: deploy
      x-basis: "F55, F56, D130, RUNTIME R9"
      required: [job, exit_code, started_at, finished_at]
      properties:
        job: { $ref: "#/components/schemas/JobName", description: "실행한 잡" }
        exit_code: { $ref: "#/components/schemas/JobExitCode", description: "종료 코드" }
        started_at: { $ref: "#/components/schemas/Timestamp", description: "시작한 때" }
        finished_at: { $ref: "#/components/schemas/Timestamp", description: "끝난 때" }
        processed_count: { $ref: "#/components/schemas/ProcessedCount", description: "처리한 항목 수" }
        snapshot_id: { $ref: "#/components/schemas/BackupSnapshotId", description: "BACKUP 이 만든 스냅샷" }

    ListenPort: { type: integer, minimum: 1, maximum: 65535, description: "서비스가 요청을 받는 TCP 포트 번호", x-owner: deploy, x-basis: "RFC 9293 3.1(포트는 16비트), 0 은 예약" }
    SecretFilePath: { type: string, pattern: "^/", maxLength: 4096, description: "비밀 값이 든 파일의 절대 경로. 값은 환경 변수나 설정에 적지 않고 이 파일에서만 읽는다", x-owner: deploy, x-basis: "D84(비밀은 NAME_FILE 파일), POSIX PATH_MAX 4096" }
    ConfigFilePath: { type: string, pattern: "^/", maxLength: 4096, description: "비밀이 아닌 설정 파일 또는 폴더의 절대 경로", x-owner: deploy, x-basis: "D133, POSIX PATH_MAX 4096" }
    PeerBaseUrl: { type: string, format: uri, pattern: "^https://", maxLength: 8000, description: "이웃 서비스의 기준 주소(항상 TLS)", x-owner: deploy, x-basis: "C14·D127(영역 사이 모든 HTTP 는 TLS), D129(https://영역이름), RFC 9110 4.1" }
    EgressProxyUrl: { type: string, format: uri, maxLength: 8000, description: "영역 게이트웨이의 나가는 CONNECT 터널 주소. Exposure.egress 에 선언한 상대에게만 닿는다", x-owner: platform, x-basis: "D128(OPENIT_EGRESS_PROXY, RFC 9110 9.3.6 CONNECT)" }
    LogLevel:
      type: string
      enum: [DEBUG, INFO, WARNING, ERROR]
      x-enum-descriptions: { DEBUG: "자세한 진단 기록", INFO: "보통 기록", WARNING: "경고 이상", ERROR: "오류만" }
      description: "표준 출력으로 내는 로그의 최소 수준"
