        system_prompt: { $ref: "#/components/schemas/ModelPackageBlobDescriptor", description: "이 어댑터와 짝이 되는 시스템 프롬프트 파일" }
        serving_config: { $ref: "#/components/schemas/ServingConfig", description: "서빙 설정" }
    RequiredMetricName:
      type: string
      enum: [value_precision, value_recall, precision_match_rate, next_item_accuracy, schema_valid_raw, semantic_violation_rate, ungrounded_number_rate, forbidden_expression_rate, length_p95_seconds]
      x-enum-descriptions:
        value_precision: "비율(ratio). 모델이 낸 값(key, value, status)이 정답과 모두 일치한 개수를 모델이 낸 값의 개수로 나눈 것. 분모는 모델이 낸 values 의 개수다(D96(1))"
        value_recall: "비율(ratio). 정답 값(key, value, status)을 모델이 모두 일치시켜 낸 개수를 정답 값의 개수로 나눈 것. 분모는 정답 values 의 개수다(D96(1))"
        precision_match_rate: "비율(ratio). 값이 맞은 것 중 precision 도 일치한 개수를 값이 맞은 개수로 나눈 것. 값과 따로 보고한다(D96(2))"
        next_item_accuracy: "비율(ratio). next_item 이 정답과 같은 개수를 같은 action 의 표본 수로 나눈 것. 분모는 action 별 표본 수이고 action 마다 따로 낸다(slice 가 action)(D96(3))"
        schema_valid_raw: "비율(ratio). 출력이 스키마를 통과한 비율. 제약 디코딩을 켠 값과 끈 값을 모두 보고한다(slice 가 constrained_decoding 의 켬과 끔)(D96(4))"
        semantic_violation_rate: "비율(ratio). 합격 조건(ActionExtractionRules 와 ActionExtraction 스키마)을 어긴 출력의 비율이고 값 고쳐 쓰기(D115) 전의 모델 출력으로 센다. 분모는 평가 표본 수이고 위반 코드(ViolationCode)별로 slice 를 낸다(slice 표기는 violation_code=<코드>)(D97, U11)"
        ungrounded_number_rate: "비율(ratio). 응답 문장의 숫자가 입력 재료에 없는 비율. 분모는 숫자가 든 응답 문장 수다(D94)"
        forbidden_expression_rate: "비율(ratio). 금지 표현이 든 응답의 비율. 금지 표현 목록이 없으면 sample_count 0 으로 낸다(D96(5))"
        length_p95_seconds: "초(seconds). 한 번의 모델 호출 시간의 95 백분위수(D96(6)). 단위를 밀리초에서 초로 바꾸며 이름도 Prometheus 명명 관례(기본 단위 접미사)에 맞췄다"
      description: "평가 보고서가 반드시 담는 지표의 이름과 뜻(계산식, 단위, 분모, slice). 이 밖의 지표 이름도 MetricName 으로 낼 수 있다"
      x-owner: model-lab
      x-basis: "D96(value_precision·value_recall 은 key, value, status 일치, precision 일치는 값과 따로 보고, next_item_accuracy 는 action 별 분모, schema_valid_raw 는 제약 디코딩 켠 값과 끈 값, forbidden_expression_rate 는 목록이 없으면 n=0, length_p95_seconds 는 D96(6)의 시간 지표이며 밀리초였던 단위와 이름은 헤드 결정 2026-11-10 으로 Prometheus 명명 관례의 초로 바꿨다), D97(semantic_violation_rate, 그룹 ACCURACY), D94(ungrounded_number_rate). precision_match_rate 의 이름과 분모(값이 맞은 것 중 precision 도 맞은 개수)는 D96(2)를 풀어 쓴 이 계약의 이름이다"
    MetricName:
      anyOf:
        - { $ref: "#/components/schemas/RequiredMetricName" }
        - { $ref: "#/components/schemas/ExtraMetricName" }
      description: "평가 지표의 이름. 필수 지표(RequiredMetricName) 또는 자유 이름"
