        service: { $ref: "#/components/schemas/ServiceName", description: "이 지표를 내는 서비스" }
        labels: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/PrometheusMetricLabel" }, description: "지표가 갖는 라벨들", x-basis: "PrometheusMetricLabel 값의 수 1" }
    PrometheusMetricType: { type: string, const: histogram, description: "Prometheus 히스토그램 지표 형", x-owner: head, x-basis: "U71(히스토그램), Prometheus 데이터 모델" }
    MetricGroupName: { type: string, maxLength: 63, examples: [ "ACCURACY" ], description: "평가 지표의 묶음 이름(예를 들어 ACCURACY)", x-owner: model-lab, x-basis: "D97(그룹 ACCURACY), 사용자 결정 2026-11-10(UD-14)" }
    MetricSliceDimension:
