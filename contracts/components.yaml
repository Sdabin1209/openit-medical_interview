openapi: 3.1.0
info:
  title: openit v7 영역 사이 공유 값
  version: 7.0.0
  description: >-
    영역 사이를 오가는 모든 값의 정본이다(JSON Schema 2020-12). HTTP 요청·응답뿐 아니라 HTTP 밖의 교환
    (배포가 영역에 주는 환경 입력과 비밀 파일 경로, 잡 입력·결과, 턴 기록)도 여기 한 번만 정의한다.
    x-owner 는 값을 책임지는 영역(areas.yaml), x-basis 는 근거(결정 번호, 표준, 측정, 사용자 결정)다.
  contact: { name: head }
paths: {}
components:
  schemas:
    # ======================================================================
    # 공통: 시각, 오류(RFC 9457), 쪽 나누기, 건강 상태
    # ======================================================================
    Timestamp: { type: string, format: date-time, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?([Zz]|[+-][0-9]{2}:[0-9]{2})$", maxLength: 35, examples: [ "2026-11-10T09:30:00+09:00" ], description: "일이 일어난 때. UTC 오프셋을 포함한 RFC 3339 날짜-시각", x-owner: head, x-basis: "RFC 3339 5.6(date-time). 소수 초 자릿수는 RFC 3339 가 제한하지 않아 사용자 결정 2026-11-10(UD-20)으로 9자리까지로 하고 최대 길이 35 는 그 표기와 오프셋을 더한 길이다" }
    ProblemType: { type: string, format: uri, pattern: "^[A-Za-z][A-Za-z0-9+.-]*:", maxLength: 8000, examples: [ "https://openit/problems/OUTPUT_INVALID" ], description: "오류의 종류를 가리키는 절대 URI(scheme 이 있는 URI). 기본은 about:blank 다. 이 계약의 서버는 사유가 있으면 https://openit/problems/<ProblemReason 값> 을 쓴다", x-owner: head, x-basis: "RFC 9457 3.1.1(type 은 URI 참조이고 기본은 about:blank, 상대 참조는 혼란을 낳으므로 scheme 이 있는 절대 URI 만 받는다), RFC 3986 3.1(scheme 문법), 사용자 결정 2026-11-10(UD-19: 최대 8000), 참고: RFC 9110 4.1 이 모든 구현에 최소 지원을 권고하는 URI 길이" }
    ProblemTitle: { type: string, maxLength: 200, examples: [ "모델 출력이 합격 조건을 지키지 못했다" ], description: "오류 종류의 짧은 사람용 이름. 같은 종류면 항상 같다", x-owner: head, x-basis: "RFC 9457 3.1.3 (title), 최대 길이 값은 사용자 결정 2026-11-10(UD-01, 권고값 일괄 승인)" }
    HttpStatus: { type: integer, minimum: 400, maximum: 599, examples: [ 503 ], description: "오류 응답의 HTTP 상태 코드(클라이언트 오류 4xx, 서버 오류 5xx)", x-owner: head, x-basis: "RFC 9457 3.1.2 (status), RFC 9110 15.5 와 15.6 (4xx 와 5xx 범위)" }
    ProblemDetail: { type: string, maxLength: 4000, examples: [ "모델 출력이 합격 조건을 끝내 지키지 못했다" ], description: "이번 오류가 일어난 까닭의 사람용 설명. 환자 발화와 비밀 값은 넣지 않는다", x-owner: head, x-basis: "RFC 9457 3.1.4 (detail), D88(환자 발화 최소 수집), 최대 길이 값은 사용자 결정 2026-11-10(UD-02, 권고값 일괄 승인)" }
    ProblemInstance: { type: string, format: uri-reference, maxLength: 8000, examples: [ "/v1/extractions" ], description: "이번 오류 발생 하나를 가리키는 URI 참조(보통 요청 경로)", x-owner: head, x-basis: "RFC 9457 3.1.5 (instance), 사용자 결정 2026-11-10(UD-19: 최대 8000)" }
    ProblemReason:
      type: string
      enum: [OUTPUT_INVALID, TURN_IN_PROGRESS, START_CODE_INVALID, START_CODE_EXPIRED, START_CODE_USED, SESSION_NOT_ACTIVE, MODEL_NOT_LOADED, QUESTION_BANK_VERSION_MISMATCH, DEADLINE_EXCEEDED, CASE_VERSION_MISMATCH, PACKAGE_INVALID, ROLLBACK_TARGET_INVALID, RISK_DETECTION_DISABLED]
      x-enum-descriptions:
        OUTPUT_INVALID: "LoRA-A 출력이 끝내 합격 조건(ActionExtractionRules)을 지키지 못했다. 값을 지어내지 않고 503 으로 낸다(openapi/model-runtime.yaml extractAction. model-runtime 의 output_guard)"
        TURN_IN_PROGRESS: "같은 turn_id 의 앞선 요청이 아직 처리 중이다(openapi/survey-service.yaml submitTurn 409, Retry-After 를 따른다. survey-service 의 turn)"
        START_CODE_INVALID: "시작 코드가 발급된 적 없는 값이다(openapi/survey-service.yaml startSession 422. start_code)"
        START_CODE_EXPIRED: "시작 코드의 유효 기간이 지났다(openapi/survey-service.yaml startSession 409. start_code)"
        START_CODE_USED: "시작 코드는 일회용이라 다른 기기가 이미 썼다(openapi/survey-service.yaml startSession 409. start_code)"
        SESSION_NOT_ACTIVE: "세션이 끝났거나 멈춰 이 작업을 받을 수 없다(openapi/survey-service.yaml submitTurn, requestStaffCall, receiveRiskSignal 409. session)"
        MODEL_NOT_LOADED: "추론 서버가 활성 모델 패키지를 아직 적재하지 못했다(openapi/model-runtime.yaml extractAction, generateResponse 503. package_loader)"
        QUESTION_BANK_VERSION_MISMATCH: "요청이 보낸 문항 은행 버전(runtime_contract_version)이 적재한 모델 패키지가 학습한 버전과 다르다(openapi/model-runtime.yaml extractAction, generateResponse 409. package_loader 가 적재한 패키지와 비교한다)"
        DEADLINE_EXCEEDED: "서버가 정한 요청 전체 마감을 넘겼다. 변경은 되돌렸다(두 영역의 모든 작업의 503, 재시도 가능)"
        CASE_VERSION_MISMATCH: "검토 요청이 가리킨 사례 버전이 최신이 아니다(openapi/survey-service.yaml reviewFailureCase 409. failure_case)"
        PACKAGE_INVALID: "레지스트리에서 받은 모델 패키지가 계약과 다르다(artifactType 이나 목록표가 틀렸거나 파일의 digest 가 목록표와 다르거나 모델 입출력 버전을 적재할 수 없다)(openapi/model-runtime.yaml getModelPackage, activateModelPackage 422. package_loader)"
        ROLLBACK_TARGET_INVALID: "되돌아갈 모델 패키지가 이전에 활성이었던 패키지가 아니다(openapi/model-runtime.yaml rollbackModelPackage 409. release)"
        RISK_DETECTION_DISABLED: "위험 감지가 꺼져 있어 위험 신호를 받지 않는다(openapi/survey-service.yaml receiveRiskSignal 403. link_risk_in)"
      description: "오류의 세부 사유. 상태 코드로 나뉘지 않는 경우를 클라이언트가 가르는 값. 각 값에 그 값을 내는 작업을 적었다"
      x-owner: head
      x-basis: "RFC 9457 3.2(확장 멤버로 상태 코드만으로 가를 수 없는 사유를 낸다). 각 코드는 x-enum-descriptions 에 적은 작업이 쓰고, 그 작업을 맡는 docs/design.md 2절 컴포넌트(output_guard, package_loader, release, session, turn, start_code, failure_case, link_risk_in)가 낸다. 정본에 이름이 있는 코드는 OUTPUT_INVALID(D75(1))와 TURN_IN_PROGRESS(D86)이고 START_CODE_* 의 뜻은 docs/v7-flow-resolutions.md C20(일회용 시작 코드)이다"
    JsonPointer: { type: string, format: json-pointer, maxLength: 8000, examples: [ "/input/user_utterance" ], description: "요청 본문 안에서 잘못된 값의 위치(JSON 포인터)", x-owner: head, x-basis: "RFC 6901 5(JSON 문자열 표기), RFC 9457 4.1(확장 멤버 예시), 최대 길이는 사용자 결정 2026-11-10(UD-19)" }
    ProblemFieldError:
      type: object
      additionalProperties: false
      description: "요청의 칸 하나가 계약을 어긴 내용. 위치와 까닭"
      x-owner: head
      x-basis: "RFC 9457 3 (확장 멤버로 칸별 오류 나열), 4.1 의 예시 형태"
      required: [pointer, detail]
      properties:
        pointer: { $ref: "#/components/schemas/JsonPointer", description: "잘못된 값이 있는 요청 본문 안의 위치" }
        detail: { $ref: "#/components/schemas/ProblemDetail", description: "그 칸이 어긋난 까닭" }
    ProblemFieldErrors: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ProblemFieldError" }, description: "한 요청에서 어긋난 칸들의 목록", x-owner: head, x-basis: "사용자 결정 2026-11-10(UD-10)" }
    ProblemDetails:
      type: object
      additionalProperties: false
      description: "모든 오류 응답의 본문(application/problem+json). 4xx 와 5xx 모두 이 모양이다"
      x-owner: head
      x-basis: "RFC 9457 (Problem Details for HTTP APIs), RFC 9110 15.5 와 15.6"
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType", description: "오류 종류를 가리키는 URI 참조" }
        title: { $ref: "#/components/schemas/ProblemTitle", description: "오류 종류의 짧은 이름" }
        status: { $ref: "#/components/schemas/HttpStatus", description: "응답의 HTTP 상태 코드" }
        detail: { $ref: "#/components/schemas/ProblemDetail", description: "이번 오류의 설명" }
        instance: { $ref: "#/components/schemas/ProblemInstance", description: "이번 오류 발생을 가리키는 URI 참조" }
        reason: { $ref: "#/components/schemas/ProblemReason", description: "상태 코드만으로 가를 수 없는 세부 사유" }
        errors: { $ref: "#/components/schemas/ProblemFieldErrors", description: "요청 본문에서 어긋난 칸들(검증 실패일 때만)" }
    RetryAfterSeconds: { type: integer, minimum: 0, maximum: 120, examples: [ 5 ], description: "클라이언트가 같은 요청을 다시 보내기 전에 기다릴 초", x-owner: head, x-basis: "RFC 9110 10.2.3(Retry-After 의 delay-seconds), 상한은 D125 의 키오스크 재시도 예산 120초(다시 보내는 데 쓸 수 있는 총 시간보다 길게 기다리게 하지 않는다)" }
    PageLimit: { type: integer, minimum: 1, maximum: 100, default: 30, examples: [ 30 ], description: "한 번에 받을 항목의 최대 개수", x-owner: head, x-basis: "사용자 결정 2026-11-10(UD-23: 목록 한 쪽의 최대 100), 기본 30 은 업계 관행(GitHub REST per_page 기본 30). Google AIP-158 은 최대 쪽 크기를 구현이 정하게 한다" }
    PageCursor: { type: string, maxLength: 96, examples: [ "eyJrIjoiM2YyYjhjMWUiLCJzIjoiYWJjIn0" ], description: "다음 쪽을 가리키는 불투명 값. 서버가 만들고 클라이언트는 해석하지 않는다", x-owner: head, x-basis: "커서는 서버가 만들고 클라이언트는 해석하지 않는 불투명 값이다(Google AIP-158 page_token). 내용은 Timestamp 35자 + UUID 36자 + 구분자 1자 = 72바이트이고 base64url(RFC 4648 5, 패딩 없음)로 쓰면 4 곱하기 올림(72/3) = 96자다" }

    # ---- 시간 상한(영역 사이 약속, D125) ----
    KioskRequestLimitSeconds: { type: integer, const: 60, minimum: 60, maximum: 60, description: "키오스크가 서버 응답을 기다리는 실패 판정 상한(초)", x-owner: head, x-basis: "D125(키오스크 60초 > 게이트웨이 > survey 턴)" }
    KioskRetryBudgetSeconds: { type: integer, const: 120, minimum: 120, maximum: 120, description: "키오스크가 같은 요청을 다시 보내는 데 쓸 수 있는 총 시간(초)", x-owner: head, x-basis: "D125(재시도 예산 120초)" }
    KioskIdleResetSeconds: { type: integer, const: 60, minimum: 60, maximum: 60, description: "키오스크가 환자의 입력 없이 기다리다 세션을 초기화하는 시간(초). 멈춘 세션은 만료하지 않는다", x-owner: head, x-basis: "D88 U10(유휴 초기화), 사용자 결정 2026-11-10(UD-17)" }
    KioskProgressNoticeSeconds: { type: integer, const: 1, minimum: 1, maximum: 1, description: "키오스크가 응답이 늦을 때 진행 표시를 보이기 시작하는 시간(초)", x-owner: head, x-basis: "D125(Nielsen 1초 진행 표시)" }
    GatewayConnectLimitSeconds: { type: integer, const: 1, minimum: 1, maximum: 1, description: "영역 게이트웨이가 상류에 연결하는 데 쓰는 상한(초)", x-owner: head, x-basis: "D125(gateway 1+55초)" }
    GatewayPatientRouteLimitSeconds: { type: integer, const: 55, minimum: 55, maximum: 55, description: "환자·직원 경로에서 게이트웨이가 상류의 응답 머리글을 기다리는 상한(초)", x-owner: head, x-basis: "D125(gateway 1+55초)" }
    SurveyTurnLimitSeconds: { type: integer, const: 50, minimum: 50, maximum: 50, description: "survey-service 가 환자 턴 하나를 마치는 총 마감(초)", x-owner: head, x-basis: "D125(survey 턴 50초)" }
    ExtractClientLimitSeconds: { type: integer, const: 21, minimum: 21, maximum: 21, description: "survey-service 가 추출 요청을 기다리는 상한(초)", x-owner: head, x-basis: "D125(클라이언트 extract 21초)" }
    RespondClientLimitSeconds: { type: integer, const: 26, minimum: 26, maximum: 26, description: "survey-service 가 응답 생성 요청을 기다리는 상한(초)", x-owner: head, x-basis: "D125(클라이언트 respond 26초)" }
    ModelExtractLimitSeconds: { type: integer, const: 20, minimum: 20, maximum: 20, description: "추론 서버가 추출 하나를 마치는 상한(초)", x-owner: head, x-basis: "D125(model-runtime extract 20초)" }
    ModelRespondLimitSeconds: { type: integer, const: 25, minimum: 25, maximum: 25, description: "추론 서버가 응답 생성 하나를 마치는 상한(초)", x-owner: head, x-basis: "D125(model-runtime respond 25초)" }
    AlertStreamHeartbeatSeconds: { type: integer, const: 15, minimum: 15, maximum: 15, description: "알림 스트림이 아무 이벤트가 없을 때 heartbeat 를 보내는 간격(초)", x-owner: head, x-basis: "D66(4)(15초 ping), D87(heartbeat)" }
    SessionStatePollSeconds: { type: integer, const: 2, minimum: 2, maximum: 2, description: "키오스크가 세션 상태를 읽는 간격(초)", x-owner: head, x-basis: "D66(6)(2초 폴링)" }
    TimeBudgetTable:
      type: object
      additionalProperties: false
      description: "영역 사이 시간 상한의 표. 바깥이 안쪽보다 길다(키오스크 > 게이트웨이 > survey 턴 > 클라이언트 > 추론 서버, 사람 화면 > 게이트웨이 > 서버). 값은 목표(SLO 2초)가 아니라 실패 판정 상한이다. 실제 설정 입력은 이 값 이하로 둔다"
      x-owner: head
      x-basis: "D125(시간 상한: 목표와 실패 판정을 나눈다, 표준과 계산된 최악값 위의 여유, 측정 아님), D120"
      required: [kiosk_request, kiosk_retry_budget, kiosk_progress_notice, kiosk_idle_reset, gateway_connect, gateway_patient_route, survey_turn, extract_client, respond_client, model_extract, model_respond, alert_stream_heartbeat, session_state_poll]
      properties:
        kiosk_request: { $ref: "#/components/schemas/KioskRequestLimitSeconds", description: "키오스크가 서버 응답을 기다리는 실패 판정 상한(초)" }
        kiosk_retry_budget: { $ref: "#/components/schemas/KioskRetryBudgetSeconds", description: "키오스크가 같은 요청을 다시 보내는 데 쓸 수 있는 총 시간(초)" }
        kiosk_idle_reset: { $ref: "#/components/schemas/KioskIdleResetSeconds", description: "키오스크가 입력 없이 기다리다 세션을 초기화하는 시간(초)" }
        kiosk_progress_notice: { $ref: "#/components/schemas/KioskProgressNoticeSeconds", description: "키오스크가 응답이 늦을 때 진행 표시를 보이기 시작하는 시간(초)" }
        gateway_connect: { $ref: "#/components/schemas/GatewayConnectLimitSeconds", description: "영역 게이트웨이가 상류에 연결하는 데 쓰는 상한(초)" }
        gateway_patient_route: { $ref: "#/components/schemas/GatewayPatientRouteLimitSeconds", description: "환자·직원 경로에서 게이트웨이가 상류의 응답 머리글을 기다리는 상한(초)" }
        survey_turn: { $ref: "#/components/schemas/SurveyTurnLimitSeconds", description: "survey-service 가 환자 턴 하나를 마치는 총 마감(초)" }
        extract_client: { $ref: "#/components/schemas/ExtractClientLimitSeconds", description: "survey-service 가 추출 요청을 기다리는 상한(초)" }
        respond_client: { $ref: "#/components/schemas/RespondClientLimitSeconds", description: "survey-service 가 응답 생성 요청을 기다리는 상한(초)" }
        model_extract: { $ref: "#/components/schemas/ModelExtractLimitSeconds", description: "추론 서버가 추출 하나를 마치는 상한(초)" }
        model_respond: { $ref: "#/components/schemas/ModelRespondLimitSeconds", description: "추론 서버가 응답 생성 하나를 마치는 상한(초)" }
        alert_stream_heartbeat: { $ref: "#/components/schemas/AlertStreamHeartbeatSeconds", description: "알림 스트림이 아무 이벤트가 없을 때 heartbeat 를 보내는 간격(초)" }
        session_state_poll: { $ref: "#/components/schemas/SessionStatePollSeconds", description: "키오스크가 세션 상태를 읽는 간격(초)" }
    ServiceName:
      type: string
      enum: [survey-service, model-runtime, platform, kiosk-frontend, admin-console]
      x-enum-descriptions:
        survey-service: "문진 진행·세션·결과, 턴 기록, 실패 사례 검토, 문항 세트 올리기와 활성화를 맡는 서버"
        model-runtime: "LoRA-A 추출과 LoRA-B 응답 생성, 출력 검증, 모델 패키지 적재와 활성화·롤백을 맡는 추론 서버"
        platform: "공개 입구·사람 인증·사설 인증 기관·감시·이미지와 모델 패키지 레지스트리"
        kiosk-frontend: "환자가 쓰는 키오스크 화면"
