        absent_map: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/FhirAbsentMapEntry" }, description: "빈칸 원인에서 FHIR 빈칸 사유로 가는 대응(UNKNOWN 과 UNCLEAR 와 REASK_LIMIT 는 asked-unknown, REJECTED 는 asked-declined, UNASKED 는 not-asked)", x-basis: "BlankReason 값의 수 5" }
