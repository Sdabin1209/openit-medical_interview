    MetricValue: { type: number, minimum: 0, maximum: 1000000000, description: "지표 값(비율 지표는 0 이상 1 이하, 시간 지표는 밀리초)", x-owner: model-lab, x-basis: "D96, 상한 10억은 근거 없음(측정 안 함)" }
    SampleCount: { type: integer, minimum: 0, maximum: 2147483647, description: "지표를 계산한 표본의 수", x-owner: model-lab, x-basis: "D96(n=0 도 보고한다), OpenAPI int32" }
